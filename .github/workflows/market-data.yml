name: 抓行情

# GitHub 的 runner 對外網路沒有限制，所以由它負責打 API，把結果寫回 repo。
# 受限的執行環境連不到 Yahoo 或證交所，但連得到 raw.githubusercontent.com，
# 於是就能讀到這裡產出的 data/live.json。
#
# ⚠️ 排程觸發只在「預設分支」上生效。這個 repo 的預設分支目前是
#    claude/baby-travel-packing-list-hwk2gb，所以這個檔案必須進到預設分支
#    才會照表跑；在其他分支上只能用手動觸發。

on:
  schedule:
    # cron 是 UTC。台北 = UTC+8。
    - cron: '50 22 * * 0-4'   # 台北 06:50　美股與台指期夜盤都收了，這些數字當天不會再變
    # 08:00 日韓開盤 → 09:00 台股開盤，這一小時是唯一需要頻繁更新的窗口。
    # GitHub 排程實際觸發常有數分鐘延遲，所以密集排，讓頁面每 60 秒輪詢時能拿到夠新的值。
    - cron: '2,12,22,32,42,52 0 * * 1-5'   # 台北 08:02～08:52 每 10 分鐘
    - cron: '2 1 * * 1-5'     # 台北 09:02　台股開盤後補一筆
    - cron: '45 5 * * 1-5'    # 台北 13:45　台股收盤後
  workflow_dispatch:           # 也可以在 Actions 頁面手動按

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓行情並計算均線
        run: node tools/fetch-live.mjs -o data/live.json

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "行情沒有變動，不 commit"
          else
            git commit -m "行情更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            git push
          fi

      - name: 摘要
        if: always()
        run: |
          if [ -f data/live.json ]; then
            node -e '
              const d = require("./data/live.json");
              console.log("產生於", d.generatedAtTaipei, "台北　成功", d.ok, "失敗", d.failed);
              for (const [k, v] of Object.entries(d.data)) {
                if (v.error) console.log("  ✗", (v.name||k), "—", v.error);
                else if (v.price !== undefined)
                  console.log("  ✓", (v.name||k).padEnd(14), String(v.price).padStart(10),
                              v.pct === null ? "" : (v.pct > 0 ? "+" : "") + v.pct + "%",
                              v.ma60 ? "　季線 " + v.ma60 + "　乖離 " + v.bias60 + "%" : "",
                              v.correctedBy ? "　（已依 " + v.correctedBy + " 校正，Yahoo 原值 " + v.priceYahoo + "）" : "");
              }
              const cc = d.crossCheck || {};
              if (Object.keys(cc).length) {
                console.log("\n── 雙來源對帳 Yahoo vs 證交所 ──");
                for (const [k, v] of Object.entries(cc))
                  console.log(" ", (v.agree ? "✅" : "⚠️ "), k.padEnd(7),
                              "Yahoo", String(v.yahoo).padStart(10),
                              "證交所", String(v.twse).padStart(10),
                              "差", v.diffPct + "%");
              } else {
                console.log("\n⚠️ 沒有對帳結果 —— 證交所那邊可能整個沒抓到，今天的台股數字只有單一來源");
              }
            '
          fi
