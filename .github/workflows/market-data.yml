name: 抓行情

# GitHub 的 runner 對外網路沒有限制，所以由它負責打 API，把結果寫回 repo。
# 受限的執行環境連不到 Yahoo 或證交所，但連得到 raw.githubusercontent.com，
# 於是就能讀到這裡產出的 data/live.json。
#
# ⚠️ 排程觸發只在「預設分支」上生效。這個 repo 的預設分支目前是
#    claude/baby-travel-packing-list-hwk2gb，所以這個檔案必須進到預設分支
#    才會照表跑；在其他分支上只能用手動觸發。

on:
  schedule:
    # cron 是 UTC。台北 = UTC+8。
    - cron: '50 22 * * 0-4'   # 台北 06:50　美股與台指期夜盤都收了，這些數字當天不會再變
    # 08:00 日韓開盤 → 09:00 台股開盤，這一小時是唯一需要頻繁更新的窗口。
    # GitHub 排程實際觸發常有數分鐘延遲，所以密集排，讓頁面每 60 秒輪詢時能拿到夠新的值。
    - cron: '2,12,22,32,42,52 0 * * 1-5'   # 台北 08:02～08:52 每 10 分鐘
    - cron: '2 1 * * 1-5'     # 台北 09:02　台股開盤後補一筆
    - cron: '45 5 * * 1-5'    # 台北 13:45　台股收盤後
  workflow_dispatch:           # 也可以在 Actions 頁面手動按
    inputs:
      rebuild_history:
        description: '整段重抓歷史日線（以證交所為準覆蓋既有檔案，約 6 分鐘）'
        type: boolean
        default: false

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓行情並計算均線
        env:
          # 選用：到 twelvedata.com 免費註冊拿金鑰，存成 repo secret 就會啟用。
          # 沒設也能跑，只是少一個備援來源。
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: node tools/fetch-live.mjs -o data/live.json

      # 歷史日線是「跌破季線的歷史統計」的唯一根據，放著不管就會愈來愈舊，
      # 舊到讓圖表看起來像現在、其實是幾個月前。每天收盤後補一次缺口。
      # 這一步失敗不擋整個 workflow：即時報價比歷史補檔急，而且那支腳本
      # 對不上帳時本來就不會寫檔，失敗的結果是「維持原狀」不是「寫進錯的」。
      - name: 補歷史日線
        id: hist
        continue-on-error: true
        run: |
          if [ "${{ inputs.rebuild_history }}" = "true" ]; then
            echo "整段重抓模式：以證交所為準覆蓋既有檔案"
            node tools/update-history.mjs --rebuild
          else
            node tools/update-history.mjs
          fi

      # 統計從 CSV 重算，寫成 data/history-stats.json，頁面優先讀它。
      # 這一步同時會對帳 watchtower.html 裡寫死的備援值有沒有跟 CSV 脫節；
      # 脫節不算失敗（線上讀 JSON 看到的是對的），但一定要在 log 上喊出來。
      - name: 重算歷史統計
        id: stats
        continue-on-error: true
        run: node tools/update-stats.mjs

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/daily-*.csv data/history-stats.json
          if git diff --staged --quiet; then
            echo "行情沒有變動，不 commit"
          else
            git commit -m "行情更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            git push
          fi

      # 歷史檔涵蓋到哪一天要看得見。落後太多就在 log 上喊，
      # 免得統計圖悄悄地一直用幾個月前的資料。
      - name: 歷史涵蓋到哪一天
        if: always()
        run: |
          if [ "${{ steps.hist.outcome }}" != "success" ]; then
            echo "⚠️ 補歷史那步沒有成功 —— 下面的日期是補之前的舊狀態"
          fi
          for f in data/daily-*.csv; do
            last=$(tail -1 "$f" | cut -d, -f1)
            age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
            if [ "$age" -gt 7 ]; then
              echo "⚠️ $f 最後一天 $last，已經 $age 天沒更新"
            else
              echo "✓ $f 最後一天 $last（$age 天前）"
            fi
          done

      - name: 摘要
        if: always()
        run: |
          if [ -f data/live.json ]; then
            node -e '
              const d = require("./data/live.json");
              console.log("產生於", d.generatedAtTaipei, "台北　成功", d.ok, "失敗", d.failed);
              for (const [k, v] of Object.entries(d.data)) {
                if (v.error) console.log("  ✗", (v.name||k), "—", v.error);
                else if (v.price !== undefined)
                  console.log("  ✓", (v.name||k).padEnd(14), String(v.price).padStart(10),
                              v.pct === null ? "" : (v.pct > 0 ? "+" : "") + v.pct + "%",
                              v.ma60 ? "　季線 " + v.ma60 + "　乖離 " + v.bias60 + "%" : "",
                              v.correctedBy ? "　（已依 " + v.correctedBy + " 校正，Yahoo 原值 " + v.priceYahoo + "）" : "");
              }
              const cc = d.crossCheck || {};
              if (Object.keys(cc).length) {
                console.log("\n── 雙來源對帳 Yahoo vs 證交所 ──");
                for (const [k, v] of Object.entries(cc))
                  console.log(" ", (v.agree ? "✅" : "⚠️ "), k.padEnd(7),
                              "Yahoo", String(v.yahoo).padStart(10),
                              "證交所", String(v.twse).padStart(10),
                              "差", v.diffPct + "%");
              } else {
                console.log("\n⚠️ 沒有對帳結果 —— 證交所那邊可能整個沒抓到，今天的台股數字只有單一來源");
              }
            '
          fi
