name: 日韓盤中取樣

# 日經與 KOSPI 台北 08:00 開盤，比台股早一小時。使用者是在 08:10 看這頁
# 決定今天怎麼做，所以開盤後那段走勢是這頁最有價值的東西 ——
# 但單一個時間點看不出方向，要一條線。
#
# ⚠️ 為什麼不用 `*/5` 的 cron
# 那正是 2026-08-04／05 壞掉的東西。market-data.yml 原本在 08:02～08:52
# 排了每 10 分鐘共 6 班，**連兩天一班都沒觸發**。GitHub 對排程本來就不保證
# 執行，密集的 cron 又是最先被丟掉的。排成每 5 分鐘只會讓同一個病更嚴重，
# 而且症狀無聲：畫出來是一條有洞的線，不是一則錯誤。
#
# 所以：**一班 cron 起一個 job，取樣迴圈跑在 job 裡面。**
# 那一班有觸發，後面 19 個點就全部拿得到；沒觸發就整條線都沒有，一眼看得出來。
# 用「1 次不確定」換掉「19 次各自不確定」。
#
# ⚠️ 排程觸發只在預設分支生效（目前是 claude/baby-travel-packing-list-hwk2gb）。

on:
  schedule:
    # cron 是 UTC，台北 = UTC+8。21:40 UTC 週日～週四 ＝ 台北 05:40 週一～週五。
    #
    # ⚠️ 為什麼要提早兩個多小時起跑
    # 原本排 07:55（開盤前 5 分鐘），實測三天，線的第一個點分別是
    # 10:06、08:57、09:04 —— **一次都沒有涵蓋到 08:00–09:00**，
    # 而那正是使用者唯一會看的那一段。原因不是沒觸發，是 GitHub 的排程
    # 延遲了一到兩個小時才真的開始跑。
    #
    # 延遲擋不掉，但可以用「提早起跑」吸收：05:40 起跑代表被延遲 2 小時 20 分
    # 也還趕得上 08:00。非交易時段腳本自己會安靜跳過（不取樣、不 commit），
    # 所以早起的代價只是 runner 空轉，這個 repo 是公開的，時數不計費。
    - cron: '40 21 * * 0-4'
  workflow_dispatch:
    inputs:
      minutes:
        description: '要取樣多久（分鐘）。留空＝跑到台北 13:35'
        default: ''
      every:
        description: '每幾秒取一次。留空＝09:30 前 5 分鐘、之後 15 分鐘'
        default: ''

concurrency:
  group: intraday          # 跟 market-data 分開，兩者不互相取消
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # GitHub 對單一 job 的硬上限是 6 小時，超過直接砍掉、當次視為失敗。
    # 05:40 起跑到 13:35 是 7 小時 55 分，會撞到上限，所以迴圈自己也有
    # 5 小時 45 分的時數上限（見下面的 HARD_CAP）：準時起跑就跑到 11:25，
    # 被延遲起跑就往後平移，兩種情況下 08:00–09:30 那段都在涵蓋範圍內。
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 附加／換日／未開盤這幾條規則錯了都不會有錯誤訊息，只會畫出一條
      # 看起來正常但不對的線。所以先驗，且不加 continue-on-error。
      - name: 驗取樣合併邏輯
        run: node tools/intraday.mjs --self-test

      # 取樣密度分兩段。日韓開到台北 14:30，但「開盤後那一段」跟「中午」
      # 的價值差很多：09:00 台股開盤前每一筆都在改變今天怎麼看，開盤之後
      # 它就退回背景參考。而且每推一次就觸發一次 GitHub Pages 重建
      # （分支型 Pages 的軟上限大約每小時 10 次），整天 5 分鐘一次會超過，
      # 超過的結果是頁面靜靜地落後。所以密的地方密、疏的地方疏。
      - name: 盤中取樣（台北 08:00 起）
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          MINUTES: ${{ inputs.minutes }}
          EVERY:   ${{ inputs.every }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 結束時間用台北時鐘算，不是「跑滿 N 分鐘」——
          # 排程延遲 10 分鐘起跑時，用時長算會拖到 13:45 才收工，
          # 用時鐘算才會準時停在 13:35（台股 13:30 收盤後那一筆）。
          if [ -n "$MINUTES" ]; then
            END=$(( $(date -u +%s) + MINUTES * 60 ))
          fi
          # 硬上限：GitHub 砍 job 的門檻是 6 小時，被砍的那次整個算失敗。
          # 自己先在 5 小時 45 分收工，才會走到下面的「摘要」那步留下紀錄。
          HARD_CAP=$(( $(date -u +%s) + 345 * 60 ))
          n=0
          while :; do
            NOW_M=$(( 10#$(TZ=Asia/Taipei date '+%H') * 60 + 10#$(TZ=Asia/Taipei date '+%M') ))
            if [ -n "$MINUTES" ]; then
              [ "$(date -u +%s)" -ge "$END" ] && break
            else
              [ "$NOW_M" -ge $((13*60+35)) ] && { echo "台北 13:35，收工"; break; }
              [ "$(date -u +%s)" -ge "$HARD_CAP" ] && { echo "已跑滿 5 小時 45 分，收工避免被 GitHub 砍"; break; }
            fi
            n=$((n+1))
            echo "── 第 $n 次　$(TZ=Asia/Taipei date '+%H:%M') 台北"
            # 單次抓取失敗不中斷迴圈：下一次五分鐘後就會再試，
            # 線上少一個點遠好過整條線在第一次網路抖動就沒了
            if node tools/intraday.mjs -o data/intraday.json; then
              git add data/intraday.json
              if git diff --staged --quiet; then
                echo "沒有新的點"
              else
                git commit -q -m "盤中取樣 $(TZ=Asia/Taipei date '+%m-%d %H:%M') 台北"
                # market-data.yml 在 08:05 與 09:05 也會推，兩邊改的是不同檔案，
                # rebase 接得起來。被拒就重試，不要讓一次撞車吃掉後面所有的點。
                pushed=0
                for i in 1 2 3; do
                  if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then
                    pushed=1; break
                  fi
                  echo "push 失敗，第 $i 次重試"; sleep $((i*5))
                done
                [ "$pushed" = "1" ] || echo "⚠️ 這一輪沒推上去，下一輪會連同這個點一起推"
              fi
            else
              echo "⚠️ 這一輪取樣失敗，繼續等下一輪"
            fi
            # 09:30 台北之前每 5 分鐘，之後每 15 分鐘
            if [ -n "$EVERY" ]; then
              sleep "$EVERY"
            elif [ "$NOW_M" -lt $((9*60+30)) ]; then
              sleep 300
            else
              sleep 900
            fi
          done

      - name: 摘要
        if: always()
        run: |
          if [ -f data/intraday.json ]; then
            node -e '
              const d = require("./data/intraday.json");
              console.log("日期", d.date, "最後更新", d.updatedTaipei, "台北");
              for (const [k, v] of Object.entries(d.series || {})) {
                const p = v.points || [];
                if (!p.length) { console.log("  ➖", v.name, "整天沒有點"); continue; }
                const first = p[0], last = p[p.length - 1];
                const pct = v.prevClose ? ((last[1] / v.prevClose - 1) * 100).toFixed(2) : "—";
                console.log("  ✓", (v.name || k).padEnd(12), p.length, "個點　",
                            first[0], "→", last[0], "　", last[1],
                            "　較前收 " + (pct === "—" ? "—" : (pct > 0 ? "+" : "") + pct + "%"));
              }
            '
          else
            echo "⚠️ 沒有產生 data/intraday.json —— 整天一個點都沒抓到"
          fi
