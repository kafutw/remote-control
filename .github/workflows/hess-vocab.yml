name: 抓何嘉仁單字

# 何嘉仁的教師網與數位練習平台，在執行 Claude 的沙盒裡連不出去
# （proxy 對 hess.com.tw 直接回 CONNECT 403），但 Actions 的 runner 沒有限制。
# 所以由 runner 去抓，把結果 commit 回 repo，沙盒再從 raw.githubusercontent.com 讀。
# 跟 market-data.yml 是同一條路子。
#
# ⚠️ workflow_dispatch（手動觸發）只有在檔案進到「預設分支」之後才會出現在
#    Actions 頁面上。在開發分支上，靠下面的 push 觸發就能跑。

on:
  push:
    paths:
      - 'tools/fetch-hess-vocab.mjs'
      - '.github/workflows/hess-vocab.yml'
  workflow_dispatch:
    inputs:
      probe_only:
        description: '只探測頁面結構、印 log，不寫任何檔案'
        type: boolean
        default: false

concurrency:
  group: hess-vocab
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 解析規則寫歪不會有症狀：少撿到一半的字，檔案照樣長得很正常。
      # 這一步幾十毫秒，錯了就擋下來，不要讓半套的單字表被 commit 進去。
      - name: 驗單字解析規則
        run: node tools/fetch-hess-vocab.mjs --self-test

      # 先探測。這一步的產出是「log」不是檔案 —— 頁面到底是靜態 HTML 還是
      # JS 撐起來的、單字怎麼排版，只有從有網路的機器上看得到，
      # 而解析規則要照著那個結構寫，不是照猜的寫。失敗不擋後面。
      - name: 探測頁面結構
        continue-on-error: true
        run: node tools/fetch-hess-vocab.mjs --probe

      - name: 抓單字
        id: fetch
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: node tools/fetch-hess-vocab.mjs -o data/hess-sources.json

      - name: 有變動才 commit
        if: ${{ !inputs.probe_only && steps.fetch.outcome == 'success' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hess-sources.json
          if git diff --staged --quiet; then
            echo "單字沒有變動，不 commit"
          else
            git commit -m "更新何嘉仁 Fun World 單元連結表"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 摘要
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "⚠️ 抓取那步沒有成功 —— 看上面「探測頁面結構」的 log，"
            echo "   確認網址通不通、頁面是不是要 JS 才渲染得出單字。"
          fi
          if [ -f data/hess-sources.json ]; then
            node -e '
              const d = require("./data/hess-sources.json");
              console.log("抓於", d.fetchedAt);
              for (const b of d.books) {
                console.log("  ✓", b.grade, b.label, "—", b.links.length, "個練習連結", b.digiUrl);
                const byHost = {};
                for (const l of b.links) (byHost[l.host] ||= []).push(l.label);
                for (const [h, us] of Object.entries(byHost)) console.log("      ", h, ":", us.join(", "));
              }
            '
          fi
