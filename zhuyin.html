<title>注音ㄅㄆㄇ練習</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #F2F7FF;
    --bg-2: #E2EDFF;
    --surface: #FFFFFF;
    --track: #DCE7F8;
    --ink: #2A3550;
    --ink-soft: #6E7C99;
    --ink-faint: #A3AFC6;
    --line: #E1E9F6;
    --blue: #4C8DF6;
    --blue-deep: #2E6FD9;
    --blue-soft: #E8F1FF;
    --sun: #FFA33D;
    --sun-soft: #FFF1E0;
    --ok: #2FBE7E;
    --ok-soft: #E3F7EE;
    --no: #F0656C;
    --no-soft: #FEE9EA;
    --shadow: 0 1px 2px rgba(46,111,217,.06), 0 8px 22px rgba(46,111,217,.10);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171D2B; --bg-2: #1D2536; --surface: #222B3D; --track: #171D2B;
      --ink: #E9EFFA; --ink-soft: #A6B4CE; --ink-faint: #74829E; --line: #33405A;
      --blue: #6BA5FF; --blue-deep: #9CC4FF; --blue-soft: rgba(107,165,255,.16);
      --sun: #FFB662; --sun-soft: rgba(255,182,98,.16);
      --ok: #4FD79A; --ok-soft: rgba(79,215,154,.16);
      --no: #FF8189; --no-soft: rgba(255,129,137,.16);
      --shadow: 0 1px 2px rgba(0,0,0,.22), 0 10px 26px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F7FF; --bg-2: #E2EDFF; --surface: #FFFFFF; --track: #DCE7F8;
    --ink: #2A3550; --ink-soft: #6E7C99; --ink-faint: #A3AFC6; --line: #E1E9F6;
    --blue: #4C8DF6; --blue-deep: #2E6FD9; --blue-soft: #E8F1FF;
    --sun: #FFA33D; --sun-soft: #FFF1E0;
    --ok: #2FBE7E; --ok-soft: #E3F7EE; --no: #F0656C; --no-soft: #FEE9EA;
    --shadow: 0 1px 2px rgba(46,111,217,.06), 0 8px 22px rgba(46,111,217,.10);
  }
  :root[data-theme="dark"] {
    --bg: #171D2B; --bg-2: #1D2536; --surface: #222B3D; --track: #171D2B;
    --ink: #E9EFFA; --ink-soft: #A6B4CE; --ink-faint: #74829E; --line: #33405A;
    --blue: #6BA5FF; --blue-deep: #9CC4FF; --blue-soft: rgba(107,165,255,.16);
    --sun: #FFB662; --sun-soft: rgba(255,182,98,.16);
    --ok: #4FD79A; --ok-soft: rgba(79,215,154,.16);
    --no: #FF8189; --no-soft: rgba(255,129,137,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.22), 0 10px 26px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--ink);
    background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), transparent 60%), var(--bg);
    -webkit-text-size-adjust: 100%; line-height: 1.5;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px 90px; }
  .zy { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", var(--font); }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.5) blur(12px);
    -webkit-backdrop-filter: saturate(1.5) blur(12px);
    border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 0 0;
  }
  .head-inner { max-width: 600px; margin: 0 auto; padding: 13px 16px 12px; }
  .titlerow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 1.28rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .sub { font-size: .8rem; color: var(--blue-deep); font-weight: 600; }

  /* quiz-only header bits */
  .runbar { display: none; }
  body.s-quiz .runbar { display: flex; align-items: center; gap: 11px; margin-top: 12px; }
  .qcount { font-size: .86rem; font-weight: 700; white-space: nowrap;
            font-variant-numeric: tabular-nums; color: var(--blue-deep); }
  .qcount b { font-size: 1.1rem; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--ok));
             border-radius: 99px; transition: width .35s cubic-bezier(.34,1.3,.5,1); }
  .clock { font-size: .84rem; font-weight: 700; color: var(--ink-soft);
           font-variant-numeric: tabular-nums; white-space: nowrap; }

  .btn {
    font-family: inherit; font-size: .84rem; font-weight: 700;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 9px 16px; border-radius: 99px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.ghost { color: var(--ink-soft); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-size: 1rem; }
  .btn:disabled { color: var(--ink-faint); cursor: default; opacity: .6; }
  .btn.primary:disabled { background: var(--track); border-color: var(--track); color: var(--ink-faint); opacity: 1; }
  .btn.wide { width: 100%; }

  /* ---- screens ---- */
  .screen { display: none; }
  body.s-setup  .screen.setup  { display: block; }
  body.s-quiz   .screen.quiz   { display: block; }
  body.s-result .screen.result { display: block; }
  body.s-chart  .screen.chart  { display: block; }

  .q { font-size: 1.02rem; font-weight: 800; margin: 20px 0 0; }
  .q .lead { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-soft); margin-top: 3px; }

  /* mode cards */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 13px; }
  .mode {
    font-family: inherit; text-align: left; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px; box-shadow: var(--shadow); position: relative;
    display: flex; flex-direction: column; gap: 4px; min-height: 116px; transition: all .15s;
  }
  .mode:active { transform: translateY(1px); }
  .mode:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .mode .mj { font-size: 1.6rem; line-height: 1; }
  .mode .mt { font-weight: 800; font-size: 1rem; }
  .mode .md { font-size: .74rem; color: var(--ink-soft); font-weight: 500; line-height: 1.45; }
  .mode.sel { border-color: var(--blue); background: var(--blue-soft); }
  .mode.sel .md { color: var(--blue-deep); }
  .mode.sel::after {
    content: '✓'; position: absolute; top: 10px; right: 11px; color: #fff; background: var(--blue);
    width: 21px; height: 21px; border-radius: 99px; display: grid; place-items: center;
    font-size: .74rem; font-weight: 800;
  }
  .mode[disabled] { opacity: .45; cursor: default; box-shadow: none; }

  .card {
    margin-top: 16px; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px 16px;
  }
  .card-head { font-weight: 800; font-size: .94rem; display: flex; align-items: center; gap: 7px; }
  .card-hint { margin: 7px 0 0; font-size: .76rem; color: var(--ink-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .chip {
    font-family: inherit; font-size: .9rem; font-weight: 700;
    border: 1.5px solid var(--line); background: var(--bg-2); color: var(--ink-soft);
    padding: 9px 15px; border-radius: 99px; cursor: pointer; min-height: 44px;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .chip:active { transform: translateY(1px); }
  .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chip[disabled] { opacity: .4; cursor: default; }
  .chip .n { font-size: .74rem; opacity: .75; font-weight: 600; }

  .weak { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 7px; }
  .weak .w {
    display: inline-flex; align-items: center; gap: 5px; font-size: .92rem; font-weight: 800;
    background: var(--no-soft); color: var(--no); border-radius: 11px; padding: 5px 10px;
  }
  .weak .w small { font-size: .68rem; font-weight: 600; opacity: .85; }

  .go { position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
        background: linear-gradient(to top, var(--bg) 62%, transparent); margin-top: 18px; }

  /* ---- quiz ---- */
  .stage {
    margin-top: 18px; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 24px 18px;
    text-align: center; min-height: 190px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .ask { font-size: .84rem; font-weight: 700; color: var(--ink-soft); }
  .big { font-size: 4.6rem; line-height: 1.1; font-weight: 800; letter-spacing: .04em; }
  .big.small { font-size: 3rem; }
  .bigword { font-size: 1.9rem; font-weight: 800; letter-spacing: .06em; }
  .bigemoji { font-size: 3.4rem; line-height: 1.1; }
  .say {
    font-family: inherit; border: none; cursor: pointer; background: var(--sun-soft); color: var(--sun);
    width: 92px; height: 92px; border-radius: 99px; font-size: 2.5rem; display: grid; place-items: center;
    transition: transform .12s;
  }
  .say:active { transform: scale(.94); }
  .say:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
  .say.playing { animation: pulse .7s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .reveal { font-size: .95rem; font-weight: 700; color: var(--ink-faint); min-height: 1.5em; }
  .reveal.show { color: var(--blue-deep); }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 14px; }
  .opt {
    font-family: inherit; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 10px; min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    transition: all .14s; position: relative;
  }
  .opt:active { transform: translateY(1px); }
  .opt:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .opt .oe { font-size: 2rem; line-height: 1; }
  .opt .ot { font-size: 1.5rem; font-weight: 800; letter-spacing: .04em; }
  .opt .ot.sym { font-size: 2.6rem; }
  .opt .ot.spell { font-size: 1.65rem; }
  .opt .ok-mark, .opt .no-mark { display: none; position: absolute; top: 8px; right: 9px;
    width: 22px; height: 22px; border-radius: 99px; place-items: center; font-size: .78rem;
    font-weight: 800; color: #fff; }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.right .ok-mark { display: grid; background: var(--ok); }
  .opt.wrong { border-color: var(--no); background: var(--no-soft); }
  .opt.wrong .no-mark { display: grid; background: var(--no); }
  .opt.dim { opacity: .45; }
  body.locked .opt { cursor: default; }

  .verdict { margin-top: 14px; text-align: center; min-height: 62px; }
  .verdict .vtxt { font-size: 1.05rem; font-weight: 800; }
  .verdict .vtxt.good { color: var(--ok); }
  .verdict .vtxt.bad { color: var(--no); }
  .verdict .vsub { font-size: .86rem; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
  .verdict .vsub b { color: var(--ink); }
  .streak { display: inline-flex; gap: 3px; margin-left: 7px; }

  /* ---- result ---- */
  .score-card {
    margin-top: 20px; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 24px 18px; text-align: center;
  }
  .stars { font-size: 2.2rem; letter-spacing: 4px; }
  .stars .off { opacity: .22; }
  .big-score { font-size: 3.2rem; font-weight: 800; line-height: 1.1; margin-top: 6px;
               font-variant-numeric: tabular-nums; }
  .big-score span { font-size: 1.4rem; color: var(--ink-faint); font-weight: 700; }
  .praise { font-size: 1rem; font-weight: 800; color: var(--blue-deep); margin-top: 4px; }
  .facts { display: flex; justify-content: center; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .fact { font-size: .78rem; color: var(--ink-soft); font-weight: 600; }
  .fact b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .newbest { display: inline-block; margin-top: 11px; font-size: .78rem; font-weight: 800;
             color: var(--sun); background: var(--sun-soft); padding: 5px 12px; border-radius: 99px; }

  .wrongs { margin-top: 16px; }
  .wrongs h2 { font-size: .94rem; margin: 0 0 10px; display: flex; align-items: center; gap: 7px; }
  .wrow {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 16px; padding: 11px 13px; margin-bottom: 8px;
  }
  .wrow .ws { font-size: 2rem; font-weight: 800; width: 46px; text-align: center; color: var(--no); }
  .wrow .wb { flex: 1; min-width: 0; }
  .wrow .ww { font-weight: 800; font-size: 1rem; }
  .wrow .wz { font-size: .82rem; color: var(--ink-soft); font-weight: 600; letter-spacing: .03em; }
  .wrow .wsay { border: none; background: var(--blue-soft); color: var(--blue-deep); cursor: pointer;
    width: 42px; height: 42px; border-radius: 99px; font-size: 1.1rem; flex: none; }
  .wrow .wsay:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .acts { display: grid; gap: 9px; margin-top: 18px; }
  .acts .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  /* ---- chart (符號表) ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 9px; margin-top: 12px; }
  .cell {
    font-family: inherit; cursor: pointer; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 11px 6px 9px; text-align: center; color: var(--ink); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .cell:active { transform: translateY(1px); }
  .cell:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .cell .cs { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
  .cell .ce { font-size: 1.2rem; line-height: 1.2; }
  .cell .cw { font-size: .72rem; color: var(--ink-soft); font-weight: 700; }
  .cell .cz { font-size: .64rem; color: var(--ink-faint); font-weight: 600; letter-spacing: .02em; }
  .cell.hot { border-color: var(--no); }
  .gsec { margin-top: 18px; }
  .gsec h2 { font-size: .92rem; margin: 0; display: flex; align-items: center; gap: 7px; }
  .gsec h2 small { font-weight: 600; color: var(--ink-faint); font-size: .74rem; }

  .foot { margin-top: 26px; text-align: center; font-size: .74rem; color: var(--ink-faint); }
</style>

<header>
  <div class="head-inner">
    <div class="titlerow">
      <h1>注音 ㄅㄆㄇ 練習</h1>
      <span class="sub" id="sub">選模式，開始闖關</span>
    </div>
    <div class="runbar">
      <span class="qcount" id="qcount">第 <b>1</b>／10</span>
      <span class="bar"><i id="fill"></i></span>
      <span class="clock" id="clock">0:00</span>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ============ 設定 ============ -->
  <section class="screen setup">
    <p class="q">要玩哪一種？<span class="lead">四種玩法，隨時可以換</span></p>
    <div class="modes" id="modes"></div>

    <div class="card">
      <div class="card-head">🎯 練哪些符號</div>
      <div class="chips" id="scopes"></div>
      <p class="card-hint" id="scopeHint"></p>
    </div>

    <div class="card">
      <div class="card-head">🔢 幾題</div>
      <div class="chips" id="counts"></div>
    </div>

    <div class="card" id="weakCard" style="display:none">
      <div class="card-head">🩹 最近容易錯的</div>
      <div class="weak" id="weakList"></div>
      <p class="card-hint">選上面的「只練錯的」就會加強這幾個。</p>
    </div>

    <div class="go">
      <button class="btn primary wide" id="startBtn">開始練習 →</button>
      <button class="btn ghost wide" id="chartBtn" style="margin-top:9px">📖 先看注音符號表</button>
    </div>
  </section>

  <!-- ============ 答題 ============ -->
  <section class="screen quiz">
    <div class="stage" id="stage"></div>
    <div class="opts" id="opts"></div>
    <div class="verdict" id="verdict"></div>
    <button class="btn ghost wide" id="quitBtn" style="margin-top:6px">結束這回合</button>
  </section>

  <!-- ============ 成績單 ============ -->
  <section class="screen result">
    <div class="score-card">
      <div class="stars" id="stars"></div>
      <div class="big-score" id="bigScore"></div>
      <div class="praise" id="praise"></div>
      <div class="facts" id="facts"></div>
      <div id="bestWrap"></div>
    </div>
    <div class="wrongs" id="wrongs"></div>
    <div class="acts">
      <button class="btn primary wide" id="againBtn">再玩一次</button>
      <div class="two">
        <button class="btn" id="retryWrongBtn">只練錯的</button>
        <button class="btn ghost" id="backSetupBtn">換玩法</button>
      </div>
    </div>
    <p class="foot">每天玩一點點，ㄅㄆㄇ 就記起來了 ✨</p>
  </section>

  <!-- ============ 符號表 ============ -->
  <section class="screen chart">
    <p class="q">注音符號表<span class="lead">點一下聽發音，紅框是最近容易錯的</span></p>
    <div id="chartBody"></div>
    <div class="go">
      <button class="btn primary wide" id="chartBackBtn">← 回去練習</button>
    </div>
  </section>

</div>

<script>
  // ─────────────────────────────────────────────
  // 37 個注音符號 + 生活例詞
  // s=符號 g=分類 w=語詞 z=語詞注音 c=代表字 cz=代表字注音 e=圖示
  // ─────────────────────────────────────────────
  const DATA = [
    { s:'ㄅ', g:'sheng', w:'爸爸', z:'ㄅㄚˋ˙ㄅㄚ',   c:'爸', cz:'ㄅㄚˋ',   e:'👨' },
    { s:'ㄆ', g:'sheng', w:'皮球', z:'ㄆㄧˊㄑㄧㄡˊ', c:'皮', cz:'ㄆㄧˊ',   e:'⚽' },
    { s:'ㄇ', g:'sheng', w:'媽媽', z:'ㄇㄚ˙ㄇㄚ',     c:'媽', cz:'ㄇㄚ',     e:'👩' },
    { s:'ㄈ', g:'sheng', w:'飛機', z:'ㄈㄟㄐㄧ',       c:'飛', cz:'ㄈㄟ',     e:'✈️' },
    { s:'ㄉ', g:'sheng', w:'電話', z:'ㄉㄧㄢˋㄏㄨㄚˋ', c:'電', cz:'ㄉㄧㄢˋ', e:'☎️' },
    { s:'ㄊ', g:'sheng', w:'兔子', z:'ㄊㄨˋ˙ㄗ',       c:'兔', cz:'ㄊㄨˋ',   e:'🐰' },
    { s:'ㄋ', g:'sheng', w:'牛奶', z:'ㄋㄧㄡˊㄋㄞˇ',   c:'牛', cz:'ㄋㄧㄡˊ', e:'🥛' },
    { s:'ㄌ', g:'sheng', w:'老虎', z:'ㄌㄠˇㄏㄨˇ',     c:'老', cz:'ㄌㄠˇ',   e:'🐯' },
    { s:'ㄍ', g:'sheng', w:'哥哥', z:'ㄍㄜ˙ㄍㄜ',       c:'哥', cz:'ㄍㄜ',     e:'👦' },
    { s:'ㄎ', g:'sheng', w:'咖啡', z:'ㄎㄚㄈㄟ',         c:'咖', cz:'ㄎㄚ',     e:'☕' },
    { s:'ㄏ', g:'sheng', w:'花',   z:'ㄏㄨㄚ',           c:'花', cz:'ㄏㄨㄚ',   e:'🌸' },
    { s:'ㄐ', g:'sheng', w:'雞蛋', z:'ㄐㄧㄉㄢˋ',       c:'雞', cz:'ㄐㄧ',     e:'🥚' },
    { s:'ㄑ', g:'sheng', w:'汽車', z:'ㄑㄧˋㄔㄜ',       c:'汽', cz:'ㄑㄧˋ',   e:'🚗' },
    { s:'ㄒ', g:'sheng', w:'西瓜', z:'ㄒㄧㄍㄨㄚ',       c:'西', cz:'ㄒㄧ',     e:'🍉' },
    { s:'ㄓ', g:'sheng', w:'蜘蛛', z:'ㄓㄓㄨ',           c:'蜘', cz:'ㄓ',       e:'🕷️' },

    { s:'ㄤ', g:'yun',   w:'糖果', z:'ㄊㄤˊㄍㄨㄛˇ',     c:'糖', cz:'ㄊㄤˊ',   e:'🍬' },

  const GROUPS = {
    sheng: { name: '聲母',     icon: '🅰️', desc: 'ㄅ 到 ㄙ，21 個' },
    jie:   { name: '介音',     icon: '🔗', desc: 'ㄧㄨㄩ，3 個' },
    yun:   { name: '韻母',     icon: '🎵', desc: 'ㄚ 到 ㄦ，13 個' },
  };

  const MODES = [
    { id:'sym2word', j:'👂', t:'找聲音', d:'看符號，選出有這個音的語詞' },
    { id:'word2sym', j:'🔤', t:'找符號', d:'看圖和語詞，選出正確的符號' },
    { id:'listen',   j:'🔊', t:'聽聲音', d:'聽念一次，選出開頭的符號', needVoice:true },
    { id:'spell',    j:'✏️', t:'拼拼看', d:'看國字，選出正確的拼音和聲調' },
  ];

  const SCOPES = [
    { id:'all',   label:'全部',       pick: () => DATA },
    { id:'sheng', label:'只練聲母',   pick: () => DATA.filter(d => d.g === 'sheng') },
    { id:'yun',   label:'介音＋韻母', pick: () => DATA.filter(d => d.g !== 'sheng') },
    { id:'weak',  label:'只練錯的',   pick: () => DATA.filter(d => wrongSet().has(d.s)) },
  ];

  const COUNTS = [10, 20, 0]; // 0 = 全部

  const TONES = ['', 'ˊ', 'ˇ', 'ˋ'];
  const INITIALS = 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ';
  const MEDIALS = 'ㄧㄨㄩ';
  const SIM_I = { ㄅ:'ㄆ', ㄆ:'ㄅ', ㄉ:'ㄊ', ㄊ:'ㄉ', ㄍ:'ㄎ', ㄎ:'ㄍ', ㄐ:'ㄑ', ㄑ:'ㄐ',
                  ㄓ:'ㄔ', ㄔ:'ㄓ', ㄗ:'ㄘ', ㄘ:'ㄗ', ㄇ:'ㄋ', ㄋ:'ㄇ', ㄈ:'ㄏ', ㄏ:'ㄈ',
                  ㄌ:'ㄖ', ㄖ:'ㄌ', ㄒ:'ㄕ', ㄕ:'ㄒ', ㄙ:'ㄗ' };
  const SIM_F = { ㄢ:'ㄤ', ㄤ:'ㄢ', ㄣ:'ㄥ', ㄥ:'ㄣ', ㄞ:'ㄟ', ㄟ:'ㄞ', ㄠ:'ㄡ', ㄡ:'ㄠ',
                  ㄚ:'ㄜ', ㄜ:'ㄚ', ㄧ:'ㄩ', ㄩ:'ㄧ', ㄨ:'ㄡ', ㄛ:'ㄡ', ㄝ:'ㄞ', ㄦ:'ㄜ' };

  // 國語真的拼得出來的韻母（含空韻 ''），用來擋掉「ㄕㄧㄥ」「ㄌㄩㄛ」這種不存在的拼法
  const RIMES = new Set(['', 'ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ',
    'ㄧ','ㄧㄚ','ㄧㄝ','ㄧㄠ','ㄧㄡ','ㄧㄢ','ㄧㄣ','ㄧㄤ','ㄧㄥ',
    'ㄨ','ㄨㄚ','ㄨㄛ','ㄨㄞ','ㄨㄟ','ㄨㄢ','ㄨㄣ','ㄨㄤ','ㄨㄥ',
    'ㄩ','ㄩㄝ','ㄩㄢ','ㄩㄣ','ㄩㄥ']);

  // 聲母和介音的搭配限制
  function legalZy(zy) {
    const { head, rest } = splitZy(zy);
    if (!RIMES.has(rest)) return false;
    const med = MEDIALS.includes(rest[0]) ? rest[0] : '';
    if (rest === '') return 'ㄓㄔㄕㄖㄗㄘㄙ'.includes(head);   // 空韻只跟在ㄓㄔㄕㄖㄗㄘㄙ後面
    if (!head) return true;
    if ('ㄐㄑㄒ'.includes(head)) return med === 'ㄧ' || med === 'ㄩ';
    if ('ㄓㄔㄕㄖㄗㄘㄙㄍㄎㄏ'.includes(head)) return med === '' || med === 'ㄨ';
    if ('ㄅㄆㄇ'.includes(head)) return med === '' || med === 'ㄧ' || rest === 'ㄨ';
    if (head === 'ㄈ') return med === '' || rest === 'ㄨ' || rest === 'ㄨㄥ';
    if ('ㄉㄊ'.includes(head)) return med !== 'ㄩ';
    return true;   // ㄋㄌ 四個介音都能接
  }

  // ─────────────────────────────────────────────
  // 儲存
  // ─────────────────────────────────────────────
  const K_STATS = 'zhuyin-stats-v1';   // { 符號: {r: 對, w: 錯} }
  const K_BEST  = 'zhuyin-best-v1';    // { "mode|scope|count": {score,total,sec} }
  const K_PREF  = 'zhuyin-pref-v1';    // { mode, scope, count }

  const load = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) || fb; } catch (e) { return fb; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let stats = load(K_STATS, {});
  let best  = load(K_BEST, {});
  let pref  = load(K_PREF, { mode: 'sym2word', scope: 'all', count: 10 });

  // 錯過而且錯得比對得多（或還沒答對過）的符號
  function wrongSet() {
    const set = new Set();
    Object.keys(stats).forEach(s => { const x = stats[s]; if (x && x.w > 0 && x.w >= x.r) set.add(s); });
    return set;
  }

  // ─────────────────────────────────────────────
  // 小工具
  // ─────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const sample = (arr, n) => shuffle(arr).slice(0, n);
  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ── 語音 ──
  let voice = null, voiceReady = false;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices() || [];
    voice = vs.find(v => /zh[-_]TW|cmn-Hant/i.test(v.lang)) ||
            vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
            vs.find(v => /^zh/i.test(v.lang)) || null;
    const was = voiceReady;
    voiceReady = !!voice;
    if (voiceReady !== was) renderModes();
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  function speak(text, onEnd) {
    if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; u.rate = .8; u.pitch = 1.05;
      if (voice) u.voice = voice;
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    } catch (e) { onEnd && onEnd(); }
  }

  // ─────────────────────────────────────────────
  // 出題
  // ─────────────────────────────────────────────
  function distractorWords(item, n) {
    // 語詞注音裡「不含」目標符號的才可以當錯的選項
    const pool = DATA.filter(d => d.s !== item.s && !d.z.includes(item.s) && d.w !== item.w);
    return sample(pool, n);
  }
  function distractorSyms(item, n) {
    // 這個語詞裡沒出現過的符號才可以當錯的選項；同類優先（比較有鑑別度）
    const okay = d => d.s !== item.s && !item.z.includes(d.s);
    const same = DATA.filter(d => okay(d) && d.g === item.g);
    const rest = DATA.filter(d => okay(d) && d.g !== item.g);
    return shuffle(same).concat(shuffle(rest)).slice(0, n);
  }
  function splitZy(zy) {
    const last = zy[zy.length - 1];
    const tone = TONES.indexOf(last) > 0 ? last : '';
    const base = tone ? zy.slice(0, -1) : zy;
    const head = INITIALS.includes(base[0]) ? base[0] : '';
    return { head, rest: base.slice(head.length), tone };
  }
  function distractorSpell(item, n) {
    const { head, rest, tone } = splitZy(item.cz);
    const out = [];
    // 換聲調
    TONES.filter(t => t !== tone).forEach(t => out.push(head + rest + t));
    // 換相似聲母
    if (head && SIM_I[head]) out.push(SIM_I[head] + rest + tone);
    // 換相似韻尾
    const tail = rest[rest.length - 1];
    if (tail && SIM_F[tail]) out.push(head + rest.slice(0, -1) + SIM_F[tail] + tone);
    // 介音：換一個、或整個漏掉（小朋友最常犯的錯）
    if (MEDIALS.includes(rest[0])) {
      [...MEDIALS].forEach(m => { if (m !== rest[0]) out.push(head + m + rest.slice(1) + tone); });
      if (rest.length > 1) out.push(head + rest.slice(1) + tone);
    } else if (head) {
      // 反過來，多插一個介音進去
      out.push(head + 'ㄧ' + rest + tone);
      out.push(head + 'ㄨ' + rest + tone);
    }
    const uniq = [...new Set(out)].filter(x => x !== item.cz && legalZy(x));
    let picked = sample(uniq, n);
    // 還不夠就拿別的字來湊
    if (picked.length < n) {
      const extra = sample(DATA.filter(d => d.cz !== item.cz && !picked.includes(d.cz)), n - picked.length);
      picked = picked.concat(extra.map(d => d.cz));
    }
    return picked;
  }

  function buildQuestion(item, mode) {
    if (mode === 'sym2word') {
      const wrong = distractorWords(item, 3);
      return {
        item, mode,
        ask: '哪一個語詞裡有這個音？',
        options: shuffle([{ key: item.w, e: item.e, t: item.w, right: true }]
          .concat(wrong.map(d => ({ key: d.w, e: d.e, t: d.w })))),
      };
    }
    if (mode === 'word2sym' || mode === 'listen') {
      const wrong = distractorSyms(item, 3);
      return {
        item, mode,
        ask: mode === 'listen' ? '聽聽看，裡面有哪個注音符號？' : '這個語詞裡有哪個注音符號？',
        options: shuffle([{ key: item.s, t: item.s, sym: true, right: true }]
          .concat(wrong.map(d => ({ key: d.s, t: d.s, sym: true })))),
      };
    }
    // spell
    const wrong = distractorSpell(item, 3);
    return {
      item, mode,
      ask: '這個字要怎麼拼？',
      options: shuffle([{ key: item.cz, t: item.cz, spell: true, right: true }]
        .concat(wrong.map(z => ({ key: z, t: z, spell: true })))),
    };
  }

  function buildRound(mode, scopeId, count) {
    let pool = (SCOPES.find(s => s.id === scopeId) || SCOPES[0]).pick();
    if (!pool.length) pool = DATA;
    const n = count > 0 ? count : pool.length;
    let picks = [];
    while (picks.length < n) picks = picks.concat(shuffle(pool));
    return picks.slice(0, n).map(it => buildQuestion(it, mode));
  }

  // ─────────────────────────────────────────────
  // 狀態
  // ─────────────────────────────────────────────
  let run = null;   // { qs, i, score, wrong[], t0, timer, streak, bestStreak, locked }

  function setScreen(name) {
    document.body.className = 's-' + name;
    window.scrollTo(0, 0);
  }

  // ─────────────────────────────────────────────
  // 設定畫面
  // ─────────────────────────────────────────────
  function renderModes() {
    const box = $('modes');
    box.innerHTML = '';
    MODES.forEach(m => {
      const off = m.needVoice && !voiceReady;
      const b = document.createElement('button');
      b.className = 'mode' + (pref.mode === m.id && !off ? ' sel' : '');
      if (off) b.disabled = true;
      b.innerHTML = '<span class="mj">' + m.j + '</span>' +
                    '<span class="mt">' + m.t + '</span>' +
                    '<span class="md">' + (off ? '這台裝置沒有中文語音，換別的玩法吧' : m.d) + '</span>';
      b.addEventListener('click', () => { pref.mode = m.id; save(K_PREF, pref); renderSetup(); });
      box.appendChild(b);
    });
    if (MODES.some(m => m.id === pref.mode && m.needVoice) && !voiceReady) {
      pref.mode = 'sym2word';
      box.querySelectorAll('.mode').forEach((el, i) => el.classList.toggle('sel', MODES[i].id === pref.mode));
    }
  }

  function renderSetup() {
    renderModes();

    const sbox = $('scopes');
    sbox.innerHTML = '';
    SCOPES.forEach(sc => {
      const n = sc.pick().length;
      const b = document.createElement('button');
      b.className = 'chip' + (pref.scope === sc.id ? ' on' : '');
      if (!n) b.disabled = true;
      b.innerHTML = sc.label + '<span class="n">' + (n ? n + ' 個' : '暫時沒有') + '</span>';
      b.addEventListener('click', () => { if (n) { pref.scope = sc.id; save(K_PREF, pref); renderSetup(); } });
      sbox.appendChild(b);
    });
    const cur = SCOPES.find(s => s.id === pref.scope);
    if (cur && !cur.pick().length) { pref.scope = 'all'; save(K_PREF, pref); return renderSetup(); }
    $('scopeHint').textContent = pref.scope === 'weak'
      ? '從答錯紀錄挑出來的，練到會了就會自動消失。'
      : (GROUPS[pref.scope] ? GROUPS[pref.scope].desc : '聲母、介音、韻母全部混在一起出題。');

    const cbox = $('counts');
    cbox.innerHTML = '';
    const poolN = (SCOPES.find(s => s.id === pref.scope) || SCOPES[0]).pick().length;
    COUNTS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (pref.count === c ? ' on' : '');
      b.textContent = c === 0 ? '全部 ' + poolN + ' 題' : c + ' 題';
      b.addEventListener('click', () => { pref.count = c; save(K_PREF, pref); renderSetup(); });
      cbox.appendChild(b);
    });

    // 弱點
    const weak = Object.keys(stats)
      .filter(s => stats[s].w > 0)
      .sort((a, b) => stats[b].w - stats[a].w)
      .slice(0, 8);
    $('weakCard').style.display = weak.length ? '' : 'none';
    $('weakList').innerHTML = weak.map(s =>
      '<span class="w zy">' + s + '<small>錯 ' + stats[s].w + '</small></span>').join('');

    const m = MODES.find(x => x.id === pref.mode);
    $('sub').textContent = m ? m.j + ' ' + m.t : '選模式，開始闖關';
  }

  // ─────────────────────────────────────────────
  // 答題畫面
  // ─────────────────────────────────────────────
  function startRound(qs) {
    run = { qs, i: 0, score: 0, wrong: [], t0: Date.now(), timer: null, streak: 0, bestStreak: 0 };
    run.timer = setInterval(() => {
      $('clock').textContent = fmtTime(Math.floor((Date.now() - run.t0) / 1000));
    }, 500);
    $('clock').textContent = '0:00';
    setScreen('quiz');
    showQuestion();
  }

  function showQuestion() {
    document.body.classList.remove('locked');
    const q = run.qs[run.i];
    $('qcount').innerHTML = '第 <b>' + (run.i + 1) + '</b>／' + run.qs.length;
    $('fill').style.width = (run.i / run.qs.length * 100) + '%';

    // 題目區
    const st = $('stage');
    st.innerHTML = '';
    const ask = document.createElement('div');
    ask.className = 'ask'; ask.textContent = q.ask;
    st.appendChild(ask);

    if (q.mode === 'sym2word') {
      const big = document.createElement('div');
      big.className = 'big zy'; big.textContent = q.item.s;
      st.appendChild(big);
    } else if (q.mode === 'word2sym') {
      const em = document.createElement('div');
      em.className = 'bigemoji'; em.textContent = q.item.e;
      const wd = document.createElement('div');
      wd.className = 'bigword'; wd.textContent = q.item.w;
      st.appendChild(em); st.appendChild(wd);
      const rv = document.createElement('div');
      rv.className = 'reveal'; rv.id = 'reveal'; rv.textContent = '';
      st.appendChild(rv);
    } else if (q.mode === 'listen') {
      const btn = document.createElement('button');
      btn.className = 'say'; btn.type = 'button'; btn.textContent = '🔊';
      btn.setAttribute('aria-label', '再念一次');
      const play = () => {
        btn.classList.add('playing');
        speak(q.item.w, () => btn.classList.remove('playing'));
      };
      btn.addEventListener('click', play);
      st.appendChild(btn);
      const hint = document.createElement('div');
      hint.className = 'reveal'; hint.id = 'reveal'; hint.textContent = '點喇叭再聽一次';
      st.appendChild(hint);
      setTimeout(play, 260);
    } else {
      const em = document.createElement('div');
      em.className = 'bigemoji'; em.textContent = q.item.e;
      const ch = document.createElement('div');
      ch.className = 'big small'; ch.textContent = q.item.c;
      st.appendChild(em); st.appendChild(ch);
      const rv = document.createElement('div');
      rv.className = 'reveal'; rv.id = 'reveal'; rv.textContent = q.item.w;
      st.appendChild(rv);
    }

    // 選項
    const box = $('opts');
    box.innerHTML = '';
    q.options.forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      const t = '<span class="ot' + (o.sym ? ' sym zy' : o.spell ? ' spell zy' : '') + '">' + o.t + '</span>';
      b.innerHTML = (o.e ? '<span class="oe">' + o.e + '</span>' : '') + t +
                    '<span class="ok-mark">✓</span><span class="no-mark">✕</span>';
      b.addEventListener('click', () => answer(o, b));
      box.appendChild(b);
    });

    $('verdict').innerHTML = '';
  }

  function answer(opt, el) {
    if (document.body.classList.contains('locked')) return;
    document.body.classList.add('locked');
    const q = run.qs[run.i];
    const right = !!opt.right;
    const s = q.item.s;
    stats[s] = stats[s] || { r: 0, w: 0 };

    // 標記選項
    const btns = [...$('opts').children];
    btns.forEach((b, i) => {
      const o = q.options[i];
      if (o.right) b.classList.add('right');
      else if (o === opt) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    if (right) {
      run.score++; run.streak++; stats[s].r++;
      run.bestStreak = Math.max(run.bestStreak, run.streak);
      buzz(18);
    } else {
      run.streak = 0; stats[s].w++;
      run.wrong.push(q.item);
      buzz([26, 60, 26]);
    }
    save(K_STATS, stats);

    // 揭曉
    const rv = $('reveal');
    if (rv) { rv.textContent = q.item.z; rv.classList.add('show'); }

    const praise = ['太棒了！', '答對了！', '好厲害！', '就是這個！', '完全正確！'];
    const v = $('verdict');
    const streakHtml = run.streak >= 3
      ? '<span class="streak">' + '⭐'.repeat(Math.min(run.streak, 5)) + '</span>' : '';
    v.innerHTML = right
      ? '<div class="vtxt good">' + praise[Math.floor(Math.random() * praise.length)] + streakHtml + '</div>' +
        '<div class="vsub"><b class="zy">' + q.item.w + '</b>　<span class="zy">' + q.item.z + '</span></div>'
      : '<div class="vtxt bad">再看一次喔</div>' +
        '<div class="vsub">' + q.item.e + ' <b class="zy">' + q.item.w + '</b>　<span class="zy">' + q.item.z +
        '</span>　答案是 <b class="zy">' + q.options.filter(o => o.right)[0].t + '</b></div>';

    if (q.mode !== 'listen') speak(q.item.w);

    // 等一下自動下一題；等不及的話點畫面就跳過
    const at = run.i;
    const go = () => {
      document.removeEventListener('pointerdown', skip);
      clearTimeout(run.next);
      if (!run || run.i !== at || !document.body.classList.contains('s-quiz')) return;
      next();
    };
    const skip = e => { if (e.target.closest('button:not(.opt)')) return; go(); };
    run.next = setTimeout(go, right ? 950 : 2100);
    setTimeout(() => {
      if (run && run.i === at) document.addEventListener('pointerdown', skip);
    }, 420);
  }

  function next() {
    run.i++;
    if (run.i >= run.qs.length) finish();
    else showQuestion();
  }

  function finish() {
    clearInterval(run.timer);
    try { speechSynthesis.cancel(); } catch (e) {}
    const sec = Math.max(1, Math.round((Date.now() - run.t0) / 1000));
    const total = run.qs.length, score = run.score;
    const pct = score / total;

    const nStars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
    $('stars').innerHTML = [0, 1, 2].map(i =>
      '<span class="' + (i < nStars ? '' : 'off') + '">' + (i < nStars ? '⭐' : '☆') + '</span>').join('');
    $('bigScore').innerHTML = score + '<span> ／ ' + total + '</span>';
    $('praise').textContent = pct === 1 ? '全對！你是注音小達人 🏆'
      : pct >= .8 ? '很厲害，再一點點就滿分！'
      : pct >= .5 ? '不錯喔，把錯的再練一次吧'
      : '沒關係，多練幾次就會了 💪';
    $('facts').innerHTML =
      '<div class="fact"><b>' + fmtTime(sec) + '</b>用時</div>' +
      '<div class="fact"><b>' + (sec / total).toFixed(1) + ' 秒</b>每題平均</div>' +
      '<div class="fact"><b>' + run.bestStreak + ' 題</b>最長連對</div>';

    // 最佳紀錄
    const key = pref.mode + '|' + pref.scope + '|' + pref.count;
    const prev = best[key];
    const better = !prev || score > prev.score || (score === prev.score && sec < prev.sec);
    if (better) { best[key] = { score, total, sec }; save(K_BEST, best); }
    $('bestWrap').innerHTML = better
      ? '<span class="newbest">🎉 新紀錄！</span>'
      : '<span class="newbest">最佳紀錄 ' + prev.score + '／' + prev.total + '・' + fmtTime(prev.sec) + '</span>';

    // 錯題
    const uniqWrong = [];
    run.wrong.forEach(it => { if (!uniqWrong.some(x => x.s === it.s)) uniqWrong.push(it); });
    $('wrongs').innerHTML = uniqWrong.length
      ? '<h2>📝 這幾個再看一下（' + uniqWrong.length + '）</h2>' + uniqWrong.map(it =>
          '<div class="wrow"><div class="ws zy">' + it.s + '</div>' +
          '<div class="wb"><div class="ww">' + it.e + ' ' + it.w + '</div>' +
          '<div class="wz zy">' + it.z + '</div></div>' +
          '<button class="wsay" type="button" data-say="' + it.w + '" aria-label="念一次">🔊</button></div>').join('')
      : '<h2>✨ 這回合全對，沒有要複習的！</h2>';
    $('wrongs').querySelectorAll('[data-say]').forEach(b =>
      b.addEventListener('click', () => speak(b.dataset.say)));

    $('retryWrongBtn').disabled = !uniqWrong.length;
    $('retryWrongBtn').textContent = uniqWrong.length ? '只練錯的（' + uniqWrong.length + '）' : '沒有錯題';
    run.lastWrong = uniqWrong;

    setScreen('result');
  }

  // ─────────────────────────────────────────────
  // 符號表
  // ─────────────────────────────────────────────
  function renderChart() {
    const hot = wrongSet();
    const body = $('chartBody');
    body.innerHTML = '';
    Object.keys(GROUPS).forEach(g => {
      const items = DATA.filter(d => d.g === g);
      const sec = document.createElement('div');
      sec.className = 'gsec';
      sec.innerHTML = '<h2>' + GROUPS[g].icon + ' ' + GROUPS[g].name +
                      ' <small>' + GROUPS[g].desc + '</small></h2>';
      const grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach(d => {
        const c = document.createElement('button');
        c.className = 'cell' + (hot.has(d.s) ? ' hot' : '');
        c.type = 'button';
        c.innerHTML = '<span class="cs zy">' + d.s + '</span><span class="ce">' + d.e + '</span>' +
                      '<span class="cw">' + d.w + '</span><span class="cz zy">' + d.z + '</span>';
        c.addEventListener('click', () => speak(d.w));
        grid.appendChild(c);
      });
      sec.appendChild(grid);
      body.appendChild(sec);
    });
  }

  // ─────────────────────────────────────────────
  // 綁定
  // ─────────────────────────────────────────────
  $('startBtn').addEventListener('click', () => {
    startRound(buildRound(pref.mode, pref.scope, pref.count));
  });
  $('againBtn').addEventListener('click', () => {
    startRound(buildRound(pref.mode, pref.scope, pref.count));
  });
  $('retryWrongBtn').addEventListener('click', () => {
    const list = (run && run.lastWrong) || [];
    if (!list.length) return;
    let qs = [];
    while (qs.length < Math.max(list.length, 6)) qs = qs.concat(shuffle(list));
    startRound(qs.slice(0, Math.max(list.length * 2, 6)).map(it => buildQuestion(it, pref.mode)));
  });
  $('backSetupBtn').addEventListener('click', () => { renderSetup(); setScreen('setup'); });
  $('quitBtn').addEventListener('click', () => {
    if (!confirm('要結束這回合嗎？答過的還是會算進紀錄。')) return;
    clearTimeout(run.next);
    if (run.i > 0) { run.qs = run.qs.slice(0, run.i); finish(); }
    else { clearInterval(run.timer); renderSetup(); setScreen('setup'); }
  });
  $('chartBtn').addEventListener('click', () => { renderChart(); setScreen('chart'); });
  $('chartBackBtn').addEventListener('click', () => { renderSetup(); setScreen('setup'); });

  // 鍵盤：1～4 選答案
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('s-quiz')) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      const b = $('opts').children[n - 1];
      if (b) b.click();
    }
  });

  renderSetup();
  setScreen('setup');
</script>
