<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>乘法表大考驗遊戲</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F7FF">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<!-- 加到 iPad 主畫面後用全螢幕開啟，不顯示 Safari 的網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #F2F7FF;
    --bg-2: #E2EDFF;
    --surface: #FFFFFF;
    --track: #DDE8FA;
    --ink: #26354C;
    --ink-soft: #6C819F;
    --ink-faint: #A2B3C9;
    --line: #DFE9F7;
    --blue: #4A8CF7;
    --blue-deep: #2F6FDC;
    --blue-soft: #E7F0FF;
    --mint: #35BE96;
    --mint-ink: #1E9C79;
    --mint-soft: #E1F7F0;
    --coral: #F2705C;
    --coral-ink: #D64B36;
    --coral-soft: #FFE9E5;
    --amber: #F5A623;
    --amber-soft: #FFF2DA;
    --shadow: 0 1px 2px rgba(47,111,220,.06), 0 8px 22px rgba(47,111,220,.10);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    /* 字級一共七種，要調整只改這裡。
       規則：設定與歷史畫面的字一律不超過主標，只有作答用的那三級可以更大 */
    --fs-title: 1.5rem;    /* 24px  主標，全 App 只有一個 */
    --fs-head:  1.25rem;   /* 20px  段落標題、主要按鈕、設定畫面的數字 */
    --fs-body:  .9375rem;  /* 15px  內文 */
    --fs-note:  .75rem;    /* 12px  說明、標籤 */
    --fs-mega:  4rem;      /* 64px  倒數、結算分數 */
    --fs-q:     2.75rem;   /* 44px  題目 */
    --fs-opt:   1.75rem;   /* 28px  四個選項、剩餘秒數 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161E2B; --bg-2: #1D2837; --surface: #212D3F; --track: #161E2B;
      --ink: #E9F1FB; --ink-soft: #A6BAD4; --ink-faint: #71879F; --line: #33445C;
      --blue: #6EA6FF; --blue-deep: #9CC3FF; --blue-soft: rgba(110,166,255,.16);
      --mint: #57D6B0; --mint-ink: #86E7C9; --mint-soft: rgba(87,214,176,.16);
      --coral: #FF8C79; --coral-ink: #FFA695; --coral-soft: rgba(255,140,121,.16);
      --amber: #FFC15E; --amber-soft: rgba(255,193,94,.16);
      --shadow: 0 1px 2px rgba(0,0,0,.22), 0 10px 26px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F7FF; --bg-2: #E2EDFF; --surface: #FFFFFF; --track: #DDE8FA;
    --ink: #26354C; --ink-soft: #6C819F; --ink-faint: #A2B3C9; --line: #DFE9F7;
    --blue: #4A8CF7; --blue-deep: #2F6FDC; --blue-soft: #E7F0FF;
    --mint: #35BE96; --mint-ink: #1E9C79; --mint-soft: #E1F7F0;
    --coral: #F2705C; --coral-ink: #D64B36; --coral-soft: #FFE9E5;
    --amber: #F5A623; --amber-soft: #FFF2DA;
    --shadow: 0 1px 2px rgba(47,111,220,.06), 0 8px 22px rgba(47,111,220,.10);
  }
  :root[data-theme="dark"] {
    --bg: #161E2B; --bg-2: #1D2837; --surface: #212D3F; --track: #161E2B;
    --ink: #E9F1FB; --ink-soft: #A6BAD4; --ink-faint: #71879F; --line: #33445C;
    --blue: #6EA6FF; --blue-deep: #9CC3FF; --blue-soft: rgba(110,166,255,.16);
    --mint: #57D6B0; --mint-ink: #86E7C9; --mint-soft: rgba(87,214,176,.16);
    --coral: #FF8C79; --coral-ink: #FFA695; --coral-soft: rgba(255,140,121,.16);
    --amber: #FFC15E; --amber-soft: rgba(255,193,94,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.22), 0 10px 26px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  /* 按鈕的 display:inline-flex 會蓋掉 hidden 屬性，這裡把它扳回來 */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font); color: var(--ink);
    background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), transparent 60%), var(--bg);
    -webkit-text-size-adjust: 100%; line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.5) blur(12px);
    -webkit-backdrop-filter: saturate(1.5) blur(12px);
    border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 0 0;
  }
  .head-inner {
    max-width: 560px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 {
    font-size: var(--fs-title); font-weight: 800; margin: 0; flex: 1; min-width: 0;
    letter-spacing: -.02em; line-height: 1.15;
  }
  h1 span {
    font-size: var(--fs-note); font-weight: 600; color: var(--blue-deep); display: block; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .icobtn {
    font-family: inherit; font-size: var(--fs-body); line-height: 1;
    width: 40px; height: 40px; flex: 0 0 auto;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 99px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .icobtn:active { transform: translateY(1px); }
  .icobtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .icobtn.off { color: var(--ink-faint); }

  .btn {
    font-family: inherit; font-size: var(--fs-body); font-weight: 700;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 10px 18px; border-radius: 99px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; transition: background .15s, border-color .15s, color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.big { width: 100%; font-size: var(--fs-head); padding: 16px; min-height: 58px; border-radius: 18px; }
  .btn.ghost { color: var(--ink-soft); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* screens */
  .screen { display: none; }
  .screen.on { display: block; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; margin-top: 14px;
  }
  .card h2 {
    font-size: var(--fs-head); font-weight: 800; margin: 0 0 14px; color: var(--ink);
    letter-spacing: -.01em; display: flex; align-items: center; gap: 10px;
  }
  .card h2 .n {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 99px;
    background: var(--blue); color: #fff; font-size: var(--fs-body);
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  /* ── setup ── */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    font-family: inherit; cursor: pointer; color: var(--ink);
    background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
    padding: 12px 6px; text-align: center; transition: all .14s; position: relative;
  }
  .tile:active { transform: translateY(1px); }
  .tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tile b { display: block; font-size: var(--fs-head); font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile i { display: block; font-style: normal; font-size: var(--fs-note); color: var(--ink-faint); font-weight: 700; margin-top: 2px; white-space: nowrap; }
  .tile.sel { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-deep); }
  .tile.sel i { color: var(--blue-deep); }
  .tile .mark { position: absolute; top: 4px; right: 6px; font-size: var(--fs-note); line-height: 1; }
  .tile .warn { color: var(--coral-ink); font-weight: 800; }
  .tile .cup { font-size: var(--fs-body); top: 3px; right: 4px; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row.mt { margin-top: 12px; }
  .grow { flex: 1; }
  .hint { font-size: var(--fs-note); color: var(--ink-soft); margin: 10px 2px 0; line-height: 1.6; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modes.three { grid-template-columns: repeat(3, 1fr); }
  .modes.three .mode { text-align: center; padding: 13px 6px; }
  .modes.three .mode b { font-size: var(--fs-head); font-variant-numeric: tabular-nums; }
  .mode {
    font-family: inherit; cursor: pointer; color: var(--ink); text-align: left;
    background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
    padding: 12px 13px; transition: all .14s;
  }
  .mode.sel { border-color: var(--blue); background: var(--blue-soft); }
  .mode b { display: block; font-size: var(--fs-body); font-weight: 800; }
  .mode i { display: block; font-style: normal; font-size: var(--fs-note); color: var(--ink-soft); margin-top: 3px; }
  .mode.sel i { color: var(--blue-deep); }

  /* ── play ── */
  .hud { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .clock {
    font-size: var(--fs-opt); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--blue-deep); min-width: 62px; letter-spacing: -.02em;
  }
  .clock.low { color: var(--coral-ink); animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .clock small { font-size: var(--fs-note); font-weight: 700; color: var(--ink-faint); margin-left: 2px; }
  .bar { flex: 1; height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--blue); border-radius: 99px; }
  .bar > i.low { background: var(--coral); }
  .qnum { font-size: var(--fs-body); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: 52px; text-align: right; }

  .dots { display: flex; gap: 5px; margin-top: 10px; }
  .dots i { flex: 1; height: 8px; border-radius: 99px; background: var(--track); transition: background .2s; }
  .dots i.ok { background: var(--mint); }
  .dots i.no { background: var(--coral); }
  .dots i.now { background: var(--blue); }

  .qcard {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-top: 12px; padding: 30px 16px 26px;
    text-align: center; position: relative; overflow: hidden;
  }
  .qcard.good { border-color: var(--mint); background: var(--mint-soft); }
  .qcard.bad  { border-color: var(--coral); background: var(--coral-soft); animation: shake .32s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); }
    50% { transform: translateX(6px); } 75% { transform: translateX(-4px); }
  }
  .qtext {
    font-size: var(--fs-q); font-weight: 800; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .qtext em { font-style: normal; color: var(--ink-faint); margin: 0 .1em; }
  .qtext .ans { color: var(--mint-ink); }
  .streak {
    font-size: var(--fs-body); font-weight: 800; color: var(--amber);
    min-height: 24px; margin-top: 10px;
  }
  .streak small { font-weight: 700; color: var(--ink-faint); margin-left: 8px; }

  /* 公布答案時的停留倒數，讓他知道畫面等一下會自己換 */
  .revealbar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--coral); }
  .qcard.bad .revealbar { animation: drain var(--reveal, 4s) linear forwards; }
  @keyframes drain { from { width: 100%; } to { width: 0; } }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opt {
    font-family: inherit; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); padding: 18px 8px; min-height: 76px;
    font-size: var(--fs-opt); font-weight: 800; font-variant-numeric: tabular-nums;
    transition: transform .1s, background .15s, border-color .15s, color .15s;
  }
  .opt:active { transform: translateY(2px); }
  .opt:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .opt.good { background: var(--mint); border-color: var(--mint); color: #fff; }
  .opt.bad { background: var(--coral); border-color: var(--coral); color: #fff; }
  .opt.dim { opacity: .38; }

  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .spark { position: absolute; font-size: var(--fs-opt); animation: fly .9s ease-out forwards; }
  @keyframes fly {
    from { opacity: 1; transform: translate(0,0) scale(.6) rotate(0deg); }
    to { opacity: 0; transform: translate(var(--dx), -120px) scale(1.4) rotate(var(--rot)); }
  }

  .countdown {
    position: fixed; inset: 0; z-index: 70; display: flex;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    font-size: var(--fs-mega); font-weight: 800; color: var(--blue-deep);
  }
  .countdown b { animation: pop .7s ease; display: block; }
  .countdown b.go { font-size: var(--fs-q); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } 45% { transform: scale(1.12); opacity: 1; } to { transform: scale(1); opacity: 1; } }

  /* ── result ── */
  .bigscore { text-align: center; padding: 8px 0 4px; }
  .bigscore .n { font-size: var(--fs-mega); font-weight: 800; line-height: 1; color: var(--mint-ink); font-variant-numeric: tabular-nums; }
  .bigscore .n small { font-size: var(--fs-body); color: var(--ink-soft); font-weight: 700; margin-left: 4px; }
  .bigscore .msg { font-size: var(--fs-head); font-weight: 800; margin-top: 10px; }
  .bigscore .rec {
    display: inline-block; margin-top: 10px; font-size: var(--fs-note); font-weight: 800;
    background: var(--amber-soft); color: var(--amber); padding: 5px 12px; border-radius: 99px;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 11px 6px; text-align: center; }
  .stat b { display: block; font-size: var(--fs-head); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat b small { font-size: var(--fs-note); color: var(--ink-soft); }
  .stat i { display: block; font-style: normal; font-size: var(--fs-note); color: var(--ink-soft); font-weight: 700; margin-top: 2px; }

  .wrongs { display: flex; flex-wrap: wrap; gap: 8px; }
  .wchip {
    background: var(--coral-soft); color: var(--coral-ink); border-radius: 12px;
    padding: 9px 13px; font-size: var(--fs-body); font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .wchip small { font-weight: 700; opacity: .7; margin-left: 4px; font-size: var(--fs-note); }
  .empty { color: var(--ink-soft); font-size: var(--fs-body); text-align: center; padding: 8px 0; }

  /* ── history ── */
  .chart { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 110px; padding-top: 6px; }
  .chart .col { flex: 1; max-width: 42px; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .chart .col u { font-style: normal; text-decoration: none; font-size: var(--fs-note); font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chart .col b { display: block; width: 100%; background: var(--blue); border-radius: 6px; min-height: 4px; }
  .chart .col:last-child b { background: var(--mint); }
  .chart .col em { font-style: normal; font-size: var(--fs-note); color: var(--ink-faint); }

  .days { display: flex; flex-direction: column; }
  .dayrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .dayrow:first-child { border-top: 0; padding-top: 2px; }
  .dayrow .d { font-size: var(--fs-body); font-weight: 800; font-variant-numeric: tabular-nums; }
  .dayrow .d em { font-style: normal; color: var(--blue-deep); margin-left: 5px; }
  .dayrow .c {
    font-size: var(--fs-note); font-weight: 800; color: #fff; background: var(--blue);
    border-radius: 99px; padding: 3px 10px; margin-left: auto;
  }
  .dayrow .ts { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .sess {
    font-size: var(--fs-note); font-weight: 700; color: var(--ink-soft);
    background: var(--bg); border-radius: 9px; padding: 4px 9px;
    font-variant-numeric: tabular-nums;
  }
  .sess u { text-decoration: none; color: var(--blue-deep); margin-left: 6px; }
  .sess b { color: var(--mint-ink); margin-left: 6px; }
  .sess.miss b { color: var(--coral-ink); }

  .weak { display: flex; flex-direction: column; gap: 8px; }
  .wrow { display: flex; align-items: center; gap: 10px; }
  .wrow .q { font-size: var(--fs-body); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; }
  .wrow .t { flex: 1; height: 9px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .wrow .t i { display: block; height: 100%; background: var(--coral); border-radius: 99px; }
  .wrow .t i.hi { background: var(--mint); }
  .wrow .t i.mid { background: var(--amber); }
  .wrow .t i.thin { background: var(--ink-faint); }
  .wrow .p { font-size: var(--fs-note); font-weight: 800; color: var(--coral-ink); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  .wrow .p.hi { color: var(--mint-ink); }
  .wrow .p.mid { color: var(--amber); }
  .wrow .p.thin { color: var(--ink-faint); }
  .wrow .p small { display: block; font-weight: 700; color: var(--ink-faint); white-space: nowrap; }

  .foot { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .tiny { font-size: var(--fs-note); color: var(--ink-faint); text-align: center; margin-top: 16px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  /* 平板：欄寬和字級一起放大，不然在 iPad 上會是小小一坨浮在畫面中間 */
  @media (min-width: 700px) {
    :root {
      --fs-title: 1.85rem;   /* 30px */
      --fs-head:  1.5rem;    /* 24px */
      --fs-body:  1.0625rem; /* 17px */
      --fs-note:  .85rem;    /* 13.6px */
      --fs-mega:  5.5rem;    /* 88px */
      --fs-q:     4rem;      /* 64px */
      --fs-opt:   2.6rem;    /* 42px */
    }
    .wrap { max-width: 720px; padding-bottom: 56px; }
    .head-inner { max-width: 720px; padding: 16px; }
    .icobtn { width: 48px; height: 48px; }
    .card { padding: 22px; border-radius: 24px; margin-top: 18px; }
    .card h2 { margin-bottom: 18px; gap: 12px; }
    .card h2 .n { width: 36px; height: 36px; }
    .tiles { gap: 12px; }
    .tile { padding: 16px 6px; border-radius: 18px; }
    .mode { padding: 16px; border-radius: 18px; }
    .btn { min-height: 50px; padding: 12px 22px; }
    .btn.big { min-height: 72px; border-radius: 22px; }
    .hud { gap: 14px; margin-top: 18px; }
    .bar { height: 14px; }
    .dots { gap: 7px; }
    .dots i { height: 10px; }
    .qcard { padding: 40px 20px 34px; border-radius: 24px; }
    .opts { gap: 14px; margin-top: 16px; }
    .opt { min-height: 116px; border-radius: 22px; }
    .stat { padding: 16px 8px; border-radius: 16px; }
    .chart { height: 140px; }
  }

  /* 桌機／大平板：主要使用場景，再放大一級。
     也要求夠高，否則放大後作答畫面會被擠出一屏之外 */
  @media (min-width: 1100px) and (min-height: 900px) {
    :root {
      --fs-title: 2.1rem;   /* 34px */
      --fs-head:  1.7rem;   /* 27px */
      --fs-body:  1.15rem;  /* 18px */
      --fs-note:  .92rem;   /* 15px */
      --fs-mega:  6.5rem;   /* 104px */
      --fs-q:     4.75rem;  /* 76px */
      --fs-opt:   3rem;     /* 48px */
    }
    .wrap { max-width: 840px; }
    .head-inner { max-width: 840px; padding: 18px 16px; }
    .icobtn { width: 54px; height: 54px; }
    .card h2 .n { width: 40px; height: 40px; }
    .qcard { padding: 52px 20px 44px; }
    .opt { min-height: 140px; }

  }

  /* 又寬又矮的筆電螢幕：收斂一點，讓作答畫面不用捲動就看得完 */
  @media (min-width: 700px) and (max-height: 750px) {
    :root { --fs-q: 3.2rem; --fs-opt: 2.2rem; --fs-mega: 4.5rem; --fs-title: 1.6rem; }
    .card { margin-top: 12px; }
    .qcard { padding: 26px 20px 22px; }

  }

  /* 小螢幕只調字級變數，不動個別元件，才不會又長出中間尺寸 */
  @media (max-width: 360px) {
    :root { --fs-title: 1.32rem; --fs-head: 1.15rem; --fs-q: 2.3rem; --fs-opt: 1.5rem; --fs-mega: 3.4rem; }
    .opt { min-height: 68px; }

</style>
</head>
<body>

<header>
  <div class="head-inner">

<div class="wrap">

  <!-- ══ 設定 ══ -->
  <section class="screen on" id="setup">
    <div class="card">
      <h2><span class="n">1</span>今天要練哪幾段？</h2>
      <div class="tiles" id="tiles"></div>
      <div class="row mt">
        <button class="btn ghost grow" id="selAll">全選</button>
        <button class="btn ghost grow" id="selNone">全部清除</button>

      </div>
      <p class="hint" id="tileHint">選好段數後就可以開始。紅點代表這一段以前比較常錯。</p>
    </div>

    <div class="card">
      <h2><span class="n">2</span>一輪幾題？</h2>
      <div class="modes three" id="counts">
        <button class="mode sel" data-count="10"><b>10 題</b><i>約 1 分鐘</i></button>
        <button class="mode" data-count="15"><b>15 題</b><i>約 2 分鐘</i></button>
        <button class="mode" data-count="20"><b>20 題</b><i>約 3 分鐘</i></button>
      </div>
      <p class="hint">每題都有 30 秒可以想，時間到才算答錯。</p>

    <div class="card">
      <h2><span class="n">3</span>出題方式</h2>

        </button>

        </button>

    </div>

    <div class="foot">
      <button class="btn primary big" id="startBtn">開始測驗（10 題）🚀</button>
      <button class="btn" id="reviewBtn" hidden>只練上次的錯題 🔁</button>
    </div>
    <p class="tiny">紀錄只存在這台裝置的瀏覽器裡，不會上傳。</p>

  <!-- ══ 作答 ══ -->

  <!-- ══ 結果 ══ -->
  <section class="screen" id="result">
    <div class="card">
      <div class="bigscore">
        <div class="n" id="rScore">0<small>/ 10</small></div>
        <div class="msg" id="rMsg"></div>
        <div id="rRec"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="rAcc">0%</b><i>正確率</i></div>
        <div class="stat"><b id="rWrong">0</b><i>答錯</i></div>
        <div class="stat"><b id="rTime">0秒</b><i>總花費時間</i></div>
      </div>

    <div class="card">
      <h2>要複習的題目</h2>

      <button class="btn ghost" id="clearBtn">清除所有紀錄</button>
    </div>
  </section>

</div>

<div class="fx" id="fx"></div>

<script>
(function () {
  'use strict';

  /* ────────── 資料儲存 ────────── */
  var TABLES = [2, 3, 4, 5, 6, 7, 8, 9];   // 1 的乘法太簡單，不列入練習
  var KEY = 'mtq_v2', OLD_KEY = 'mtq_v1';
  var DEF = { sound: true, speak: true, tables: TABLES.slice(), mode: 'smart', count: 10,
              perQ: {}, runs: [], best: {}, lastWrong: [] };
  var db;

  // DEF 裡有物件跟陣列，一定要複製一份，不然會被改到預設值本身
  function blank() { return JSON.parse(JSON.stringify(DEF)); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        db = Object.assign(blank(), JSON.parse(raw));
      } else {
        db = blank();
        // 舊版是 60 秒不限題數，成績無法跟現在互相比較，只帶過設定與弱點統計
        var old = localStorage.getItem(OLD_KEY);
        if (old) {
          var o = JSON.parse(old);
          if (o.perQ && typeof o.perQ === 'object') db.perQ = o.perQ;
          if (typeof o.sound === 'boolean') db.sound = o.sound;
          if (Array.isArray(o.tables) && o.tables.length) db.tables = o.tables;
          if (o.mode) db.mode = o.mode;
        }
      }
    } catch (e) { db = blank(); }
    // 舊版可以選 1 段，把它濾掉
    db.tables = (Array.isArray(db.tables) ? db.tables : []).filter(function (t) {
      return TABLES.indexOf(t) >= 0;
    });
    if (!db.tables.length) db.tables = TABLES.slice();
    if (!db.perQ || typeof db.perQ !== 'object') db.perQ = {};
    if (!Array.isArray(db.runs)) db.runs = [];
    if ([10, 15, 20].indexOf(db.count) < 0) db.count = DEF.count;
    // 最佳紀錄要照題數分開存，10 題和 20 題的成績沒得比
    if (db.best && db.best.correct !== undefined) {
      var b = db.best; db.best = {}; db.best[b.total || 10] = b;
    }
    if (!db.best || typeof db.best !== 'object') db.best = {};
  }

  function fmtTime(ms) {
    var s = Math.round(ms / 1000);
    return s < 60 ? s + '秒' : Math.floor(s / 60) + '分' + (s % 60) + '秒';
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clockOf(ts) {
    var d = new Date(ts);
    return d.getHours() + ':' + pad(d.getMinutes());
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }

  /* ────────── 小工具 ────────── */
  var $ = function (id) { return document.getElementById(id); };
  function key(a, b) { return a + 'x' + b; }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  // 2,3,4,7 → 「2–4、7」，段數選很多時標題才不會爆掉
  function tableLabel(list) {
    var out = [], i = 0;
    while (i < list.length) {
      var j = i;
      while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
      out.push(j - i >= 2 ? list[i] + '–' + list[j] : list.slice(i, j + 1).join('、'));
      i = j + 1;
    }
    return out.join('、');
  }

  function stat(a, b) {
    var s = db.perQ[key(a, b)];
    return s || { n: 0, w: 0 };
  }

  /* ────────── 音效 ────────── */
  var ac = null, master = null;

  // iOS 只允許在使用者手勢裡建立／喚醒 AudioContext，
  // 所以按下按鈕的當下就先開起來，不然第一次的音效會整個沒聲音
  function initAudio() {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        var comp = ac.createDynamicsCompressor();   // 音量拉高後壓一下，避免破音
        comp.threshold.setValueAtTime(-14, ac.currentTime);
        comp.ratio.setValueAtTime(6, ac.currentTime);
        master = ac.createGain();
        master.gain.setValueAtTime(1, ac.currentTime);
        master.connect(comp); comp.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }

  function beep(freq, dur, type, vol, delay) {
    if (!db.sound) return;
    try {
      initAudio();
      if (!ac) return;
      var t0 = ac.currentTime + (delay || 0);
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.4, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  /* ────────── 朗讀 ────────── */
  var CN = ['零','一','二','三','四','五','六','七','八','九'];
  function cn(n) {                       // 1–99 轉成國字：10→十、25→二十五
    if (n < 10) return CN[n];
    if (n < 20) return '十' + (n % 10 ? CN[n % 10] : '');
    return CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
  }

  // 公布答案念傳統口訣：九八七十二、二五一十、二三得六
  function chant(a, b) {
    var ans = a * b;
    if (ans < 10) return cn(a) + cn(b) + '得' + cn(ans);
    if (ans === 10) return cn(a) + cn(b) + '一十';   // 口訣念「一十」不念「十」
    return cn(a) + cn(b) + cn(ans);
  }

  var canSpeak = typeof window.speechSynthesis !== 'undefined' &&
                 typeof window.SpeechSynthesisUtterance !== 'undefined';
  var zhVoice = null;

  // 沒有中文語音就整個關掉，總比用英文腔去念中文好
  function pickVoice() {
    if (!canSpeak) return;
    var vs = [];
    try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
    var zh = vs.filter(function (v) { return /^zh\b|^zh[-_]/i.test(v.lang || ''); });
    zh.sort(function (a, b) {
      var rank = function (v) {
        if (/TW|Hant/i.test(v.lang)) return 0;
        if (/HK/i.test(v.lang)) return 1;
        return 2;
      };
      return rank(a) - rank(b);
    });
    zhVoice = zh[0] || null;
    syncSpeak();
  }

  function say(text, delay) {
    if (!db.speak || !canSpeak || !zhVoice) return;
    setTimeout(function () {
      if (!db.speak) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.voice = zhVoice;
        u.lang = zhVoice.lang || 'zh-TW';
        u.rate = 0.95;
        u.pitch = 1.05;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }, delay || 0);
  }

  function hushSpeech() {
    if (!canSpeak) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  var SFX = {
    right: function () { beep(880, 0.11, 'sine', 0.46, 0); beep(1320, 0.15, 'sine', 0.40, 0.07); },
    wrong: function () { beep(240, 0.22, 'triangle', 0.42, 0); beep(180, 0.26, 'triangle', 0.36, 0.11); },
    tick:  function () { beep(620, 0.09, 'sine', 0.34, 0); },
    go:    function () { beep(990, 0.22, 'sine', 0.48, 0); },
    combo: function () { beep(1050, 0.10, 'sine', 0.42, 0); beep(1400, 0.13, 'sine', 0.36, 0.08); },
    end:   function () {
      [660, 830, 990, 1320].forEach(function (f, i) { beep(f, 0.20, 'sine', 0.40, i * 0.11); });
    }
  };

  /* ────────── 畫面切換 ────────── */
  var SCREENS = ['setup', 'play', 'result', 'history'];
  function show(name) {
    SCREENS.forEach(function (s) { $(s).classList.toggle('on', s === name); });
    window.scrollTo(0, 0);
  }

  /* ────────── 設定畫面 ────────── */
  var picked = [];

  var MASTER_RATE = 0.9;   // 答對率到這個門檻就給獎盃
  var MIN_TRIES = 5;       // 但至少要練過這麼多題，不然一題全對就拿獎盃了

  function tableStat(t) {
    var n = 0, w = 0;
    for (var b = 1; b <= 9; b++) { var s = stat(t, b); n += s.n; w += s.w; }
    return { n: n, w: w, rate: n ? (n - w) / n : 0 };
  }
  function tableRisk(t) {
    var s = tableStat(t);
    return s.n >= 4 ? s.w / s.n : 0;
  }
  function mastered(t) {
    var s = tableStat(t);
    return s.n >= MIN_TRIES && s.rate >= MASTER_RATE;
  }

  function buildTiles() {
    var box = $('tiles');
    box.innerHTML = '';
    for (var t = TABLES[0]; t <= 9; t++) {
      (function (t) {
        var risk = tableRisk(t);
        var el = document.createElement('button');
        el.className = 'tile' + (picked.indexOf(t) >= 0 ? ' sel' : '');
        el.setAttribute('aria-pressed', picked.indexOf(t) >= 0 ? 'true' : 'false');
        var mark = mastered(t) ? '<span class="mark cup" title="答對率 90% 以上">🏆</span>'
                 : (risk >= 0.2 ? '<span class="mark warn">●</span>' : '');
        el.innerHTML = '<b>' + t + '</b><i>' + t + ' 的乘法</i>' + mark;
        el.addEventListener('click', function () {
          var i = picked.indexOf(t);
          if (i >= 0) picked.splice(i, 1); else picked.push(t);
          picked.sort(function (a, b) { return a - b; });
          buildTiles(); syncStart();
        });
        box.appendChild(el);
      })(t);
    }
  }

  function syncStart() {
    $('startBtn').disabled = picked.length === 0;
    $('startBtn').textContent = '開始測驗（' + db.count + ' 題）🚀';
    $('tileHint').textContent = picked.length === 0
      ? '至少要選一段才能開始喔。'
      : '已選 ' + picked.join('、') + ' 段，共 ' + (picked.length * 8) + ' 種題目。' +
        '🏆 代表那一段答對率已經 90% 以上，紅點代表比較常錯。';
  }

  $('selAll').addEventListener('click', function () {
    picked = TABLES.slice(); buildTiles(); syncStart();
  });
  $('selNone').addEventListener('click', function () {
    picked = []; buildTiles(); syncStart();
  });
  $('selWeak').addEventListener('click', function () {
    var ranked = [];
    TABLES.forEach(function (t) { ranked.push({ t: t, r: tableRisk(t) }); });
    ranked.sort(function (a, b) { return b.r - a.r; });
    var weak = ranked.filter(function (x) { return x.r > 0; }).slice(0, 3).map(function (x) { return x.t; });
    if (!weak.length) {
      $('tileHint').textContent = '還沒有足夠的練習紀錄，先隨便選幾段玩玩看吧！';
      return;
    }
    picked = weak.sort(function (a, b) { return a - b; });
    buildTiles(); syncStart();
  });

  function segment(boxId, apply) {
    var box = $(boxId);
    box.querySelectorAll('.mode').forEach(function (m) {
      m.addEventListener('click', function () {
        box.querySelectorAll('.mode').forEach(function (x) { x.classList.remove('sel'); });
        m.classList.add('sel');
        apply(m); save();
      });
    });
  }
  segment('counts', function (m) { db.count = Number(m.dataset.count); syncStart(); });
  segment('modes', function (m) { db.mode = m.dataset.mode; });

  /* ────────── 出題 ────────── */
  var PER_Q = 30;    // 每題可以想幾秒
  var S = null;

  function buildPool(tables) {
    var pool = [];
    tables.forEach(function (t) {
      // 從 ×2 開始：乘以 1 是送分題，會稀釋掉練習量也會把答對率篩高
      for (var b = 2; b <= 9; b++) pool.push({ a: t, b: b });
    });
    return pool;
  }

  function pickQuestion() {
    var pool = S.pool;
    if (pool.length === 1) return pool[0];
    var cands = pool.filter(function (q) {
      return !S.last || q.a !== S.last.a || q.b !== S.last.b;
    });
    if (!cands.length) cands = pool;
    if (S.mode === 'even') return cands[Math.floor(Math.random() * cands.length)];

    var weights = cands.map(function (q) {
      var s = stat(q.a, q.b);
      var w = 1 + s.w * 2;                       // 以前錯過 → 更常出現
      if (s.n === 0) w += 1.2;                   // 沒練過的也多給機會
      if (S.recentWrong[key(q.a, q.b)]) w += 4;  // 這一輪剛剛才錯 → 馬上再考
      return Math.min(w, 9);
    });
    var sum = weights.reduce(function (x, y) { return x + y; }, 0);
    var r = Math.random() * sum;
    for (var i = 0; i < cands.length; i++) {
      r -= weights[i];
      if (r <= 0) return cands[i];
    }
    return cands[cands.length - 1];
  }

  function makeOptions(a, b) {
    var ans = a * b;
    var set = [];
    function add(v) {
      if (v > 0 && v !== ans && set.indexOf(v) < 0) set.push(v);
    }
    // 最像的錯法：少加一次 / 多加一次、鄰近的乘法答案
    shuffle([ans + a, ans - a, ans + b, ans - b, a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b])
      .forEach(add);
    shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10]).forEach(add);
    for (var k = 1; set.length < 3; k++) { add(ans + k); add(ans - k); }
    return shuffle([ans, set[0], set[1], set[2]]);
  }

  /* ────────── 遊戲流程 ────────── */
  var timer = null, lock = false;

  function startGame(tables, opts) {
    opts = opts || {};
    var review = !!opts.pool;
    // 錯題只有一兩題時不用硬湊滿一輪，免得一直重複同一題
    var total = review ? Math.min(db.count, Math.max(4, opts.pool.length * 3)) : db.count;
    S = {
      pool: review ? opts.pool : buildPool(tables),
      tables: tables.slice(),
      mode: review ? 'even' : db.mode,
      total: total, idx: 0, results: [],
      correct: 0, wrong: 0, streak: 0, bestStreak: 0,
      wrongList: [], recentWrong: {}, last: null,
      reviewMode: review,
      qEndAt: 0, startedAt: 0, finishedAt: 0, running: false
    };
    $('subtitle').textContent = review
      ? '錯題複習 ・ ' + total + ' 題'
      : tableLabel(tables) + ' 段 ・ ' + total + ' 題';
    renderDots();
    $('qcard').className = 'qcard';
    $('streakTxt').textContent = '';
    $('qnum').textContent = '1 / ' + total;
    $('clock').innerHTML = PER_Q + '<small>秒</small>';
    $('timeBar').style.width = '100%';
    show('play');
    countdown(3);
  }

  function renderDots() {
    var box = $('dots');
    box.innerHTML = '';
    for (var i = 0; i < S.total; i++) box.appendChild(document.createElement('i'));
  }

  function updateDots() {
    var els = $('dots').children;
    for (var i = 0; i < els.length; i++) {
      els[i].className = S.results[i] || (i === S.idx - 1 ? 'now' : '');
    }
  }

  function countdown(n) {
    var el = document.createElement('div');
    el.className = 'countdown';
    document.body.appendChild(el);
    var i = n;
    function step() {
      if (i > 0) {
        el.innerHTML = '<b>' + i + '</b>';
        SFX.tick();
        i--;
        setTimeout(step, 700);
      } else {
        el.innerHTML = '<b class="go">開始！</b>';
        SFX.go();
        setTimeout(function () {
          el.remove();
          S.running = true;
          S.startedAt = Date.now();
          timer = setInterval(tickClock, 100);
          nextQuestion();
        }, 550);
      }
    }
    step();
  }

  function tickClock() {
    if (!S || !S.running || lock) return;   // 對答案的空檔先把計時凍住
    var left = Math.max(0, S.qEndAt - Date.now()) / 1000;
    var secs = Math.ceil(left);
    $('clock').innerHTML = secs + '<small>秒</small>';
    $('clock').classList.toggle('low', secs <= 10);
    var bar = $('timeBar');
    bar.style.width = (left / PER_Q * 100) + '%';
    bar.classList.toggle('low', secs <= 10);
    if (left <= 0) timeUp();
  }

  function nextQuestion() {
    clearReveal();
    if (!S.running) return;
    if (S.idx >= S.total) { endGame(true); return; }
    S.idx++;
    lock = false;
    S.canSkip = false;
    var q = pickQuestion();
    S.last = q;
    S.q = q;
    S.qEndAt = Date.now() + PER_Q * 1000;
    $('qcard').className = 'qcard';
    $('streakTxt').textContent = '';   // 上一題的正確答案絕對不能留到這一題
    $('qtext').innerHTML = q.a + ' <em>×</em> ' + q.b;
    $('qnum').textContent = S.idx + ' / ' + S.total;
    updateDots();
    var opts = makeOptions(q.a, q.b);
    document.querySelectorAll('.opt').forEach(function (btn, i) {
      btn.className = 'opt';
      btn.textContent = opts[i];
      btn.dataset.val = opts[i];
      btn.disabled = false;
    });
    say(cn(q.a) + '乘' + cn(q.b) + '等於幾', 120);
    tickClock();
  }

  // 答錯或時間到：把正確答案亮出來給他看
  function revealAnswer(ans, chosen) {
    document.querySelectorAll('.opt').forEach(function (o) {
      if (Number(o.dataset.val) === ans) o.classList.add('good');
      else if (o !== chosen) o.classList.add('dim');
      o.disabled = true;
    });
  }

  // 公布答案後停留多久才換下一題；前面這段時間不接受點擊，免得他連點把答案跳掉
  var REVEAL_MS = 4000, SKIP_AFTER = 1200;
  var revealTimer = null, skipTimer = null;

  function clearReveal() {
    clearTimeout(revealTimer); clearTimeout(skipTimer);
    revealTimer = skipTimer = null;
  }

  function showAnswer(q, note) {
    var ans = q.a * q.b;
    $('qtext').innerHTML = q.a + ' <em>×</em> ' + q.b + ' <em>=</em> <b class="ans">' + ans + '</b>';
    $('streakTxt').textContent = note;
    say(chant(q.a, q.b), 300);   // 讓答錯的音效先響完
    S.canSkip = false;
    clearReveal();
    skipTimer = setTimeout(function () {
      S.canSkip = true;
      $('streakTxt').innerHTML = note + '<small>點一下繼續</small>';
    }, SKIP_AFTER);
    revealTimer = setTimeout(nextQuestion, REVEAL_MS);
  }

  function markWrong(q, note) {
    var k = key(q.a, q.b);
    S.wrong++; S.streak = 0;
    S.recentWrong[k] = true;
    S.results[S.idx - 1] = 'no';
    if (!S.wrongList.some(function (x) { return x.a === q.a && x.b === q.b; })) {
      S.wrongList.push({ a: q.a, b: q.b });
    }
    S.finishedAt = Date.now();
    $('qcard').classList.add('bad');
    SFX.wrong();
    updateDots();
    showAnswer(q, note);
  }

  function timeUp() {
    if (lock) return;
    lock = true;
    var q = S.q, k = key(q.a, q.b);
    var rec = db.perQ[k] || (db.perQ[k] = { n: 0, w: 0 });
    rec.n++; rec.w++;
    markWrong(q, '時間到！');
    revealAnswer(q.a * q.b, null);
    save();
  }

  function answer(val, btn) {
    if (lock || !S.running) return;
    lock = true;
    var q = S.q, ans = q.a * q.b, k = key(q.a, q.b);
    var rec = db.perQ[k] || (db.perQ[k] = { n: 0, w: 0 });
    rec.n++;

    if (val === ans) {
      S.correct++; S.streak++;
      if (S.streak > S.bestStreak) S.bestStreak = S.streak;
      delete S.recentWrong[k];
      S.results[S.idx - 1] = 'ok';
      S.finishedAt = Date.now();
      btn.classList.add('good');
      $('qcard').classList.add('good');
      SFX.right();
      sparkle(btn);
      if (S.streak > 0 && S.streak % 5 === 0) {
        $('streakTxt').textContent = '🔥 連續答對 ' + S.streak + ' 題！';
        SFX.combo();
      } else {
        $('streakTxt').textContent = S.streak >= 2 ? '連對 ' + S.streak : '';
      }
      updateDots();
      setTimeout(nextQuestion, 420);
    } else {
      rec.w++;
      markWrong(q, '答錯了');
      btn.classList.add('bad');
      revealAnswer(ans, btn);
    }
    save();
  }

  document.querySelectorAll('.opt').forEach(function (btn) {
    btn.addEventListener('click', function () { answer(Number(btn.dataset.val), btn); });
  });

  // 看完答案想提早繼續：點畫面任一處（結束按鈕除外）
  function skipReveal() {
    if (!lock || !S || !S.running || !S.canSkip) return false;
    nextQuestion();
    return true;
  }
  $('play').addEventListener('click', function (e) {
    if (e.target.closest('#quitBtn')) return;
    skipReveal();
  });
  document.addEventListener('keydown', function (e) {
    if (!$('play').classList.contains('on') || !S || !S.running) return;
    if (e.key === ' ' || e.key === 'Enter') { if (skipReveal()) e.preventDefault(); return; }
    var i = ['1', '2', '3', '4'].indexOf(e.key);
    if (i >= 0) {
      var btn = document.querySelectorAll('.opt')[i];
      if (btn) answer(Number(btn.dataset.val), btn);
    }
  });

  function sparkle(btn) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var r = btn.getBoundingClientRect();
    var icons = ['✨', '⭐️', '🌟', '💫'];
    for (var i = 0; i < 5; i++) {
      var s = document.createElement('span');
      s.className = 'spark';
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + 'px';
      s.style.top = (r.top + r.height * 0.4) + 'px';
      s.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px');
      s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      $('fx').appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 950); })(s);
    }
  }

  function endGame(completed) {
    if (!S || !S.running) return;
    S.running = false;
    lock = true;
    clearReveal();
    hushSpeech();
    clearInterval(timer); timer = null;
    SFX.end();
    S.ms = S.startedAt ? Math.max(0, (S.finishedAt || Date.now()) - S.startedAt) : 0;

    // 中途按結束的不記錄，免得半途而廢的分數污染歷史成績
    var isRecord = false;
    if (completed && !S.reviewMode) {
      db.runs.push({
        t: Date.now(), tables: S.tables, correct: S.correct,
        wrong: S.wrong, total: S.total, ms: S.ms
      });
      if (db.runs.length > 60) db.runs = db.runs.slice(-60);
      var b = db.best[S.total];
      // 同樣答對題數時，比誰花的時間短
      if (!b || S.correct > b.correct || (S.correct === b.correct && S.ms < b.ms)) {
        isRecord = !!b;
        db.best[S.total] = { correct: S.correct, ms: S.ms, total: S.total };
      }
      save();
    }
    renderResult(isRecord, completed);
    show('result');
  }

  $('quitBtn').addEventListener('click', function () { endGame(false); });

  /* ────────── 結果畫面 ────────── */
  function renderResult(isRecord, completed) {
    var done = S.correct + S.wrong;
    var acc = done ? Math.round(S.correct / done * 100) : 0;
    $('rScore').innerHTML = S.correct + '<small>/ ' + S.total + '</small>';
    $('rAcc').textContent = acc + '%';
    $('rWrong').textContent = S.wrong;
    $('rTime').textContent = fmtTime(S.ms);

    var msg;
    if (done === 0) msg = '這次沒有作答，再來一次！';
    else if (!completed) msg = '這輪提早結束了，只做了 ' + done + ' 題';
    else if (acc === 100) msg = '太厲害了，全部答對！🏆';
    else if (acc >= 80) msg = '好棒！只差一點點 🎉';
    else if (acc >= 60) msg = '不錯喔，再加油 💪';
    else msg = '有進步空間，我們一起複習 📚';
    $('rMsg').textContent = msg;
    var best = db.best[S.total];
    $('rRec').innerHTML = isRecord && best
      ? '<span class="rec">🏅 破紀錄！' + best.correct + ' / ' + best.total +
        ' 題・' + fmtTime(best.ms) + '</span>'
      : '';

    var box = $('rWrongs');
    box.innerHTML = '';
    if (!S.wrongList.length) {
      box.innerHTML = '<div class="empty">' + (done ? '這一輪沒有答錯，太棒了！🎊' : '還沒有作答紀錄') + '</div>';
    } else {
      S.wrongList.forEach(function (q) {
        var el = document.createElement('span');
        el.className = 'wchip';
        el.innerHTML = q.a + ' × ' + q.b + ' = ' + (q.a * q.b);
        box.appendChild(el);
      });
    }
    $('againWrongBtn').hidden = S.wrongList.length === 0;
    db.lastWrong = S.wrongList.slice();
    save();
  }

  $('againBtn').addEventListener('click', function () { startGame(S.tables); });
  $('againWrongBtn').addEventListener('click', function () {
    startGame(S.tables, { pool: S.wrongList.slice() });
  });
  $('backBtn').addEventListener('click', function () {
    if (picked.length) db.tables = picked.slice();
    save();
    $('subtitle').textContent = '每題 30 秒 ・ ' + db.count + ' 題';
    refreshSetup(); show('setup');
  });

  /* ────────── 歷史畫面 ────────── */
  function renderHistory() {
    var runs = db.runs.slice(-12);
    var chart = $('chart');
    chart.innerHTML = '';
    if (!runs.length) {
      chart.innerHTML = '<div class="empty" style="margin:auto">還沒有練習紀錄，先玩一輪吧！</div>';
    } else {
      runs.forEach(function (r) {
        var d = new Date(r.t);
        var tot = r.total || 10;
        var col = document.createElement('div');
        col.className = 'col';
        col.title = r.correct + ' / ' + tot + ' 題・' + fmtTime(r.ms || 0);
        // 長度不同的回合用「答對比例」比高矮，才不會 20 題那輪看起來永遠比較好
        col.innerHTML = '<u>' + r.correct + '</u>' +
          '<b style="height:' + Math.max(4, r.correct / tot * 74) + 'px"></b>' +
          '<em>' + (d.getMonth() + 1) + '/' + d.getDate() + '</em>';
        chart.appendChild(col);
      });
    }
    var all = db.runs;
    var best = db.best[db.count];
    $('hBest').innerHTML = best
      ? best.correct + '<small> / ' + best.total + '</small>'
      : '—';
    $('hBest').nextElementSibling.textContent = best
      ? db.count + ' 題最佳 ・ ' + fmtTime(best.ms)
      : db.count + ' 題最佳';
    var got = all.reduce(function (s, r) { return s + r.correct; }, 0);
    var asked = all.reduce(function (s, r) { return s + (r.total || 10); }, 0);
    $('hAvg').textContent = asked ? Math.round(got / asked * 100) + '%' : '—';
    $('hRuns').textContent = all.length;

    renderDays();
    renderTables();

    var list = [];
    Object.keys(db.perQ).forEach(function (k) {
      var s = db.perQ[k];
      if (s.w > 0) list.push({ k: k, n: s.n, w: s.w, r: s.w / s.n });
    });
    list.sort(function (x, y) { return (y.r - x.r) || (y.w - x.w); });
    var weak = $('weak');
    weak.innerHTML = '';
    if (!list.length) {
      weak.innerHTML = '<div class="empty">目前沒有常錯的題目，很棒！👍</div>';
    } else {
      list.slice(0, 6).forEach(function (x) {
        var p = x.k.split('x');
        var row = document.createElement('div');
        row.className = 'wrow';
        row.innerHTML =
          '<span class="q">' + p[0] + ' × ' + p[1] + ' = ' + (p[0] * p[1]) + '</span>' +
          '<span class="t"><i style="width:' + Math.round(x.r * 100) + '%"></i></span>' +
          '<span class="p">錯 ' + x.w + ' 次<small>考過 ' + x.n + ' 次</small></span>';
        weak.appendChild(row);
      });
    }
  }

  // 每一段的答對率，從最熟排到最不熟
  function renderTables() {
    var box = $('tables');
    box.innerHTML = '';
    var agg = {};
    Object.keys(db.perQ).forEach(function (k) {
      var t = Number(k.split('x')[0]), s = db.perQ[k];
      var a = agg[t] || (agg[t] = { n: 0, w: 0 });
      a.n += s.n; a.w += s.w;
    });
    var list = Object.keys(agg).map(function (t) {
      var a = agg[t];
      return { t: Number(t), n: a.n, ok: a.n - a.w, rate: (a.n - a.w) / a.n };
    });
    if (!list.length) {
      box.innerHTML = '<div class="empty">還沒有練習紀錄</div>';
      return;
    }
    // 題數太少的排到後面，免得「練 1 題全對」看起來比「練 40 題錯 2 題」還熟
    list.sort(function (x, y) {
      if ((x.n < 5) !== (y.n < 5)) return x.n < 5 ? 1 : -1;
      return y.rate - x.rate;
    });
    list.forEach(function (x) {
      var pct = Math.round(x.rate * 100);
      var thin = x.n < 5;
      var level = thin ? 'thin' : (pct >= 90 ? 'hi' : (pct >= 70 ? 'mid' : ''));
      var row = document.createElement('div');
      row.className = 'wrow';
      row.innerHTML =
        '<span class="q">' + x.t + ' 段' + (!thin && pct >= 90 ? ' 🏆' : '') + '</span>' +
        '<span class="t"><i class="' + level + '" style="width:' + pct + '%"></i></span>' +
        '<span class="p ' + level + '">' + pct + '%<small style="font-weight:700;opacity:.7"> ' +
        x.ok + '/' + x.n + '</small></span>';
      box.appendChild(row);
    });
    var solid = list.filter(function (x) { return x.n >= 5; });
    if (solid.length >= 2) {
      var best = solid[0], worst = solid[solid.length - 1];
      var p = document.createElement('p');
      p.className = 'hint';
      p.textContent = best.t + ' 段最熟（' + Math.round(best.rate * 100) + '%），' +
        worst.t + ' 段最需要練（' + Math.round(worst.rate * 100) + '%）。';
      box.appendChild(p);
    }
    if (list.some(function (x) { return x.n < 5; })) {
      var q = document.createElement('p');
      q.className = 'hint';
      q.textContent = '灰色的那幾段練不到 5 題，資料還不夠準。';
      box.appendChild(q);
    }
  }

  // 每天練了幾次、分別是幾點練的
  function renderDays() {
    var box = $('days');
    box.innerHTML = '';
    if (!db.runs.length) {
      box.innerHTML = '<div class="empty">還沒有練習紀錄</div>';
      return;
    }
    var order = [], byDay = {};
    db.runs.forEach(function (r) {
      var k = dayKey(r.t);
      if (!byDay[k]) { byDay[k] = []; order.push(k); }
      byDay[k].push(r);
    });
    var today = dayKey(Date.now());
    var yesterday = dayKey(Date.now() - 86400000);
    order.slice(-7).reverse().forEach(function (k) {
      var runs = byDay[k];
      var d = new Date(runs[0].t);
      var label = (d.getMonth() + 1) + '/' + d.getDate();
      var tag = k === today ? '今天' : (k === yesterday ? '昨天' : '');
      var row = document.createElement('div');
      row.className = 'dayrow';
      var sess = runs.map(function (r) {
        var tot = r.total || 10;
        var tb = Array.isArray(r.tables) && r.tables.length ? tableLabel(r.tables) + ' 段' : '';
        return '<span class="sess' + (r.correct < tot ? ' miss' : '') + '">' +
          clockOf(r.t) + (tb ? '<u>' + tb + '</u>' : '') +
          '<b>' + r.correct + '/' + tot + '</b></span>';
      }).join('');
      row.innerHTML =
        '<span class="d">' + label + (tag ? '<em>' + tag + '</em>' : '') + '</span>' +
        '<span class="c">' + runs.length + ' 次</span>' +
        '<span class="ts">' + sess + '</span>';
      box.appendChild(row);
    });
  }

  $('histBtn').addEventListener('click', function () {
    if ($('play').classList.contains('on')) return;
    renderHistory(); show('history');
  });
  $('hBackBtn').addEventListener('click', function () { refreshSetup(); show('setup'); });
  $('clearBtn').addEventListener('click', function () {
    if (!confirm('確定要清除所有練習紀錄嗎？這個動作無法復原。')) return;
    var keep = { sound: db.sound, tables: db.tables.slice(), mode: db.mode, count: db.count };
    db = Object.assign(blank(), keep);
    save(); renderHistory(); buildTiles(); syncStart();
  });

  /* ────────── 音效開關 ────────── */
  function syncSound() {
    var b = $('soundBtn');
    b.textContent = db.sound ? '🔊' : '🔇';
    b.classList.toggle('off', !db.sound);
    b.setAttribute('aria-pressed', db.sound ? 'true' : 'false');
  }
  $('soundBtn').addEventListener('click', function () {
    db.sound = !db.sound; save(); syncSound();
    if (db.sound) { initAudio(); SFX.right(); }   // 開啟時放一聲，順便當音量試聽
  });

  function syncSpeak() {
    var b = $('speakBtn');
    b.hidden = !(canSpeak && zhVoice);
    b.textContent = db.speak ? '🗣️' : '🤫';
    b.classList.toggle('off', !db.speak);
    b.setAttribute('aria-pressed', db.speak ? 'true' : 'false');
  }
  $('speakBtn').addEventListener('click', function () {
    db.speak = !db.speak; save(); syncSpeak();
    if (db.speak) say('九八七十二');
    else hushSpeech();
  });

  /* ────────── 啟動 ────────── */
  document.documentElement.lang = 'zh-Hant';
  document.documentElement.style.setProperty('--reveal', (REVEAL_MS / 1000) + 's');

  function refreshSetup() {
    buildTiles(); syncStart();
    $('reviewBtn').hidden = !(db.lastWrong && db.lastWrong.length);
  }

  $('startBtn').addEventListener('click', function () {
    if (db.sound) initAudio();   // 趁著這個手勢把音訊解鎖
    unlockSpeech();              // 語音也一樣，只有真的手勢裡才解得開
    if (!picked.length) return;
    if (picked.length) db.tables = picked.slice();
    save();
    startGame(picked);
  });
  $('reviewBtn').addEventListener('click', function () {
    startGame(picked.length ? picked : db.tables, { pool: db.lastWrong.slice() });
  });

  load();
  picked = [];   // 每次打開都從空白開始，讓他自己決定今天要練哪幾段
  $('subtitle').textContent = '每題 30 秒 ・ ' + db.count + ' 題';
  document.querySelectorAll('#modes .mode').forEach(function (m) {
    m.classList.toggle('sel', m.dataset.mode === db.mode);
  });
  document.querySelectorAll('#counts .mode').forEach(function (m) {
    m.classList.toggle('sel', Number(m.dataset.count) === db.count);
  });
  syncSound();

  var speechUnlocked = false;
  function unlockSpeech() {
    if (speechUnlocked || !canSpeak || !db.speak) return;
    speechUnlocked = true;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  pickVoice();
  if (canSpeak && typeof window.speechSynthesis.addEventListener === 'function') {
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  refreshSetup();
})();
</script>
</body>
