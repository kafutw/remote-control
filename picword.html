<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>看圖說單字</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F9FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="看圖說單字">
<link rel="apple-touch-icon" sizes="180x180" href="picword-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="picword-icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="picword-icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* 看圖說單字：115 上每週英語單字表（44 字、9 週）。
     老師的考法是「看圖 → 唸出英文」，所以考的時候畫面上只有圖，不給字、不給中文。
     配色沿用 ABC 字母大考驗的家族色，主色換成英文科的藍，孩子一眼分得出是哪一支。 */
  :root {
    --bg: #F5F9FD;
    --bg-2: #E6F0FA;
    --surface: #FFFFFF;
    --track: #DCE8F4;
    --ink: #2E3A46;
    --ink-soft: #66788A;
    --ink-faint: #A7B6C4;
    --line: #DAE5F0;
    --key: #3E86C9;
    --key-deep: #2A6AA6;
    --key-soft: #E3EFFA;
    --mint: #2FB48C;
    --mint-ink: #178A69;
    --mint-soft: #DFF5EE;
    --coral: #EE6B57;
    --coral-ink: #C94A36;
    --coral-soft: #FDE8E4;
    --amber: #E3A21A;
    --amber-soft: #FFF3D9;
    --stamp: #3553A8;
    --zoo: #E3F1DA; --zoo-ink: #4E8A3A;
    --shop: #F8E7EE; --shop-ink: #B5577A;
    --road: #EADBBC; --road-dash: #C4A36A;
    --ring: rgba(255,255,255,.8);
    --heart: #F0607A; --heart-off: rgba(46,58,70,.14);
    --shadow: 0 1px 2px rgba(40,90,140,.06), 0 8px 22px rgba(40,90,140,.10);
    --radius: 22px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    /* 英文字用單層 a 的字體，跟學校單字表印的字形一樣 */
    --en: "Andika", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif;
    --fs-title: 1.5rem;
    --fs-head: 1.2rem;
    --fs-body: .95rem;
    --fs-note: .78rem;
    --fs-word: clamp(2.6rem, 11vw, 4rem);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #172029; --bg-2: #1F2B36; --surface: #23303C; --track: #1B2631;
      --ink: #E8F0F7; --ink-soft: #A6B7C7; --ink-faint: #6D8194; --line: #34455A;
      --key: #7CB8F0; --key-deep: #A5D0F7; --key-soft: rgba(124,184,240,.16);
      --mint: #52D1AA; --mint-ink: #86E3C6; --mint-soft: rgba(82,209,170,.15);
      --coral: #FF8A77; --coral-ink: #FFA797; --coral-soft: rgba(255,138,119,.15);
      --amber: #FFC45E; --amber-soft: rgba(255,196,94,.15);
      --stamp: #93A9F0;
      --zoo: #1F3024; --zoo-ink: #8FD08A; --shop: #33232B; --shop-ink: #F0A3C0;
      --road: #4B4232; --road-dash: #8C7A55; --ring: rgba(255,255,255,.14);
      --heart: #FF7C93; --heart-off: rgba(255,255,255,.16);
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #172029; --bg-2: #1F2B36; --surface: #23303C; --track: #1B2631;
    --ink: #E8F0F7; --ink-soft: #A6B7C7; --ink-faint: #6D8194; --line: #34455A;
    --key: #7CB8F0; --key-deep: #A5D0F7; --key-soft: rgba(124,184,240,.16);
    --mint: #52D1AA; --mint-ink: #86E3C6; --mint-soft: rgba(82,209,170,.15);
    --coral: #FF8A77; --coral-ink: #FFA797; --coral-soft: rgba(255,138,119,.15);
    --amber: #FFC45E; --amber-soft: rgba(255,196,94,.15);
    --stamp: #93A9F0;
    --zoo: #1F3024; --zoo-ink: #8FD08A; --shop: #33232B; --shop-ink: #F0A3C0;
    --road: #4B4232; --road-dash: #8C7A55; --ring: rgba(255,255,255,.14);
    --heart: #FF7C93; --heart-off: rgba(255,255,255,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: var(--fs-body); line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
  .en { font-family: var(--en); }

  .app { margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; }
  #learn, #play { max-width: 1100px; margin: 0 auto; }
  #result { max-width: 760px; margin: 0 auto; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.on { display: flex; }

  /* ---------- 共用按鈕 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 20px; border-radius: 16px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: var(--fs-head); font-weight: 700;
  }
  .btn.primary { background: var(--key); border-color: var(--key); color: var(--surface); }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 40px; font-size: var(--fs-body); padding: 0 14px; border-radius: 12px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ok { background: var(--mint-soft); border-color: var(--mint); color: var(--mint-ink); }
  .btn.no { background: var(--coral-soft); border-color: var(--coral); color: var(--coral-ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 0; }

  /* ---------- 首頁：冒險地圖 ----------
     9 週是一條路：前 6 週在動物森林、後 3 週在衣服店（單字表本來就是動物→衣服）。
     橫放（.wide）地圖填滿、面板浮在右下；直放（.tall）路線由下往上，面板接在地圖下面。 */
  #home { height: calc(100vh - 48px); height: calc(100dvh - 48px); min-height: 560px; gap: 12px; position: relative; }
  .map {
    position: relative; flex: 1 1 auto; min-height: 300px; border-radius: 26px; overflow: hidden;
    background: linear-gradient(100deg, var(--zoo) 0 57%, var(--shop) 57% 100%);
  }
  #home.tall .map { background: linear-gradient(180deg, var(--shop) 0 36%, var(--zoo) 36% 100%); }
  .road { position: absolute; inset: 0; width: 100%; height: 100%; }
  .road .base { stroke: var(--road); stroke-width: 30; }
  .road .dash { stroke: var(--road-dash); stroke-width: 3; stroke-dasharray: 9 9; }
  .map-top { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-chip { background: var(--surface); padding: 8px 18px; border-radius: 18px; box-shadow: var(--shadow); }
  .title-chip h1 { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.6rem); line-height: 1.25; letter-spacing: .06em; }
  .title-chip .sub { margin: 0; color: var(--ink-soft); font-size: var(--fs-note); letter-spacing: .04em; }
  .zone {
    position: absolute; z-index: 1; font-size: var(--fs-note); font-weight: 800; letter-spacing: .08em;
    padding: 3px 12px; border-radius: 99px; background: var(--surface); opacity: .88;
  }
  .zone.a { color: var(--zoo-ink); }
  .zone.b { color: var(--shop-ink); }

  .stop {
    --s: clamp(58px, 10.5vmin, 104px);
    position: absolute; z-index: 2; width: var(--s); height: var(--s); transform: translate(-50%, -50%);
    border: none; border-radius: 50%; padding: 6px;
    background: conic-gradient(var(--mint) calc(var(--p) * 1%), var(--ring) 0);
    box-shadow: 0 4px 12px rgba(0,0,0,.14);
  }
  .stop .in {
    width: 100%; height: 100%; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; font-size: calc(var(--s) * .48); line-height: 1;
  }
  .stop .in svg { width: .95em; height: .95em; }
  .stop.new:not(.sel) .in > span { filter: grayscale(1); opacity: .5; }
  .stop .no {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 800; padding: 1px 9px; border-radius: 99px;
  }
  .stop .flag {
    position: absolute; top: -8px; right: -16px; background: var(--mint-ink); color: var(--surface);
    font: 800 .9rem var(--en); padding: 2px 9px; border-radius: 7px 7px 7px 0; transform: rotate(8deg);
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  /* OK＝這週每個字都有兩顆心以上（App 裡學會了）；章＝老師已經考過蓋章 */
  .stop .seal {
    position: absolute; top: -6px; left: -10px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; background: var(--surface); color: var(--stamp);
    border: 2px dashed var(--stamp); font-size: .78rem; font-weight: 900; transform: rotate(-12deg);
  }
  .stop.sel { --s: clamp(78px, 14.5vmin, 138px); z-index: 4; box-shadow: 0 0 0 6px var(--key), 0 0 0 16px var(--key-soft), 0 8px 18px rgba(0,0,0,.2); }
  .kid {
    position: absolute; left: 50%; bottom: 86%; font-size: calc(var(--s) * .46); line-height: 1;
    transform: translateX(-50%); animation: hop .5s ease-out; pointer-events: none;
  }
  @keyframes hop {
    0% { transform: translate(-50%, 50%) scale(.5); opacity: 0; }
    60% { transform: translate(-50%, -22%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%, 0); }
  }

  .panel { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  #home.wide .panel { position: absolute; right: 14px; bottom: 14px; z-index: 5; width: min(440px, 40%); }
  .p-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .p-h b { font-size: 1.5rem; }
  .okchip { font: 800 var(--fs-note) var(--en); color: var(--stamp); border: 2px dashed var(--stamp); border-radius: 99px; padding: 0 10px; }
  .known { margin-left: auto; font-size: var(--fs-note); font-weight: 800; color: var(--ink-soft); }
  /* 每個字：圖、英文、三顆心。心＝這個字多熟（0–3），不是獎勵星星 */
  .p-e { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; border-radius: 16px; padding: 8px 6px; background: var(--zoo); }
  .p-e.shop { background: var(--shop); }
  .pw { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .pw .em { font-size: clamp(2rem, 4.2vw, 2.9rem); line-height: 1.15; }
  .pw .em svg { width: 1em; height: 1em; display: block; }
  .pw .w { font-family: var(--en); font-weight: 700; font-size: .9rem; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hearts { display: inline-flex; gap: 1px; }
  .hearts svg { width: 17px; height: 17px; display: block; fill: var(--heart-off); }
  .hearts svg.on { fill: var(--heart); }
  .p-legend { margin: 0; text-align: center; font-size: var(--fs-note); color: var(--ink-soft); }
  .p-legend svg { width: 12px; height: 12px; fill: var(--heart); vertical-align: -1px; }
  .p-act { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
  .p-act .btn { min-height: 60px; font-size: 1.2rem; }
  .notice {
    margin: 0; padding: 8px 12px; border-radius: 12px;
    background: var(--amber-soft); color: var(--ink); font-size: var(--fs-note);
  }
  .notice b { color: var(--amber); }

  /* ---------- 題目畫面 ---------- */
  .bar { display: flex; align-items: center; gap: 12px; }
  .prog { flex: 1; height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--key); border-radius: 99px; transition: width .3s; }
  .count { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; min-width: 4.5em; text-align: right; }

  .card {
    position: relative; align-self: center; width: min(100%, 52vh, 520px); aspect-ratio: 1; max-width: 100%;
    container-type: inline-size;
    border-radius: 28px; background: var(--surface); box-shadow: var(--shadow);
    display: grid; place-items: center; overflow: hidden;
  }
  .card.ok { box-shadow: 0 0 0 5px var(--mint), var(--shadow); }
  .card.bad { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .again-tag {
    position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 99px;
    background: var(--amber-soft); color: var(--amber); font-size: var(--fs-note); font-weight: 700;
  }
  /* 圖跟著卡片大小走（cqw＝卡片寬度的 1%） */
  .pic { font-size: 58cqw; line-height: 1; user-select: none; }
  .pic.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw 6cqw; font-size: 30cqw; }
  .pic.trio { display: flex; gap: 1cqw; font-size: 29cqw; }
  .pic.trio span:nth-child(2) { transform: translateY(-18%) scale(.9); }
  .pic svg { width: 70cqw; height: auto; display: block; }
  .house { position: relative; width: 78cqw; aspect-ratio: 1; }
  .house svg { width: 100%; height: 100%; }
  .house .in { position: absolute; left: 0; right: 0; bottom: 14%; display: flex; justify-content: center; gap: 1cqw; font-size: 23cqw; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 820px) and (orientation: landscape) {
    #learn.on, #play.on {
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
      column-gap: 36px; row-gap: 16px; min-height: calc(100vh - 48px); min-height: calc(100dvh - 48px);
    }
    #learn .bar, #play .bar { grid-column: 1 / -1; }
    #learn .card, #play .card { width: min(100%, calc(100vh - 150px)); width: min(100%, calc(100dvh - 150px)); justify-self: center; }
    .side { justify-content: center; }
  }

  /* 每題倒數：條會縮短，剩三分之一變橘 */
  .tbar { display: flex; align-items: center; gap: 10px; align-self: stretch; }
  .ttrack { flex: 1; height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .ttrack i { display: block; height: 100%; width: 100%; background: var(--mint); border-radius: 99px; transition: width .2s linear; }
  .tbar.low .ttrack i { background: var(--amber); }
  .tbar span { min-width: 3.4em; text-align: right; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tbar.low span { color: var(--amber); }

  /* 答對的獎勵：星星從圖上噴出來、圖彈一下、上面的星星數跳一下 */
  .spark {
    position: absolute; left: 50%; top: 50%; font-size: 9cqw; line-height: 1; pointer-events: none;
    transform: translate(-50%, -50%) scale(.3); animation: spark 1s ease-out forwards;
  }
  @keyframes spark {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15); opacity: 0; }
  }
  .card.ok .pic, .card.ok .house { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .stars-n {
    font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 2px 12px; border-radius: 99px; background: var(--amber-soft); color: var(--ink);
  }
  .stars-n.pop { animation: pop .5s ease-out; }
  .fb.ok { font-size: 1.45rem; }
  .fb .combo { display: inline-block; margin-top: 4px; font-size: var(--fs-body); color: var(--coral-ink); }
  .title-chip .total { font-weight: 800; color: var(--amber); margin-left: 6px; font-size: .95rem; letter-spacing: 0; }
  .earn { display: inline-block; margin-top: 6px; padding: 2px 14px; border-radius: 99px; background: var(--amber-soft); }

  .word { text-align: center; font-family: var(--en); font-weight: 700; font-size: var(--fs-word); line-height: 1.1; margin: 0; letter-spacing: .02em; }
  .zh { text-align: center; margin: 0; color: var(--ink-soft); font-size: var(--fs-head); }
  .hint {
    align-self: center; text-align: center; padding: 10px 18px; border-radius: 16px;
    background: var(--amber-soft); display: flex; flex-direction: column; gap: 2px;
  }
  .hint .pat { font-family: var(--en); font-size: 2rem; letter-spacing: .18em; font-weight: 700; }
  .hint .z { color: var(--ink-soft); }

  .fb { min-height: 2.9em; text-align: center; margin: 0; font-size: var(--fs-head); font-weight: 700; text-wrap: balance; }
  .fb.ok { color: var(--mint-ink); }
  .fb.bad { color: var(--coral-ink); }
  .fb.info { color: var(--ink-soft); font-weight: 600; }
  .fb .heard { font-family: var(--en); color: var(--ink); background: var(--track); padding: 0 8px; border-radius: 8px; }

  .mic {
    align-self: center; width: 128px; height: 128px; border-radius: 50%;
    border: none; background: var(--key); color: var(--surface);
    display: grid; place-items: center; box-shadow: 0 8px 20px rgba(40,100,170,.28);
    position: relative;
  }
  .mic svg { width: 54px; height: 54px; }
  .mic .lbl { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--ink-soft); font-size: var(--fs-body); font-weight: 700; }
  .mic.live { background: var(--coral); box-shadow: 0 0 0 0 var(--coral); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(238,107,87,.55); } 100% { box-shadow: 0 0 0 26px rgba(238,107,87,0); } }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; padding-block: 4px 34px; }
  .tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .parent {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 10px 12px; border-radius: 16px; border: 2px dashed var(--line);
  }
  .parent .lab { color: var(--ink-soft); font-size: var(--fs-note); font-weight: 700; letter-spacing: .04em; }
  .parent.big .btn { min-height: 64px; min-width: 150px; font-size: 1.3rem; }

  /* ---------- 結算 ---------- */
  .medal { font-size: 72px; text-align: center; line-height: 1; }
  #rScore { text-align: center; font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #rScore small { font-size: 1.6rem; color: var(--ink-soft); font-weight: 700; }
  .rmsg { text-align: center; margin: 0; font-size: var(--fs-head); font-weight: 700; }
  .rlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .ri { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); }
  .ri .p { font-size: 1.9rem; line-height: 1; width: 2.2rem; text-align: center; }
  .ri .p svg { width: 2rem; height: 2rem; }
  .ri .w { font-family: var(--en); font-weight: 700; font-size: 1.15rem; display: flex; flex-direction: column; gap: 2px; line-height: 1.1; }
  .ri .t { margin-left: auto; font-size: var(--fs-note); font-weight: 700; }
  .ri.first .t { color: var(--mint-ink); }
  .ri.help .t, .ri.cue .t { color: var(--amber); }
  .ri.miss .t { color: var(--coral-ink); }
  .rh { margin: 6px 0 0; font-size: var(--fs-note); color: var(--ink-soft); letter-spacing: .06em; font-weight: 700; }

  /* ---------- 設定 ---------- */
  /* 設定面板要蓋過地圖上的站點（z 2–4）和週次面板（z 5） */
  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(10,20,30,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 88vh; overflow: auto;
    background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .25s;
  }
  .sheet > div { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  body.sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
  body.sheet-open .sheet { transform: translateY(0); }
  .sheet h2 { margin: 0; font-size: var(--fs-head); }
  .sheet h3 { margin: 6px 0 0; font-size: var(--fs-body); color: var(--ink-soft); letter-spacing: .04em; }
  .seg { display: flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .seg button { flex: 1; min-height: 46px; border: none; background: transparent; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--key); color: var(--surface); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-width: 48px; min-height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
  .chip[aria-pressed="true"] { border-color: var(--stamp); color: var(--stamp); background: var(--key-soft); }
  select, input[type=range] { width: 100%; }
  select { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; font: inherit; }
  .hintline { margin: 0; color: var(--ink-soft); font-size: var(--fs-note); }
  .heardlog { max-height: 180px; overflow: auto; border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: var(--fs-note); }
  .heardlog div { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .heardlog div:last-child { border-bottom: none; }
  .heardlog b { font-family: var(--en); min-width: 5.5em; }
  .heardlog span { font-family: var(--en); color: var(--ink-soft); flex: 1; }
  .heardlog i { font-style: normal; font-weight: 800; }
  .heardlog .y { color: var(--mint-ink); } .heardlog .n { color: var(--coral-ink); }

  @media (prefers-reduced-motion: reduce) {

</div>

<script>
(function () {
  'use strict';

  /* ---------- 單字表：照學校發的紙本，週次／英文／中文 ---------- */
  var RAW = [
    [1,'animal','動物'],[1,'bear','熊'],[1,'bee','蜜蜂'],[1,'bird','鳥'],[1,'butterfly','蝴蝶'],
    [2,'cat','貓'],[2,'chicken','雞'],[2,'cow','乳牛'],[2,'dog','狗'],[2,'duck','鴨子'],
    [3,'elephant','大象'],[3,'fish','魚'],[3,'frog','青蛙'],[3,'hippo','河馬'],[3,'horse','馬'],
    [4,'koala','無尾熊'],[4,'lion','獅子'],[4,'mouse','老鼠'],[4,'mice','老鼠（很多隻）'],[4,'monkey','猴子'],
    [5,'panda','大熊貓'],[5,'pet','寵物'],[5,'pig','豬'],[5,'rabbit','兔子'],[5,'sheep','綿羊'],
    [6,'goat','山羊'],[6,'snake','蛇'],[6,'spider','蜘蛛'],[6,'tiger','老虎'],[6,'turtle','烏龜'],
    [7,'whale','鯨魚'],[7,'zebra','斑馬'],[7,'bag','袋子'],[7,'cap','棒球帽'],[7,'clothes','衣服'],
    [8,'coat','外套／大衣'],[8,'jacket','外套／夾克'],[8,'dress','洋裝'],[8,'glasses','眼鏡'],[8,'hat','帽子'],
    [9,'pants','長褲'],[9,'pocket','口袋'],[9,'shirt','襯衫'],[9,'T-shirt','T 恤']
  ];
  var WORDS = RAW.map(function (r) { return { wk: r[0], en: r[1], zh: r[2] }; });
  var BY = {}; WORDS.forEach(function (w) { BY[w.en] = w; });
  var ANIMALS = WORDS.filter(function (w) { return w.wk <= 7 && ['animal','pet','bag','cap','clothes'].indexOf(w.en) < 0; })
                     .map(function (w) { return w.en; });

  /* ---------- 圖 ----------
     大部分用 iPad 內建的 emoji。容易跟別的字撞在一起的另外處理：
     mouse 一隻／mice 三隻；coat 用長大衣、jacket 自己畫短拉鍊款；
     pocket 沒有 emoji，畫一個圈起來的口袋；animal、clothes、pet 用一組圖合起來表示。 */
  var SVG_JACKET =
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
    '<path d="M50 62 L24 142 L44 149 L64 98 Z" fill="#3F7CC0"/>' +
    '<path d="M150 62 L176 142 L156 149 L136 98 Z" fill="#3F7CC0"/>' +
    '<path d="M72 44 L128 44 L150 62 L150 160 L50 160 L50 62 Z" fill="#4F92DA"/>' +
    '<rect x="50" y="150" width="100" height="14" rx="3" fill="#2F639D"/>' +
    '<path d="M74 44 Q100 76 126 44 L118 36 Q100 58 82 36 Z" fill="#2F639D"/>' +
    '<line x1="100" y1="60" x2="100" y2="160" stroke="#E7EEF6" stroke-width="3"/>' +
    '<rect x="96" y="68" width="8" height="14" rx="2" fill="#E7EEF6"/>' +
    '<path d="M64 112 L76 138" stroke="#2F639D" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M136 112 L124 138" stroke="#2F639D" stroke-width="4" stroke-linecap="round"/>' +
    '<rect x="21" y="138" width="24" height="12" rx="3" transform="rotate(18 33 144)" fill="#2F639D"/>' +
    '<rect x="155" y="138" width="24" height="12" rx="3" transform="rotate(-18 167 144)" fill="#2F639D"/>' +
    '</svg>';
  var SVG_POCKET =
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
    '<rect x="14" y="14" width="172" height="172" rx="18" fill="#5C88BC"/>' +
    '<rect x="22" y="22" width="156" height="156" rx="13" fill="none" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6 5"/>' +
    '<circle cx="124" cy="62" r="17" fill="#F4C542"/><circle cx="124" cy="62" r="10" fill="none" stroke="#D9A21C" stroke-width="3"/>' +
    '<path d="M56 66 L144 66 L144 128 L100 152 L56 128 Z" fill="#4A74A6"/>' +
    '<path d="M62 72 L138 72 L138 124 L100 145 L62 124 Z" fill="none" stroke="#F2C14E" stroke-width="2.5" stroke-dasharray="6 5"/>' +
    '<ellipse cx="100" cy="108" rx="66" ry="60" fill="none" stroke="#EE6B57" stroke-width="5" stroke-dasharray="14 9"/>' +
    '</svg>';
  var SVG_HOUSE =
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
    '<path d="M100 22 L182 92 L164 92 L164 180 L36 180 L36 92 L18 92 Z" fill="#FBE3C6" stroke="#D9894A" stroke-width="7" stroke-linejoin="round"/>' +
    '<circle cx="100" cy="72" r="11" fill="#EE6B57"/>' +
    '</svg>';

  var PIC = {
    animal: { grid: ['🐶','🐱','🐰','🐤'] }, bear: '🐻', bee: '🐝', bird: '🐦', butterfly: '🦋',
    cat: '🐱', chicken: '🐔', cow: '🐄', dog: '🐶', duck: '🦆',
    elephant: '🐘', fish: '🐟', frog: '🐸', hippo: '🦛', horse: '🐴',
    koala: '🐨', lion: '🦁', mouse: '🐭', mice: { trio: ['🐭','🐭','🐭'] }, monkey: '🐵',
    panda: '🐼', pet: { house: ['🐶','🐱'] }, pig: '🐷', rabbit: '🐰', sheep: '🐑',
    goat: '🐐', snake: '🐍', spider: '🕷️', tiger: '🐯', turtle: '🐢',
    whale: '🐳', zebra: '🦓', bag: '👜', cap: '🧢', clothes: { grid: ['👕','👖','👗','🧦'] },
    coat: '🧥', jacket: { svg: SVG_JACKET }, dress: '👗', glasses: '👓', hat: '👒',
    pants: '👖', pocket: { svg: SVG_POCKET }, shirt: '👔', 'T-shirt': '👕'
  };
  function span(s) { return '<span>' + s + '</span>'; }
  function picBig(en) {
    var p = PIC[en];
    if (typeof p === 'string') return '<div class="pic">' + p + '</div>';
    if (p.grid) return '<div class="pic grid">' + p.grid.map(span).join('') + '</div>';
    if (p.trio) return '<div class="pic trio">' + p.trio.map(span).join('') + '</div>';
    if (p.house) return '<div class="house">' + SVG_HOUSE + '<div class="in">' + p.house.map(span).join('') + '</div></div>';
    return '<div class="pic">' + p.svg + '</div>';
  }
  function picMini(en) {
    var p = PIC[en];
    if (typeof p === 'string') return p;
    if (p.grid) return p.grid[0];
    if (p.trio) return '🐭';
    if (p.house) return '🏠';
    return p.svg;
  }

  /* ---------- 存檔（只存在這台裝置） ---------- */
  var KEY = 'kafu-picword-v1';
  var db = { sel: null, judge: 'auto', rate: 0.8, voiceURI: '', stamps: [1, 2], m: {} };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) for (var k in saved) db[k] = saved[k]; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  if (!db.sel) {
    var firstOpen = 1;
    for (var wk = 1; wk <= 9; wk++) if (db.stamps.indexOf(wk) < 0) { firstOpen = wk; break; }
    db.sel = [firstOpen];
  }
  function lv(en) { var r = db.m[en]; return r ? r.lv : -1; }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- 麥克風能不能用 ----------
     Safari（iPad／iPhone）與 Chrome 有內建語音辨識。
     被別的網站用 iframe 包起來（例如預覽頁）時瀏覽器不給麥克風，一律改成爸媽判定。 */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var crossFrame = false;
  try { crossFrame = window.top !== window.self && !window.top.location.href; } catch (e) { crossFrame = true; }
  var micBlocked = !SR || crossFrame;
  var micWhy = !SR ? '這個瀏覽器沒有語音辨識（iPad 請用 Safari 開）'
             : crossFrame ? '這個預覽頁不給開麥克風' : '';
  function autoOn() { return db.judge === 'auto' && !micBlocked; }

  /* ---------- 朗讀 ---------- */
  var canSpeak = 'speechSynthesis' in window;
  var voices = [], voice = null;
  var NOVELTY = /zarvox|bad news|good news|bubbles|bells|boing|cellos|jester|organ|superstar|trinoids|whisper|wobble|albert|fred|junior|ralph|kathy|hysterical|deranged|bahh/i;
  function voiceScore(v) {
    var s = (v.voiceURI || '') + ' ' + v.name, n = 0;
    if (/premium/i.test(s)) n -= 30; else if (/enhanced/i.test(s)) n -= 20;
    if (/samantha/i.test(s)) n -= 5;
    if (/google/i.test(s)) n -= 3;
    return n;
  }
  function loadVoices() {
    if (!canSpeak) return;
    var vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
    voices = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang) && !NOVELTY.test(v.name); })
               .sort(function (a, b) { return voiceScore(a) - voiceScore(b); });
    voice = voices.filter(function (v) { return v.voiceURI === db.voiceURI; })[0] || voices[0] || null;
    var sel = $('voiceSel');
    sel.innerHTML = voices.length ? voices.map(function (v) {
      return '<option value="' + esc(v.voiceURI) + '"' + (voice === v ? ' selected' : '') + '>' + esc(v.name) + '</option>';

  }
  if (canSpeak) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
  /* 考試時麥克風是一直開著的，App 自己唸字時一定要先關，
     不然會把 App 唸的 hippo 當成孩子說對了。speakHold＝「正在唸或馬上要唸」，唸完才放麥克風回來。 */
  var speakHold = false, quietAt = 0, holdT = null, spTok = 0;
  function holdSpeech() { speakHold = true; clearTimeout(holdT); holdT = setTimeout(releaseSpeech, 6000); }
  function releaseSpeech() { speakHold = false; quietAt = Date.now(); clearTimeout(holdT); quizResume(); }
  function say(text, rate) {
    if (!canSpeak) return;
    if (rec) stopListen();
    var tok = ++spTok;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; if (voice) u.voice = voice;
      u.rate = rate || db.rate; u.pitch = 1.05;
      u.onend = u.onerror = function () { if (tok === spTok) releaseSpeech(); };
      holdSpeech();
      speechSynthesis.speak(u);
    } catch (e) { releaseSpeech(); }
  }
  /* 麥克風剛關，iPad 的音訊還在切換，馬上唸常會被吃掉或變很小聲，等一下再唸 */
  function sayLater(text, rate, delay) {
    if (!canSpeak) return;
    if (rec) stopListen();
    var tok = ++spTok;
    holdSpeech();
    setTimeout(function () { if (tok === spTok) say(text, rate || undefined); }, delay || 450);
  }
  function hush() { spTok++; try { if (canSpeak) speechSynthesis.cancel(); } catch (e) {} speakHold = false; }

  /* ---------- 判斷唸得對不對 ----------

     3. 聽成單字表裡的另一個字（例如 pet 說成 dog），給針對性的提示，不直接判錯。

  var ALT = {

    koala: ['koalas','coala'], lion: ['lions','lyon'], mouse: [], mice: ['mise'],

  function compact(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }

    for (i = 0; i < alts.length; i++) if (hits(en, alts[i])) return { kind: 'ok', heard: alts[i], score: 1 };

    $('micBtn').classList.add('live'); $('micLbl').textContent = '聽你說…';
    listen(en, function (t) {
      if (R.q === q && !q.solved) setFb('info', '<span class="heard">' + esc(t) + '</span>');
    }, function (r) {
      if (!rec) micIdle();
      if (r.killed || !R || R.q !== q || q.solved) return;
      if (r.err === 'not-allowed' || r.err === 'service-not-allowed' || r.err === 'audio-capture') {
        if (AUTO.ok && r.err === 'not-allowed') {   /* 之前開得起來，現在不行＝iPad 要按一下才准重開 */
          AUTO.tap = true; micIdle(); setFb('info', '按一下麥克風，繼續說'); return;
        }
        blockMic(); layoutJudge();
        setFb('info', '這台裝置沒給麥克風權限，改成爸媽聽：孩子唸，爸媽按對錯');
        return;
      }
      if (r.err && r.err !== 'no-speech' && r.err !== 'aborted' && !(r.alts || []).length) {
        if (++AUTO.fails >= 3) { AUTO.tap = true; micIdle(); setFb('info', '麥克風停下來了，按一下繼續'); return; }
        autoListen(1200); return;
      }
      AUTO.fails = 0;
      var j = judge(en, r.alts || []);
      logHeard(en, r.alts || [], j.kind, j.score);
      if (j.kind === 'ok') onRight();
      else if (j.kind === 'silent') {
        if (AUTO.on) { if (!$('pFb').classList.contains('bad')) setFb('info', '看圖，直接說出英文'); autoListen(100); }
        else setFb('info', '沒聽到聲音，按一下麥克風再大聲說');
      }
      else onWrong(j);
    }, function () { AUTO.ok = true; AUTO.fails = 0; });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopListen(); else quizResume();
  });

  /* ---------- 每題倒數 ----------
     只在「孩子可以開口」的時候計時：App 在唸字、麥克風暫停、等人按「繼續聽」、切到背景都不算。 */
  var TM = { el: 0, last: Date.now() };
  function limitMs() { return (db.limit == null ? 15 : db.limit) * 1000; }
  function timerReset() { TM.el = 0; TM.last = Date.now(); drawTimer(); }
  function timerCounting() {
    if (!R || !R.q || R.q.solved || !$('play').classList.contains('on') || document.hidden) return false;
    if (speakHold || (canSpeak && speechSynthesis.speaking)) return false;
    if (autoOn() && (!AUTO.on || AUTO.tap)) return false;
    return true;
  }
  function drawTimer() {
    var lim = limitMs(), bar = $('tBar');
    if (!lim || !R || !R.q || R.q.solved) { bar.hidden = true; return; }
    var left = Math.max(0, 1 - TM.el / lim);
    bar.hidden = false;
    $('tFill').style.width = (left * 100) + '%';
    bar.classList.toggle('low', left <= 1 / 3);
    $('tSec').textContent = Math.ceil((lim - TM.el) / 1000) + ' 秒';
  }
  setInterval(function () {
    var now = Date.now(), dt = now - TM.last;
    TM.last = now;
    if (!limitMs() || !timerCounting()) { if (R && $('play').classList.contains('on')) drawTimer(); return; }
    TM.el += dt;
    var lim = limitMs();
    if ($('pWord').hidden) {
      if (R.q.cue < 1 && TM.el >= lim / 3) cueStage(1);
      else if (R.q.cue < 2 && TM.el >= lim * 2 / 3) cueStage(2);
    }
    if (TM.el >= lim) { TM.el = 0; onTimeout(); }
    drawTimer();
  }, 200);
  /* ---------- 提示一點一點給 ----------
     15 秒為例：5 秒唸開頭的音＋秀第一個字母，10 秒再多秀一個字母，15 秒才公布整個字。
     自己想起來的比聽到答案記得牢，只給剛好夠的提示。
     語音唸單一字母會變成字母名稱（h＝「欸取」），所以開頭的音用拼出來的音節：huh、fruh、shh。 */
  var ONSET = {
    animal: 'an', elephant: 'el', chicken: 'chuh', frog: 'fruh', dress: 'druh', glasses: 'gluh',
    clothes: 'kluh', sheep: 'shh', shirt: 'shh', snake: 'snuh', spider: 'spuh', 'T-shirt': 'tee',
    zebra: 'zee', whale: 'wuh'
  };
  var ONSET_L = { b: 'buh', c: 'kuh', d: 'duh', f: 'fuh', g: 'guh', h: 'huh', j: 'juh', k: 'kuh', l: 'luh',
                  m: 'muh', p: 'puh', r: 'ruh', s: 'suh', t: 'tuh', w: 'wuh', z: 'zuh' };
  function onsetOf(en) { return ONSET[en] || ONSET_L[en.charAt(0).toLowerCase()] || en.charAt(0); }
  function pattern(en, k) {
    var n = 0;
    return en.split('').map(function (c) {
      if (c === '-') return '-';
      n++; return n <= k ? c : '_';
    }).join(' ');
  }
  function cueStage(n) {
    var q = R.q, en = q.w.en;
    q.cue = n;
    $('pPat').textContent = pattern(en, n);
    $('pZh').textContent = n === 1 ? '開頭的音聽聽看' : '再給你一個字母';
    $('pHint').hidden = false;
    if (!$('pFb').classList.contains('bad')) setFb('info', n === 1 ? '提示：開頭是這個音' : '快想起來了！');
    sayLater(onsetOf(en), 0.7);
  }

  /* 時間到＝算錯：唸正確的給他聽，再給一次時間跟著說。唸對才放他過，不會自己跳下一題
     （真的卡住，爸媽按「說對了」）。 */
  function onTimeout() {
    if (R.q.solved) return;
    stopListen();
    onWrong({ kind: 'timeout' });
  }

  /* ---------- 答對的獎勵 ---------- */
  var AC = null;
  function unlockAudio() {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  /* 叮咚：一次就對是往上爬的四個音，提示後說對是兩個音 */
  function chime(big) {
    if (!AC) return;
    try {
      var notes = big ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 880], t0 = AC.currentTime + 0.02;
      notes.forEach(function (f, i) {
        var o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * 0.09;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.42);
      });
    } catch (e) {}
  }
  function burst(big) {
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
    var card = $('pCard'), n = big ? 14 : 7, E = big ? ['⭐', '✨', '🌟', '🎉'] : ['✨', '⭐'];
    for (var i = 0; i < n; i++) {
      var sp = document.createElement('span'), a = i / n * 2 * Math.PI + Math.random() * 0.4, d = 34 + Math.random() * 14;
      sp.className = 'spark'; sp.textContent = E[i % E.length];
      sp.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'cqw');
      sp.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'cqw');
      sp.style.animationDelay = Math.round(Math.random() * 90) + 'ms';
      card.appendChild(sp);
      setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(sp), 1300);
    }
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  var PRAISE_ZH = ['太棒了！', '好厲害！', '答對了！', '完全正確！', '你好會！'];
  var PRAISE_EN = ['Great job!', 'Awesome!', 'You got it!', 'Excellent!', 'Well done!'];

  function ask(now) {
    clearAuto();
    if (R.i >= R.list.length) { finish(); return; }
    var w = R.list[R.i];
    R.q = { w: w, tries: 0, helped: false, cue: 0, solved: false, again: !!R.again[w.en] && R.res[w.en] !== undefined };
    $('pCard').className = 'card';
    $('pCard').innerHTML = picBig(w.en) + (R.q.again ? '<span class="again-tag">再挑戰一次</span>' : '');
    $('pWord').hidden = true; $('pHint').hidden = true;
    $('pCount').textContent = (R.i + 1) + ' / ' + R.list.length;
    $('pProg').style.width = (R.i / R.list.length * 100) + '%';
    $('sayBtn').hidden = true; $('nextBtn').hidden = true; $('hintBtn').hidden = false;
    setFb('info', !autoOn() ? '看圖，大聲說出英文' : AUTO.on ? '看圖，直接說出英文' : '看圖，按麥克風說出英文');
    layoutJudge(); micIdle(); timerReset();
    if (autoOn() && AUTO.on) { if (now && !speakHold) { hush(); quizListen(); } else autoListen(250); }
  }
  function layoutJudge() {
    var auto = autoOn();
    $('micWrap').hidden = !auto;
    var pr = $('parentRow');
    pr.classList.toggle('big', !auto);
    pr.querySelector('.lab').textContent = auto ? '聽錯時爸媽按' : '爸媽聽到了';
    pr.hidden = R && R.q && R.q.solved;
  }
  function setFb(kind, html) { var f = $('pFb'); f.className = 'fb ' + kind; f.innerHTML = html; }
  function showHint() {
    var w = R.q.w;
    R.q.helped = true;
    var pat = w.en.split('').map(function (c, i) { return i === 0 ? c : (c === '-' ? '-' : '_'); }).join(' ');
    $('pPat').textContent = pat;
    $('pZh').textContent = w.zh;
    $('pHint').hidden = false;
  }
  function reveal(slow) {
    var w = R.q.w;
    R.q.helped = true;
    $('pHint').hidden = true;
    $('pWord').textContent = w.en; $('pWord').hidden = false;
    $('sayBtn').hidden = false; $('hintBtn').hidden = true;
    $('nextBtn').hidden = true;   /* 唸對才放過，不給跳 */
    sayLater(w.en, slow);
  }

  function markDone(outcome) {
    var en = R.q.w.en;
    if (R.res[en] === undefined) {
      R.res[en] = outcome;
      var r = db.m[en] || { lv: 0, n: 0, ok: 0 };
      r.n++; r.t = Date.now();
      if (outcome === 'first') { r.ok++; r.lv = Math.min(3, r.lv + 1); }
      else if (outcome === 'cue') { /* 心不加也不扣 */ }
      else if (outcome === 'help') r.lv = Math.max(0, r.lv - 1);
      else r.lv = 0;
      db.m[en] = r; save();
      if (outcome !== 'first' && !R.again[en]) { R.again[en] = true; R.list.push(R.q.w); }
    }
  }

  /* 答對：叮咚＋星星噴出來＋唸單字再誇一句。一次就對才拿星星，星星會一直累積。 */
  function onRight() {
    if (R.q.solved) return;
    R.q.solved = true;
    clearTimeout(AUTO.t); stopListen();
    var first = R.q.tries === 0 && !R.q.helped && !R.q.cue;
    var cued = R.q.tries === 0 && !R.q.helped && R.q.cue > 0;   /* 聽了開頭的音自己想起來 */
    markDone(first ? 'first' : cued ? 'cue' : 'help');
    $('pCard').classList.remove('ok'); void $('pCard').offsetWidth; $('pCard').classList.add('ok');
    $('pWord').textContent = R.q.w.en; $('pWord').hidden = false; $('pHint').hidden = true;
    chime(first); burst(first);
    if (first) {
      R.stars++; R.streak++;
      db.stars = (db.stars || 0) + 1; save();
      var ps = $('pStars'); ps.textContent = '⭐ ' + R.stars;
      ps.classList.remove('pop'); void ps.offsetWidth; ps.classList.add('pop');
      setFb('ok', '⭐ ' + pick(PRAISE_ZH) + ' 拿到一顆星' +
        (R.streak >= 3 ? '<br><span class="combo">🔥 連續答對 ' + R.streak + ' 題</span>' : ''));
    } else if (cued) {
      R.streak = 0;
      setFb('ok', '✓ 有提示也想起來了！');
    } else {
      R.streak = 0;
      setFb('ok', '✓ 說對了！記住囉');
    }
    $('hintBtn').hidden = true; $('sayBtn').hidden = false; $('parentRow').hidden = true;
    $('micWrap').hidden = true; drawTimer();
    sayLater(R.q.w.en + '! ' + (first ? pick(PRAISE_EN) : 'Good!'), null, 650);
    startAuto();
  }
  /* 唸錯：每一次都把正確的字秀出來、唸給他聽，唸完麥克風自動再開，讓他跟著說。 */
  function onWrong(j) {
    var q = R.q, w = q.w;
    q.tries++;
    $('pCard').classList.remove('bad'); void $('pCard').offsetWidth; $('pCard').classList.add('bad');
    var heard = j.heard ? '我聽到 <span class="heard">' + esc(j.heard) + '</span>。' : '';
    var lead = j.kind === 'timeout' ? '時間到！<br>'
             : j.kind === 'other' ? esc(otherMsg(w.en, j.other)) + '<br>'
             : j.kind === 'near' ? heard + '有 ' + pct(j.score) + ' 像，好接近了！<br>'
             : heard;
    var tail = q.tries >= 3 ? '沒關係，聽清楚，再跟著說一次' : '聽一次，跟著說！';
    if (!AUTO.on && autoOn()) tail += '（按麥克風）';
    R.streak = 0; timerReset();
    setFb('bad', lead + tail);
    reveal(q.tries >= 2 ? 0.6 : 0);
    if (AUTO.on) autoListen(0);   /* 會等唸完才開 */
  }

  /* 麥克風鈕：聽的時候按＝暫停；停著的時候按＝開始（之後每題又會自動聽） */
  $('micBtn').addEventListener('click', function () {
    if (!R || R.q.solved) return;
    if (rec) { autoOff(); micIdle(); setFb('info', '暫停了，按麥克風繼續'); return; }
    unlockAudio();
    AUTO.on = true; AUTO.tap = false; AUTO.fails = 0;
    hush(); quizListen();
  });
  $('pOk').addEventListener('click', function () { onRight(); });
  $('pNo').addEventListener('click', function () { stopListen(); if (!R.q.solved) onWrong({ kind: 'no' }); });
  $('hintBtn').addEventListener('click', function () {
    if (!$('pHint').hidden) { reveal(0); setFb('info', '聽一次，跟著說！'); }
    else { showHint(); setFb('info', '提示在上面，想想看'); }
  });
  $('sayBtn').addEventListener('click', function () { clearAuto(); say(R.q.w.en); });
  $('nextBtn').addEventListener('click', function () {
    if (!R.q.solved) { markDone('miss'); R.streak = 0; }
    R.i++; ask(true);
  });
  $('quitBtn').addEventListener('click', function () {
    autoOff(); hush(); clearAuto();
    if (Object.keys(R.res).length) finish(); else goHome();
  });

  /* 答對後倒數 4 秒自動跳下一題；按「聽一次」就停下來讓他多看一下 */
  function startAuto() {
    clearAuto();
    autoN = 4;
    var nb = $('nextBtn'); nb.hidden = false;
    nb.textContent = '下一題 › ' + autoN;
    autoT = setInterval(function () {
      autoN--;
      if (autoN <= 0) { clearAuto(); R.i++; ask(); return; }
      nb.textContent = '下一題 › ' + autoN;
    }, 1000);
  }
  function clearAuto() {
    if (autoT) { clearInterval(autoT); autoT = null; if ($('nextBtn')) $('nextBtn').textContent = '下一題 ›'; }
  }

  function finish() {
    clearAuto(); autoOff();
    var ens = Object.keys(R.res);
    var first = ens.filter(function (en) { return R.res[en] === 'first'; });
    var rest = ens.filter(function (en) { return R.res[en] !== 'first'; });
    var total = ens.length;
    $('rScore').innerHTML = first.length + '<small>/ ' + total + '</small>';
    var pct = total ? first.length / total : 0;
    $('rMedal').textContent = pct === 1 ? '🏆' : pct >= 0.8 ? '🌟' : pct >= 0.5 ? '👍' : '💪';
    $('rMsg').innerHTML = esc(pct === 1 ? '全部一次就說對，可以去給老師蓋章了！'
      : pct >= 0.8 ? '好厲害，只差一點點！' : '再練幾次就會了') +
      '<br><span class="earn">這一輪拿到 ⭐ ×' + R.stars + '，總共 ' + (db.stars || 0) + ' 顆</span>';
    if (pct === 1) chime(true);
    function item(en) {
      var t = { first: '一次就對', cue: '聽開頭想起來', help: '看答案後說對', miss: '還不會' }[R.res[en]];
      return '<div class="ri ' + R.res[en] + '"><span class="p">' + picMini(en) + '</span><span class="w">' + esc(en) + heartsHTML(en) + '</span><span class="t">' + t + '</span></div>';
    }
    $('rFirst').innerHTML = first.map(item).join('');
    $('rMiss').innerHTML = rest.map(item).join('');
    $('rH1').hidden = !first.length; $('rH2').hidden = !rest.length;
    $('redoBtn').hidden = !rest.length;
    $('redoBtn').onclick = function () { startTest(rest.map(function (en) { return BY[en]; })); };
    show('result');
  }

  /* ---------- 首頁按鈕 ---------- */
  $('learnBtn').addEventListener('click', function () { startLearn(selWords()); });
  $('testBtn').addEventListener('click', function () { startTest(selWords()); });
  $('weakBtn').addEventListener('click', function () { startTest(weakWords()); });

  function blockMic() { micBlocked = true; micWhy = '這台裝置沒給麥克風權限'; }

  /* ---------- 設定 ---------- */
  function openSheet() { renderSheet(); document.body.classList.add('sheet-open'); }
  function closeSheet() { document.body.classList.remove('sheet-open'); renderHome(); }
  function renderSheet() {
    Array.prototype.forEach.call($('judgeSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === db.judge));
    });
    $('judgeHint').textContent = micBlocked
      ? micWhy + '，現在不管選哪個都是爸媽聽。'
      : db.judge === 'auto' ? '進考試就自動開麥克風，每題直接說，不用再按。辨識聽錯時爸媽還是可以直接按對錯。'
      : '孩子唸出來，爸媽按對錯。辨識常聽不準的時候用這個。';
    var lim = String(db.limit == null ? 15 : db.limit);
    Array.prototype.forEach.call($('limitSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === lim));
    });
    var pass = String(db.pass || 70);
    Array.prototype.forEach.call($('sensSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === pass));
    });
    $('sensHint').textContent = {
      '70': '有 7 成像就過：flog（frog）88%、hip（hippo）80%、cut（cat）83% 都算。小學生建議用這個。',
      '80': '有 8 成像才過：flog、hip、cut 還是過；house（horse）73% 就不過了。',
      '90': '要 9 成像才過，接近老師考試的標準：flog 88%、hip 80% 都不過。考前模擬用。'
    }[pass] + ' 像幾 %＝拼字和子音發音的平均，母音不算、l 和 r 算一樣。';
    var log = (db.log || []).slice().reverse();
    $('heardLog').innerHTML = log.length ? log.map(function (x) {
      var ok = x.k === 'ok';
      return '<div><b>' + esc(x.w) + '</b><span>' + esc(x.h.join(' / ')) + '</span><i class="' + (ok ? 'y' : 'n') + '">' +
        (x.s != null ? pct(x.s) + ' ' : '') + (ok ? '✓' : '✗') + '</i></div>';
    }).join('') : '<p class="hintline">考過之後，這裡會列出每一題 App 聽到的字。</p>';
    $('rate').value = db.rate; $('rateV').textContent = db.rate <= 0.6 ? '很慢' : db.rate <= 0.8 ? '慢一點' : '正常';
    var h = '';
    for (var wk = 1; wk <= 9; wk++) h += '<button type="button" class="chip" data-wk="' + wk + '" aria-pressed="' + (db.stamps.indexOf(wk) >= 0) + '">' + wk + '</button>';
    $('stampChips').innerHTML = h;
    $('resetBtn').textContent = '清除所有練習紀錄'; $('resetBtn').dataset.arm = '';
  }
  $('setBtn').addEventListener('click', openSheet);
  $('sheetDone').addEventListener('click', closeSheet);
  $('sheetBg').addEventListener('click', closeSheet);
  $('judgeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    db.judge = b.getAttribute('data-v'); save(); renderSheet();
  });
  $('limitSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    db.limit = +b.getAttribute('data-v'); save(); renderSheet();
  });
  $('sensSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    db.pass = +b.getAttribute('data-v'); save(); renderSheet();
  });
  $('voiceSel').addEventListener('change', function () {
    db.voiceURI = this.value; save(); loadVoices(); say('frog');
  });
  $('rate').addEventListener('input', function () { db.rate = +this.value; save(); renderSheet(); });
  $('rate').addEventListener('change', function () { say('butterfly'); });
  $('stampChips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var wk = +b.getAttribute('data-wk'), i = db.stamps.indexOf(wk);
    if (i >= 0) db.stamps.splice(i, 1); else db.stamps.push(wk);
    save(); renderSheet();
  });
  $('resetBtn').addEventListener('click', function () {
    var b = this;
    if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '確定要清除？再按一次'; return; }
    db.m = {}; db.stars = 0; save(); b.dataset.arm = ''; b.textContent = '已清除';
  });

  renderHome();
})();
</script>
</body>
