<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>看圖說單字</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F9FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* 看圖說單字：115 上每週英語單字表（44 字、9 週）。
     老師的考法是「看圖 → 唸出英文」，所以考的時候畫面上只有圖，不給字、不給中文。
     配色沿用 ABC 字母大考驗的家族色，主色換成英文科的藍，孩子一眼分得出是哪一支。 */
  :root {
    --bg: #F5F9FD;
    --bg-2: #E6F0FA;
    --surface: #FFFFFF;
    --track: #DCE8F4;
    --ink: #2E3A46;
    --ink-soft: #66788A;
    --ink-faint: #A7B6C4;
    --line: #DAE5F0;
    --key: #3E86C9;
    --key-deep: #2A6AA6;
    --key-soft: #E3EFFA;
    --mint: #2FB48C;
    --mint-ink: #178A69;
    --mint-soft: #DFF5EE;
    --coral: #EE6B57;
    --coral-ink: #C94A36;
    --coral-soft: #FDE8E4;
    --amber: #E3A21A;
    --amber-soft: #FFF3D9;
    --stamp: #3553A8;
    --zoo: #E3F1DA; --zoo-ink: #4E8A3A;
    --shop: #F8E7EE; --shop-ink: #B5577A;
    --road: #EADBBC; --road-dash: #C4A36A;
    --ring: rgba(255,255,255,.8);
    --shadow: 0 1px 2px rgba(40,90,140,.06), 0 8px 22px rgba(40,90,140,.10);
    --radius: 22px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    /* 英文字用單層 a 的字體，跟學校單字表印的字形一樣 */
    --en: "Andika", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif;
    --fs-title: 1.5rem;
    --fs-head: 1.2rem;
    --fs-body: .95rem;
    --fs-note: .78rem;
    --fs-word: clamp(2.6rem, 11vw, 4rem);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #172029; --bg-2: #1F2B36; --surface: #23303C; --track: #1B2631;
      --ink: #E8F0F7; --ink-soft: #A6B7C7; --ink-faint: #6D8194; --line: #34455A;
      --key: #7CB8F0; --key-deep: #A5D0F7; --key-soft: rgba(124,184,240,.16);
      --mint: #52D1AA; --mint-ink: #86E3C6; --mint-soft: rgba(82,209,170,.15);
      --coral: #FF8A77; --coral-ink: #FFA797; --coral-soft: rgba(255,138,119,.15);
      --amber: #FFC45E; --amber-soft: rgba(255,196,94,.15);
      --stamp: #93A9F0;
      --zoo: #1F3024; --zoo-ink: #8FD08A; --shop: #33232B; --shop-ink: #F0A3C0;
      --road: #4B4232; --road-dash: #8C7A55; --ring: rgba(255,255,255,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #172029; --bg-2: #1F2B36; --surface: #23303C; --track: #1B2631;
    --ink: #E8F0F7; --ink-soft: #A6B7C7; --ink-faint: #6D8194; --line: #34455A;
    --key: #7CB8F0; --key-deep: #A5D0F7; --key-soft: rgba(124,184,240,.16);
    --mint: #52D1AA; --mint-ink: #86E3C6; --mint-soft: rgba(82,209,170,.15);
    --coral: #FF8A77; --coral-ink: #FFA797; --coral-soft: rgba(255,138,119,.15);
    --amber: #FFC45E; --amber-soft: rgba(255,196,94,.15);
    --stamp: #93A9F0;
    --zoo: #1F3024; --zoo-ink: #8FD08A; --shop: #33232B; --shop-ink: #F0A3C0;
    --road: #4B4232; --road-dash: #8C7A55; --ring: rgba(255,255,255,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: var(--fs-body); line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
  .en { font-family: var(--en); }

  .app { margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; }
  #learn, #play { max-width: 1100px; margin: 0 auto; }
  #result { max-width: 760px; margin: 0 auto; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.on { display: flex; }

  /* ---------- 共用按鈕 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 20px; border-radius: 16px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: var(--fs-head); font-weight: 700;
  }
  .btn.primary { background: var(--key); border-color: var(--key); color: var(--surface); }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 40px; font-size: var(--fs-body); padding: 0 14px; border-radius: 12px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ok { background: var(--mint-soft); border-color: var(--mint); color: var(--mint-ink); }
  .btn.no { background: var(--coral-soft); border-color: var(--coral); color: var(--coral-ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 0; }

  /* ---------- 首頁：冒險地圖 ----------
     9 週是一條路：前 6 週在動物森林、後 3 週在衣服店（單字表本來就是動物→衣服）。
     橫放（.wide）地圖填滿、面板浮在右下；直放（.tall）路線由下往上，面板接在地圖下面。 */
  #home { height: calc(100vh - 48px); height: calc(100dvh - 48px); min-height: 560px; gap: 12px; position: relative; }
  .map {
    position: relative; flex: 1 1 auto; min-height: 300px; border-radius: 26px; overflow: hidden;
    background: linear-gradient(100deg, var(--zoo) 0 57%, var(--shop) 57% 100%);
  }
  #home.tall .map { background: linear-gradient(180deg, var(--shop) 0 36%, var(--zoo) 36% 100%); }
  .road { position: absolute; inset: 0; width: 100%; height: 100%; }
  .road .base { stroke: var(--road); stroke-width: 30; }
  .road .dash { stroke: var(--road-dash); stroke-width: 3; stroke-dasharray: 9 9; }
  .map-top { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-chip { background: var(--surface); padding: 8px 18px; border-radius: 18px; box-shadow: var(--shadow); }
  .title-chip h1 { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.6rem); line-height: 1.25; letter-spacing: .06em; }
  .title-chip .sub { margin: 0; color: var(--ink-soft); font-size: var(--fs-note); letter-spacing: .04em; }
  .zone {
    position: absolute; z-index: 1; font-size: var(--fs-note); font-weight: 800; letter-spacing: .08em;
    padding: 3px 12px; border-radius: 99px; background: var(--surface); opacity: .88;
  }
  .zone.a { color: var(--zoo-ink); }
  .zone.b { color: var(--shop-ink); }

  .stop {
    --s: clamp(58px, 10.5vmin, 104px);
    position: absolute; z-index: 2; width: var(--s); height: var(--s); transform: translate(-50%, -50%);
    border: none; border-radius: 50%; padding: 6px;
    background: conic-gradient(var(--mint) calc(var(--p) * 1%), var(--ring) 0);
    box-shadow: 0 4px 12px rgba(0,0,0,.14);
  }
  .stop .in {
    width: 100%; height: 100%; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; font-size: calc(var(--s) * .48); line-height: 1;
  }
  .stop .in svg { width: .95em; height: .95em; }
  .stop.new:not(.sel) .in > span { filter: grayscale(1); opacity: .5; }
  .stop .no {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 800; padding: 1px 9px; border-radius: 99px;
  }
  .stop .flag {
    position: absolute; top: -6px; right: -14px; background: var(--stamp); color: var(--surface);
    font: 800 .78rem var(--en); padding: 2px 8px; border-radius: 7px 7px 7px 0; transform: rotate(8deg);
  }
  .stop .crown { position: absolute; top: -12px; left: -8px; font-size: calc(var(--s) * .3); }
  .stop.sel { --s: clamp(78px, 14.5vmin, 138px); z-index: 4; box-shadow: 0 0 0 6px var(--key), 0 0 0 16px var(--key-soft), 0 8px 18px rgba(0,0,0,.2); }
  .kid {
    position: absolute; left: 50%; bottom: 86%; font-size: calc(var(--s) * .46); line-height: 1;
    transform: translateX(-50%); animation: hop .5s ease-out; pointer-events: none;
  }
  @keyframes hop {
    0% { transform: translate(-50%, 50%) scale(.5); opacity: 0; }
    60% { transform: translate(-50%, -22%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%, 0); }
  }

  .panel { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  #home.wide .panel { position: absolute; right: 14px; bottom: 14px; z-index: 5; width: min(440px, 40%); }
  .p-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .p-h b { font-size: 1.5rem; }
  .okchip { font: 800 var(--fs-note) var(--en); color: var(--stamp); border: 2px dashed var(--stamp); border-radius: 99px; padding: 0 10px; }
  .stars { margin-left: auto; font-size: 1.35rem; letter-spacing: 2px; white-space: nowrap; }
  .st { font-style: normal; color: var(--track); }
  .st.on { color: #F2B63A; }
  .st.half { background: linear-gradient(90deg, #F2B63A 50%, var(--track) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .p-e { display: flex; justify-content: space-around; align-items: center; font-size: clamp(2rem, 4.4vw, 3rem); line-height: 1.2; border-radius: 16px; padding: 6px 8px; background: var(--zoo); }
  .p-e.shop { background: var(--shop); }
  .p-e svg { width: 1em; height: 1em; display: block; }
  .p-w { margin: 0; text-align: center; font-family: var(--en); color: var(--ink-soft); }
  .p-act { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
  .p-act .btn { min-height: 60px; font-size: 1.2rem; }
  .notice {
    margin: 0; padding: 8px 12px; border-radius: 12px;
    background: var(--amber-soft); color: var(--ink); font-size: var(--fs-note);
  }
  .notice b { color: var(--amber); }

  /* ---------- 題目畫面 ---------- */
  .bar { display: flex; align-items: center; gap: 12px; }
  .prog { flex: 1; height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--key); border-radius: 99px; transition: width .3s; }
  .count { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; min-width: 4.5em; text-align: right; }

  .card {
    position: relative; align-self: center; width: min(100%, 52vh, 520px); aspect-ratio: 1; max-width: 100%;
    container-type: inline-size;
    border-radius: 28px; background: var(--surface); box-shadow: var(--shadow);
    display: grid; place-items: center; overflow: hidden;
  }
  .card.ok { box-shadow: 0 0 0 5px var(--mint), var(--shadow); }
  .card.bad { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .again-tag {
    position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 99px;
    background: var(--amber-soft); color: var(--amber); font-size: var(--fs-note); font-weight: 700;
  }
  /* 圖跟著卡片大小走（cqw＝卡片寬度的 1%） */
  .pic { font-size: 58cqw; line-height: 1; user-select: none; }
  .pic.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw 6cqw; font-size: 30cqw; }
  .pic.trio { display: flex; gap: 1cqw; font-size: 29cqw; }
  .pic.trio span:nth-child(2) { transform: translateY(-18%) scale(.9); }
  .pic svg { width: 70cqw; height: auto; display: block; }
  .house { position: relative; width: 78cqw; aspect-ratio: 1; }
  .house svg { width: 100%; height: 100%; }
  .house .in { position: absolute; left: 0; right: 0; bottom: 14%; display: flex; justify-content: center; gap: 1cqw; font-size: 23cqw; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 820px) and (orientation: landscape) {
    #learn.on, #play.on {
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
      column-gap: 36px; row-gap: 16px; min-height: calc(100vh - 48px); min-height: calc(100dvh - 48px);
    }
    #learn .bar, #play .bar { grid-column: 1 / -1; }
    #learn .card, #play .card { width: min(100%, calc(100vh - 150px)); width: min(100%, calc(100dvh - 150px)); justify-self: center; }
    .side { justify-content: center; }
  }

  .word { text-align: center; font-family: var(--en); font-weight: 700; font-size: var(--fs-word); line-height: 1.1; margin: 0; letter-spacing: .02em; }
  .zh { text-align: center; margin: 0; color: var(--ink-soft); font-size: var(--fs-head); }
  .hint {
    align-self: center; text-align: center; padding: 10px 18px; border-radius: 16px;
    background: var(--amber-soft); display: flex; flex-direction: column; gap: 2px;
  }
  .hint .pat { font-family: var(--en); font-size: 2rem; letter-spacing: .18em; font-weight: 700; }
  .hint .z { color: var(--ink-soft); }

  .fb { min-height: 2.9em; text-align: center; margin: 0; font-size: var(--fs-head); font-weight: 700; text-wrap: balance; }
  .fb.ok { color: var(--mint-ink); }
  .fb.bad { color: var(--coral-ink); }
  .fb.info { color: var(--ink-soft); font-weight: 600; }
  .fb .heard { font-family: var(--en); color: var(--ink); background: var(--track); padding: 0 8px; border-radius: 8px; }

  .mic {
    align-self: center; width: 128px; height: 128px; border-radius: 50%;
    border: none; background: var(--key); color: var(--surface);
    display: grid; place-items: center; box-shadow: 0 8px 20px rgba(40,100,170,.28);
    position: relative;
  }
  .mic svg { width: 54px; height: 54px; }
  .mic .lbl { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--ink-soft); font-size: var(--fs-body); font-weight: 700; }
  .mic.live { background: var(--coral); box-shadow: 0 0 0 0 var(--coral); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(238,107,87,.55); } 100% { box-shadow: 0 0 0 26px rgba(238,107,87,0); } }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; padding-block: 4px 34px; }
  .tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .parent {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 10px 12px; border-radius: 16px; border: 2px dashed var(--line);
  }
  .parent .lab { color: var(--ink-soft); font-size: var(--fs-note); font-weight: 700; letter-spacing: .04em; }
  .parent.big .btn { min-height: 64px; min-width: 150px; font-size: 1.3rem; }

  /* ---------- 結算 ---------- */
  .medal { font-size: 72px; text-align: center; line-height: 1; }
  #rScore { text-align: center; font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #rScore small { font-size: 1.6rem; color: var(--ink-soft); font-weight: 700; }
  .rmsg { text-align: center; margin: 0; font-size: var(--fs-head); font-weight: 700; }
  .rlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .ri { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); }
  .ri .p { font-size: 1.9rem; line-height: 1; width: 2.2rem; text-align: center; }
  .ri .p svg { width: 2rem; height: 2rem; }
  .ri .w { font-family: var(--en); font-weight: 700; font-size: 1.15rem; }
  .ri .t { margin-left: auto; font-size: var(--fs-note); font-weight: 700; }
  .ri.first .t { color: var(--mint-ink); }
  .ri.help .t { color: var(--amber); }
  .ri.miss .t { color: var(--coral-ink); }
  .rh { margin: 6px 0 0; font-size: var(--fs-note); color: var(--ink-soft); letter-spacing: .06em; font-weight: 700; }

  /* ---------- 設定 ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(10,20,30,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto;
    background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .25s;
  }
  .sheet > div { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  body.sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
  body.sheet-open .sheet { transform: translateY(0); }
  .sheet h2 { margin: 0; font-size: var(--fs-head); }
  .sheet h3 { margin: 6px 0 0; font-size: var(--fs-body); color: var(--ink-soft); letter-spacing: .04em; }
  .seg { display: flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .seg button { flex: 1; min-height: 46px; border: none; background: transparent; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--key); color: var(--surface); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-width: 48px; min-height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
  .chip[aria-pressed="true"] { border-color: var(--stamp); color: var(--stamp); background: var(--key-soft); }
  select, input[type=range] { width: 100%; }
  select { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; font: inherit; }
  .hintline { margin: 0; color: var(--ink-soft); font-size: var(--fs-note); }

  @media (prefers-reduced-motion: reduce) {
    .mic.live { animation: none; box-shadow: 0 0 0 6px var(--coral-soft); }
    .card.bad { animation: none; }
    .sheet, .sheet-bg, .prog i { transition: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= 首頁 ================= -->
  <section class="screen on" id="home">
    <div class="map" id="map">
      <svg class="road" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path class="base" id="roadBase" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <path class="dash" id="roadDash" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="zone a" id="zoneA">動物森林・第 1–6 週</span>
      <span class="zone b" id="zoneB">衣服店・第 7–9 週</span>
      <div id="stops"></div>
      <div class="map-top">
        <div class="title-chip"><h1>看圖說單字</h1><p class="sub">115 上・每週英語單字</p></div>
        <button class="btn small" id="setBtn" type="button">設定</button>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="p-h"><b id="hWk"></b><span class="okchip" id="hStamp" hidden>OK 老師蓋章了</span><span class="stars" id="hStars"></span></div>
      <div class="p-e" id="hEm"></div>
      <p class="p-w" id="hWords"></p>
      <div class="p-act">
        <button class="btn" id="learnBtn" type="button">📖 學一學</button>
        <button class="btn primary" id="testBtn" type="button">🎤 出發考一考</button>
      </div>
      <button class="btn small" id="weakBtn" type="button">🔁 還不熟的</button>
      <p class="notice" id="micNote" hidden></p>
    </div>
  </section>

  <!-- ================= 學一學 ================= -->
  <section class="screen" id="learn">
    <div class="bar">
      <button class="btn small ghost" data-home type="button">‹ 回地圖</button>
      <div class="prog"><i id="lProg"></i></div>
      <span class="count" id="lCount"></span>
    </div>
    <div class="card" id="lCard"></div>
    <div class="side">
    <p class="word" id="lWord"></p>
    <p class="zh" id="lZh"></p>
    <div class="tools">

<script>

                     .map(function (w) { return w.en; });

  /* ---------- 圖 ----------

    '<rect x="96" y="68" width="8" height="14" rx="2" fill="#E7EEF6"/>' +

    '<svg viewBox="0 0 200 200" aria-hidden="true">' +

    '<rect x="22" y="22" width="156" height="156" rx="13" fill="none" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6 5"/>' +
    '<circle cx="124" cy="62" r="17" fill="#F4C542"/><circle cx="124" cy="62" r="10" fill="none" stroke="#D9A21C" stroke-width="3"/>' +
    '<path d="M56 66 L144 66 L144 128 L100 152 L56 128 Z" fill="#4A74A6"/>' +

    '<circle cx="100" cy="72" r="11" fill="#EE6B57"/>' +
    '</svg>';

  var PIC = {
    animal: { grid: ['🐶','🐱','🐰','🐤'] }, bear: '🐻', bee: '🐝', bird: '🐦', butterfly: '🦋',
    cat: '🐱', chicken: '🐔', cow: '🐄', dog: '🐶', duck: '🦆',
    elephant: '🐘', fish: '🐟', frog: '🐸', hippo: '🦛', horse: '🐴',
    koala: '🐨', lion: '🦁', mouse: '🐭', mice: { trio: ['🐭','🐭','🐭'] }, monkey: '🐵',
    panda: '🐼', pet: { house: ['🐶','🐱'] }, pig: '🐷', rabbit: '🐰', sheep: '🐑',
    goat: '🐐', snake: '🐍', spider: '🕷️', tiger: '🐯', turtle: '🐢',
    whale: '🐳', zebra: '🦓', bag: '👜', cap: '🧢', clothes: { grid: ['👕','👖','👗','🧦'] },
    coat: '🧥', jacket: { svg: SVG_JACKET }, dress: '👗', glasses: '👓', hat: '👒',
    pants: '👖', pocket: { svg: SVG_POCKET }, shirt: '👔', 'T-shirt': '👕'
  };
  function span(s) { return '<span>' + s + '</span>'; }
  function picBig(en) {
    var p = PIC[en];

    if (p.grid) return '<div class="pic grid">' + p.grid.map(span).join('') + '</div>';
    if (p.trio) return '<div class="pic trio">' + p.trio.map(span).join('') + '</div>';

    return '<div class="pic">' + p.svg + '</div>';
  }
  function picMini(en) {
    var p = PIC[en];
    if (typeof p === 'string') return p;
    if (p.grid) return p.grid[0];
    if (p.trio) return '🐭';
    if (p.house) return '🏠';

  }

  /* ---------- 存檔（只存在這台裝置） ---------- */

  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  if (!db.sel) {
    var firstOpen = 1;
    for (var wk = 1; wk <= 9; wk++) if (db.stamps.indexOf(wk) < 0) { firstOpen = wk; break; }
    db.sel = [firstOpen];
  }
  function lv(en) { var r = db.m[en]; return r ? r.lv : -1; }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- 麥克風能不能用 ----------
     Safari（iPad／iPhone）與 Chrome 有內建語音辨識。
     被別的網站用 iframe 包起來（例如預覽頁）時瀏覽器不給麥克風，一律改成爸媽判定。 */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var crossFrame = false;
  try { crossFrame = window.top !== window.self && !window.top.location.href; } catch (e) { crossFrame = true; }
  var micBlocked = !SR || crossFrame;
  var micWhy = !SR ? '這個瀏覽器沒有語音辨識（iPad 請用 Safari 開）'
             : crossFrame ? '這個預覽頁不給開麥克風' : '';
  function autoOn() { return db.judge === 'auto' && !micBlocked; }

  /* ---------- 朗讀 ---------- */
  var canSpeak = 'speechSynthesis' in window;
  var voices = [], voice = null;
  var NOVELTY = /zarvox|bad news|good news|bubbles|bells|boing|cellos|jester|organ|superstar|trinoids|whisper|wobble|albert|fred|junior|ralph|kathy|hysterical|deranged|bahh/i;
  function voiceScore(v) {
    var s = (v.voiceURI || '') + ' ' + v.name, n = 0;
    if (/premium/i.test(s)) n -= 30; else if (/enhanced/i.test(s)) n -= 20;
    if (/samantha/i.test(s)) n -= 5;
    if (/google/i.test(s)) n -= 3;
    return n;
  }
  function loadVoices() {
    if (!canSpeak) return;
    var vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
    voices = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang) && !NOVELTY.test(v.name); })
               .sort(function (a, b) { return voiceScore(a) - voiceScore(b); });
    voice = voices.filter(function (v) { return v.voiceURI === db.voiceURI; })[0] || voices[0] || null;
    var sel = $('voiceSel');
    sel.innerHTML = voices.length ? voices.map(function (v) {
      return '<option value="' + esc(v.voiceURI) + '"' + (voice === v ? ' selected' : '') + '>' + esc(v.name) + '</option>';

  /* ---------- 判斷唸得對不對 ----------

     1. 5 個候選答案、連同過程中的暫定結果都拿來比，任何一個對就算對。
     2. 同音字算對（bee 常被聽成 be、clothes 常被聽成 close）。
     3. 聽成單字表裡的另一個字（例如 pet 說成 dog），給針對性的提示，不直接判錯。

  var ALT = {
    animal: ['animals'], bear: ['bears','bare','bair'], bee: ['be','b','bea','bees'], bird: ['birds','burd'],
    butterfly: ['butterflies'], cat: ['cats','kat'], chicken: ['chickens'], cow: ['cows','kau','cao'],
    dog: ['dogs','doug'], duck: ['ducks','duk'], elephant: ['elephants'], fish: ['fishes'],
    frog: ['frogs'], hippo: ['hippos','hippopotamus','hipo'], horse: ['horses','hoarse'],
    koala: ['koalas','coala'], lion: ['lions','lyon'], mouse: [], mice: ['mise'],
    monkey: ['monkeys'], panda: ['pandas'], pet: ['pets'], pig: ['pigs'], rabbit: ['rabbits'],
    sheep: [], goat: ['goats'], snake: ['snakes'], spider: ['spiders'], tiger: ['tigers'],
    turtle: ['turtles'], whale: ['whales','wale','wail','wales'], zebra: ['zebras'], bag: ['bags'],
    cap: ['caps'], clothes: ['close','cloths','clothe'], coat: ['coats','cote'], jacket: ['jackets'],
    dress: ['dresses'], glasses: [], hat: ['hats'], pants: [], pocket: ['pockets'], shirt: ['shirts'],

  };
  function compact(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }
  var ACCEPT = {};
  WORDS.forEach(function (w) { ACCEPT[w.en] = [compact(w.en)].concat((ALT[w.en] || []).map(compact)); });

  function norm(s) { return String(s || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z\- ]/g, ' ').replace(/\s+/g, ' ').trim(); }

  }

    for (j = 0; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  function judge(en, alts) {

    if (en === 'shirt') for (i = 0; i < alts.length; i++) if (tshirtIn(alts[i])) return { kind: 'other', other: 'T-shirt', heard: alts[i] };
    for (i = 0; i < alts.length; i++) if (hits(en, alts[i])) return { kind: 'ok', heard: alts[i] };

  /* 說成單字表裡另一個字時的提示，不透露答案的英文 */
  function otherMsg(en, other) {

      'mice|mouse': '一隻才是 mouse，這裡有好多隻喔！',

      'jacket|coat': '這件短短的、有拉鍊喔！',
      'hat|cap': '這頂有一整圈帽簷，不是棒球帽喔！',
      'cap|hat': '這頂是棒球帽喔！',
      'shirt|T-shirt': '這件有領子、有領帶，不是 T 恤喔！',
      'T-shirt|shirt': '很接近了！前面還有一個字母喔！',
      'pocket|pants': '看紅色圈起來的那個地方！',
      'pocket|shirt': '看紅色圈起來的那個地方！',
      'pocket|T-shirt': '看紅色圈起來的那個地方！',
      'bag|pocket': '這是袋子，不是口袋喔！'
    };
    if (SPECIAL[key]) return SPECIAL[key];
    if (en === 'animal' && ANIMALS.indexOf(other) >= 0) return other + ' 也是一種動物！這些合起來叫什麼？';
    if (en === 'pet' && (other === 'dog' || other === 'cat')) return '牠們是養在家裡的，這種動物叫什麼？';
    if (en === 'clothes' && ['shirt','T-shirt','pants','dress'].indexOf(other) >= 0) return '全部加起來叫什麼？';
    return '你說的是 ' + other + '（' + BY[other].zh + '），再看一次圖！';
  }

  /* ---------- 語音辨識 ---------- */
  var rec = null;
  function listen(en, onLive, done) {
    hush();
    var r;

    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    var alts = [], err = '', finished = false;
    var timer = setTimeout(function () { try { r.stop(); } catch (e) {} }, 6000);
    r.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i];
        for (var j = 0; j < res.length; j++) if (res[j].transcript) alts.push(res[j].transcript);
        if (res[0] && res[0].transcript) onLive(res[0].transcript);
      }
      /* 暫定結果就已經對了，不用等它自己停，孩子比較不會急 */
      if (judge(en, alts).kind === 'ok') { try { r.stop(); } catch (e2) {} }
    };

      clearTimeout(timer);
      if (finished) return;
      finished = true; rec = null;
      done({ alts: alts, err: err });
    };
    try { r.start(); } catch (e) { clearTimeout(timer); finished = true; rec = null; done({ err: 'start' }); }
  }
  function stopListen() { if (rec) { try { rec.abort(); } catch (e) {} rec = null; } }

  /* ---------- 畫面切換 ---------- */
  var screens = ['home', 'learn', 'play', 'result'];
  function show(id) {
    screens.forEach(function (s) { $(s).classList.toggle('on', s === id); });
    window.scrollTo(0, 0);
  }
  function goHome() { stopListen(); hush(); clearAuto(); renderHome(); show('home'); }
  Array.prototype.forEach.call(document.querySelectorAll('[data-home]'), function (b) { b.addEventListener('click', goHome); });

  /* ---------- 首頁：冒險地圖 ---------- */
  /* 每一站的座標（地圖寬高的百分比）。橫放避開右下角的面板，直放由下往上走 */
  var PTS = {
    wide: [[8, 80], [19, 60], [31, 75], [42, 53], [30, 33], [45, 18], [62, 21], [76, 38], [90, 18]],
    tall: [[22, 91], [55, 85], [80, 73], [52, 63], [22, 53], [46, 43], [78, 30], [54, 18], [26, 10]]
  };
  var ZONE = {
    wide: { a: 'left:14px;bottom:14px', b: 'left:59%;top:78px' },
    tall: { a: 'right:14px;bottom:14px', b: 'right:14px;top:78px' }
  };
  var REP = { 1: '🐻', 2: '🐱', 3: '🐸', 4: '🦁', 5: '🐼', 6: '🐯', 7: '🐳', 8: '🧥', 9: '👕' };
  function curWk() { return db.sel[0] || 1; }
  if (db.sel.length > 1) db.sel = [db.sel[0]];
  function weekOf(wk) { return WORDS.filter(function (w) { return w.wk === wk; }); }
  function selWords() { return weekOf(curWk()); }
  function weakWords() { return WORDS.filter(function (w) { var r = db.m[w.en]; return r && r.lv < 2; }); }
  function mapMode() { return window.innerWidth >= 820 && window.innerWidth / window.innerHeight >= 1.15 ? 'wide' : 'tall'; }
  function roadPath(pts) {
    var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      /* 每一段往旁邊彎一點，看起來像山路不像折線 */
      var cx = (a[0] + b[0]) / 2 + (b[1] - a[1]) * 0.25, cy = (a[1] + b[1]) / 2 - (b[0] - a[0]) * 0.25;
      d += ' Q ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b[0] + ' ' + b[1];
    }
    return d;
  }
  function starHTML(ws) {
    return ws.map(function (w) {
      var l = lv(w.en);
      return '<i class="st' + (l >= 2 ? ' on' : l === 1 ? ' half' : '') + '">★</i>';
    }).join('');
  }
  function renderHome() {
    var mode = mapMode(), pts = PTS[mode], cur = curWk();
    var home = $('home');
    home.classList.toggle('wide', mode === 'wide');
    home.classList.toggle('tall', mode === 'tall');
    var d = roadPath(pts);
    $('roadBase').setAttribute('d', d); $('roadDash').setAttribute('d', d);
    $('zoneA').style.cssText = ZONE[mode].a; $('zoneB').style.cssText = ZONE[mode].b;

    var html = '';
    for (var wk = 1; wk <= 9; wk++) {
      var ws = weekOf(wk), stamped = db.stamps.indexOf(wk) >= 0;
      var score = 0, seen = 0, known = 0;
      ws.forEach(function (w) { var l = lv(w.en); if (l >= 0) seen++; if (l >= 2) known++; score += Math.max(0, Math.min(l, 2)); });
      var pct = Math.round(score / (ws.length * 2) * 100);
      var cls = 'stop' + (wk === cur ? ' sel' : '') + (!seen && !stamped ? ' new' : '');
      html += '<button type="button" class="' + cls + '" data-wk="' + wk + '" style="left:' + pts[wk - 1][0] + '%;top:' + pts[wk - 1][1] + '%;--p:' + pct + '"' +
        ' aria-label="第 ' + wk + ' 週，會了 ' + known + ' 個' + (stamped ? '，老師蓋章了' : '') + '"' + (wk === cur ? ' aria-current="true"' : '') + '>' +
        '<span class="in"><span>' + REP[wk] + '</span></span><span class="no">' + wk + '</span>' +
        (stamped ? '<span class="flag">OK</span>' : '') +
        (known === ws.length ? '<span class="crown">👑</span>' : '') +
        (wk === cur ? '<span class="kid">🧒</span>' : '') + '</button>';
    }
    $('stops').innerHTML = html;

    var cws = weekOf(cur);
    $('hWk').textContent = '第 ' + cur + ' 週';
    $('hStamp').hidden = db.stamps.indexOf(cur) < 0;
    $('hStars').innerHTML = starHTML(cws);
    $('hEm').className = 'p-e' + (cur >= 7 ? ' shop' : '');
    $('hEm').innerHTML = cws.map(function (w) { return '<span>' + picMini(w.en) + '</span>'; }).join('');
    $('hWords').textContent = cws.map(function (w) { return w.en; }).join(' · ');
    var weak = weakWords().length;
    $('weakBtn').textContent = weak ? '🔁 還不熟的 ' + weak + ' 個（每一週混在一起）' : '🔁 還不熟的：目前沒有';
    $('weakBtn').disabled = !weak;

    var note = $('micNote');
    if (db.judge === 'parent') {
      note.hidden = false;
      note.innerHTML = '<b>爸媽聽模式</b>：孩子看圖唸出來，爸媽按「說對了／沒說對」。';
    } else if (micBlocked) {
      note.hidden = false;
      note.innerHTML = '<b>' + esc(micWhy) + '</b>，所以改成爸媽聽：孩子唸，爸媽按對錯。';
    } else {
      note.hidden = true;
    }
  }
  $('stops').addEventListener('click', function (e) {
    var b = e.target.closest('.stop'); if (!b) return;
    var wk = +b.getAttribute('data-wk');
    if (wk === curWk()) return;
    db.sel = [wk]; save(); renderHome();
  });
  var rsT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rsT);
    rsT = setTimeout(function () { if ($('home').classList.contains('on')) renderHome(); }, 120);
  });

  /* ---------- 學一學 ---------- */
  var L = { list: [], i: 0 };
  function startLearn(list) { L.list = list; L.i = 0; show('learn'); renderLearn(true); }
  function renderLearn(speak) {
    var w = L.list[L.i];
    $('lCard').innerHTML = picBig(w.en);
    $('lWord').textContent = w.en;
    $('lZh').textContent = w.zh;
    $('lCount').textContent = (L.i + 1) + ' / ' + L.list.length;
    $('lProg').style.width = ((L.i + 1) / L.list.length * 100) + '%';
    $('lFb').textContent = ''; $('lFb').className = 'fb info';
    $('lPrev').disabled = L.i === 0;
    $('lNext').textContent = L.i === L.list.length - 1 ? '學完了，去考一考 ›' : '下一個 ›';
    $('lTry').hidden = !autoOn();
    $('lCard').className = 'card';
    if (speak) say(w.en);
  }
  $('lSay').addEventListener('click', function () { say(L.list[L.i].en); });
  $('lSlow').addEventListener('click', function () { say(L.list[L.i].en, 0.5); });
  $('lPrev').addEventListener('click', function () { if (L.i > 0) { L.i--; renderLearn(true); } });
  $('lNext').addEventListener('click', function () {
    if (L.i < L.list.length - 1) { L.i++; renderLearn(true); }
    else startTest(L.list);
  });
  $('lTry').addEventListener('click', function () {
    var w = L.list[L.i], fb = $('lFb'), btn = $('lTry');
    if (rec) { stopListen(); return; }
    btn.textContent = '🔴 聽你說…（再按一下停）'; fb.className = 'fb info'; fb.textContent = '';
    listen(w.en, function (t) { fb.innerHTML = '<span class="heard">' + esc(t) + '</span>'; }, function (r) {
      btn.textContent = '🎤 換我說';
      if (r.err === 'not-allowed' || r.err === 'service-not-allowed') { blockMic(); renderLearn(false); fb.textContent = '沒拿到麥克風權限'; return; }
      var j = judge(w.en, r.alts || []);
      if (j.kind === 'ok') { fb.className = 'fb ok'; fb.textContent = '✓ 說得很好！'; $('lCard').className = 'card ok'; sayLater(w.en); }
      else if (j.kind === 'silent') { fb.className = 'fb info'; fb.textContent = '沒聽到聲音，靠近一點再說一次'; }
      else { fb.className = 'fb bad'; fb.innerHTML = '我聽到 <span class="heard">' + esc(j.heard) + '</span>，聽一次，跟著唸'; sayLater(w.en); }
    });
  });

  /* ---------- 考一考 ----------
     一輪：每個字出一次；沒一次答對的字，這輪最後會再出一次（不重複計分）。
     唸錯一次就秀出正確的字並唸給他聽，他跟著說對才過（算「提示後說對」，不計分）；
     第二次以後放慢唸。還沒開口前可以按💡先看中文和第一個字母。 */
  var R = null, autoT = null, autoN = 0;
  function startTest(list) {
    R = { list: shuffle(list), total: list.length, i: 0, res: {}, again: {} };
    show('play');
    ask();
  }
  function ask() {
    clearAuto();
    if (R.i >= R.list.length) { finish(); return; }
    var w = R.list[R.i];
    R.q = { w: w, tries: 0, helped: false, solved: false, again: !!R.again[w.en] && R.res[w.en] !== undefined };
    $('pCard').className = 'card';
    $('pCard').innerHTML = picBig(w.en) + (R.q.again ? '<span class="again-tag">再挑戰一次</span>' : '');
    $('pWord').hidden = true; $('pHint').hidden = true;
    $('pCount').textContent = (R.i + 1) + ' / ' + R.list.length;
    $('pProg').style.width = (R.i / R.list.length * 100) + '%';
    $('sayBtn').hidden = true; $('nextBtn').hidden = true; $('hintBtn').hidden = false;
    setFb('info', autoOn() ? '看圖，按麥克風說出英文' : '看圖，大聲說出英文');
    layoutJudge();
  }
  function layoutJudge() {
    var auto = autoOn();
    $('micWrap').hidden = !auto;
    var pr = $('parentRow');
    pr.classList.toggle('big', !auto);
    pr.querySelector('.lab').textContent = auto ? '聽錯時爸媽按' : '爸媽聽到了';
    pr.hidden = R && R.q && R.q.solved;
  }
  function setFb(kind, html) { var f = $('pFb'); f.className = 'fb ' + kind; f.innerHTML = html; }
  function showHint() {
    var w = R.q.w;
    R.q.helped = true;
    var pat = w.en.split('').map(function (c, i) { return i === 0 ? c : (c === '-' ? '-' : '_'); }).join(' ');
    $('pPat').textContent = pat;
    $('pZh').textContent = w.zh;
    $('pHint').hidden = false;
  }
  function reveal(slow) {
    var w = R.q.w;
    R.q.helped = true;
    $('pHint').hidden = true;
    $('pWord').textContent = w.en; $('pWord').hidden = false;
    $('sayBtn').hidden = false; $('hintBtn').hidden = true;
    $('nextBtn').hidden = false; $('nextBtn').textContent = '下一題 ›';
    sayLater(w.en, slow);
  }

  function markDone(outcome) {
    var en = R.q.w.en;
    if (R.res[en] === undefined) {
      R.res[en] = outcome;
      var r = db.m[en] || { lv: 0, n: 0, ok: 0 };
      r.n++; r.t = Date.now();
      if (outcome === 'first') { r.ok++; r.lv = Math.min(3, r.lv + 1); }
      else if (outcome === 'help') r.lv = Math.max(0, r.lv - 1);
      else r.lv = 0;
      db.m[en] = r; save();
      if (outcome !== 'first' && !R.again[en]) { R.again[en] = true; R.list.push(R.q.w); }
    }
  }

  function onRight() {
    if (R.q.solved) return;
    R.q.solved = true;
    stopListen();
    var first = R.q.tries === 0 && !R.q.helped;
    markDone(first ? 'first' : 'help');
    $('pCard').classList.add('ok');
    $('pWord').textContent = R.q.w.en; $('pWord').hidden = false; $('pHint').hidden = true;
    setFb('ok', first ? '✓ 答對了！' : '✓ 說對了！');
    $('hintBtn').hidden = true; $('sayBtn').hidden = false; $('parentRow').hidden = true;
    $('micWrap').hidden = true;
    sayLater(R.q.w.en);
    startAuto();
  }
  /* 唸錯：每一次都把正確的字秀出來、唸給他聽，再讓他按麥克風跟著說。
     不自動開麥克風——剛唸完的聲音會被麥克風收進去，把 App 自己的聲音當成孩子答對。 */
  function onWrong(j) {
    var q = R.q, w = q.w;
    q.tries++;
    $('pCard').classList.remove('bad'); void $('pCard').offsetWidth; $('pCard').classList.add('bad');
    var heard = j.heard ? '我聽到 <span class="heard">' + esc(j.heard) + '</span>。' : '';
    var lead = j.kind === 'other' ? esc(otherMsg(w.en, j.other)) + '<br>'
             : j.kind === 'near' ? heard + '好接近了！<br>'
             : heard;
    var tail = q.tries >= 3 ? '沒關係，聽清楚再跟著說一次，或按下一題' : '聽一次，跟著說！';
    setFb('bad', lead + tail);
    reveal(q.tries >= 2 ? 0.6 : 0);
  }

  $('micBtn').addEventListener('click', function () {
    if (!R || R.q.solved) return;
    if (rec) { stopListen(); return; }
    var btn = $('micBtn'), en = R.q.w.en;
    clearAuto();
    btn.classList.add('live'); $('micLbl').textContent = '聽你說…';
    setFb('info', '請說');
    listen(en, function (t) { setFb('info', '<span class="heard">' + esc(t) + '</span>'); }, function (r) {
      btn.classList.remove('live'); $('micLbl').textContent = '按我說';
      if (!R || R.q.solved) return;
      if (r.err === 'not-allowed' || r.err === 'service-not-allowed' || r.err === 'audio-capture') {
        blockMic(); layoutJudge();
        setFb('info', '這台裝置沒給麥克風權限，改成爸媽聽：孩子唸，爸媽按對錯');
        return;
      }
      if (r.err === 'aborted' && !(r.alts || []).length) { setFb('info', '看圖，按麥克風說出英文'); return; }
      var j = judge(en, r.alts || []);
      if (j.kind === 'ok') onRight();
      else if (j.kind === 'silent') setFb('info', '沒聽到聲音，按一下麥克風再大聲說');
      else onWrong(j);
    });
  });
  $('pOk').addEventListener('click', function () { onRight(); });
  $('pNo').addEventListener('click', function () { stopListen(); if (!R.q.solved) onWrong({ kind: 'no' }); });
  $('hintBtn').addEventListener('click', function () {
    if (!$('pHint').hidden) { reveal(0); setFb('info', '聽一次，跟著說！'); }
    else { showHint(); setFb('info', '提示在上面，想想看'); }
  });
  $('sayBtn').addEventListener('click', function () { clearAuto(); say(R.q.w.en); });
  $('nextBtn').addEventListener('click', function () {
    if (!R.q.solved) markDone('miss');
    R.i++; ask();
  });
  $('quitBtn').addEventListener('click', function () {
    stopListen(); clearAuto();
    if (Object.keys(R.res).length) finish(); else goHome();
  });

  /* 答對後倒數 4 秒自動跳下一題；按「聽一次」就停下來讓他多看一下 */
  function startAuto() {
    clearAuto();
    autoN = 4;
    var nb = $('nextBtn'); nb.hidden = false;
    nb.textContent = '下一題 › ' + autoN;
    autoT = setInterval(function () {
      autoN--;
      if (autoN <= 0) { clearAuto(); R.i++; ask(); return; }
      nb.textContent = '下一題 › ' + autoN;
    }, 1000);
  }
  function clearAuto() {
    if (autoT) { clearInterval(autoT); autoT = null; if ($('nextBtn')) $('nextBtn').textContent = '下一題 ›'; }
  }

  function finish() {
    clearAuto(); stopListen();
    var ens = Object.keys(R.res);
    var first = ens.filter(function (en) { return R.res[en] === 'first'; });
    var rest = ens.filter(function (en) { return R.res[en] !== 'first'; });
    var total = ens.length;
    $('rScore').innerHTML = first.length + '<small>/ ' + total + '</small>';
    var pct = total ? first.length / total : 0;
    $('rMedal').textContent = pct === 1 ? '🏆' : pct >= 0.8 ? '🌟' : pct >= 0.5 ? '👍' : '💪';
    $('rMsg').textContent = pct === 1 ? '全部一次就說對，可以去給老師蓋章了！'
      : pct >= 0.8 ? '好厲害，只差一點點！' : '再練幾次就會了';
    function item(en) {
      var t = { first: '一次就對', help: '提示後說對', miss: '還不會' }[R.res[en]];
      return '<div class="ri ' + R.res[en] + '"><span class="p">' + picMini(en) + '</span><span class="w">' + esc(en) + '</span><span class="t">' + t + '</span></div>';
    }
    $('rFirst').innerHTML = first.map(item).join('');
    $('rMiss').innerHTML = rest.map(item).join('');
    $('rH1').hidden = !first.length; $('rH2').hidden = !rest.length;
    $('redoBtn').hidden = !rest.length;
    $('redoBtn').onclick = function () { startTest(rest.map(function (en) { return BY[en]; })); };
    show('result');
  }

  /* ---------- 首頁按鈕 ---------- */
  $('learnBtn').addEventListener('click', function () { startLearn(selWords()); });
  $('testBtn').addEventListener('click', function () { startTest(selWords()); });
  $('weakBtn').addEventListener('click', function () { startTest(weakWords()); });

  function blockMic() { micBlocked = true; micWhy = '這台裝置沒給麥克風權限'; }

  /* ---------- 設定 ---------- */
  function openSheet() { renderSheet(); document.body.classList.add('sheet-open'); }
  function closeSheet() { document.body.classList.remove('sheet-open'); renderHome(); }
  function renderSheet() {
    Array.prototype.forEach.call($('judgeSeg').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === db.judge));
    });
    $('judgeHint').textContent = micBlocked
      ? micWhy + '，現在不管選哪個都是爸媽聽。'
      : db.judge === 'auto' ? '孩子按麥克風說，App 判斷。辨識聽錯時爸媽還是可以直接按對錯。'
      : '孩子唸出來，爸媽按對錯。辨識常聽不準的時候用這個。';
    $('rate').value = db.rate; $('rateV').textContent = db.rate <= 0.6 ? '很慢' : db.rate <= 0.8 ? '慢一點' : '正常';
    var h = '';
    for (var wk = 1; wk <= 9; wk++) h += '<button type="button" class="chip" data-wk="' + wk + '" aria-pressed="' + (db.stamps.indexOf(wk) >= 0) + '">' + wk + '</button>';
    $('stampChips').innerHTML = h;
    $('resetBtn').textContent = '清除所有練習紀錄'; $('resetBtn').dataset.arm = '';
  }
  $('setBtn').addEventListener('click', openSheet);
  $('sheetDone').addEventListener('click', closeSheet);
  $('sheetBg').addEventListener('click', closeSheet);
  $('judgeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    db.judge = b.getAttribute('data-v'); save(); renderSheet();
  });
  $('voiceSel').addEventListener('change', function () {
    db.voiceURI = this.value; save(); loadVoices(); say('frog');
  });
  $('rate').addEventListener('input', function () { db.rate = +this.value; save(); renderSheet(); });
  $('rate').addEventListener('change', function () { say('butterfly'); });
  $('stampChips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var wk = +b.getAttribute('data-wk'), i = db.stamps.indexOf(wk);
    if (i >= 0) db.stamps.splice(i, 1); else db.stamps.push(wk);
    save(); renderSheet();
  });
  $('resetBtn').addEventListener('click', function () {
    var b = this;
    if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '確定要清除？再按一次'; return; }
    db.m = {}; save(); b.dataset.arm = ''; b.textContent = '已清除';
  });

  renderHome();
})();
</script>
</body>
</html>
