<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>雪隧資料測試</title>
<style>
:root{--paper:#121418;--sheet:#1B1E24;--ink:#EEF0F3;--ink2:#AEB4BE;--rule:#2A2E36;--ok:#3DD68C;--bad:#F2C14E}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--paper:#F3F4F6;--sheet:#fff;--ink:#111418;--ink2:#4A515C;--rule:#E1E4E8;--ok:#0B7A44;--bad:#9A6B00}
}
:root[data-theme="light"]{--paper:#F3F4F6;--sheet:#fff;--ink:#111418;--ink2:#4A515C;--rule:#E1E4E8;--ok:#0B7A44;--bad:#9A6B00}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 4px}
p{color:var(--ink2);margin:4px 0 12px}
.row{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-top:10px}
.row b{display:block;font-size:15px}
.row .r{font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
button{font:inherit;font-size:17px;font-weight:800;border:0;border-radius:12px;padding:12px 18px;background:var(--ok);color:#0b2416;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>雪隧即時資料測試</h1>
  <p>用 iPhone 的 Safari 打開，等全部跑完（約 10–30 秒），整頁截圖傳給 Claude。這頁只讀資料，不會改任何設定。</p>
  <button onclick="run()">重新測試</button>
  <div id="out"></div>
</div>
<script>
"use strict";
const T = "https://tisvcloud.freeway.gov.tw/history/motc20/";
const TESTS = [
  {name: "高公局 VDLive.xml.gz（偵測器，壓縮）", url: T + "VDLive.xml.gz", gz: true},
  {name: "高公局 VDLive.xml（偵測器）", url: T + "VDLive.xml"},
  {name: "高公局 LiveTraffic.xml（路段旅行時間）", url: T + "LiveTraffic.xml"},
  {name: "交通部 TDX（目前頁面用的）", tdx: true}
];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtT = d => d.toLocaleTimeString("zh-TW", {hour12: false});
function ageTxt(t){
  if (!t) return "（找不到資料時間）";
  const d = new Date(t), m = (Date.now() - d) / 60000;
  return `資料時間 ${fmtT(d)}，<b>${m.toFixed(1)} 分鐘前</b>`;
}

// 從 XML 開頭附近找更新時間；整份讀完再找國 5 隧道內偵測器的時間
function findTimes(text){
  const upd = (text.match(/<UpdateTime>([^<]+)</) || [])[1];
  const src = (text.match(/<SrcUpdateTime>([^<]+)</) || [])[1];
  let n5 = null;
  const re = /<VDID>VD-N5-[NS]-(\d+(?:\.\d+)?)[^<]*<\/VDID>[\s\S]{0,4000}?<DataCollectTime>([^<]+)</g;
  let m, count = 0;
  while ((m = re.exec(text))){
    const km = +m[1];
    if (km >= 15 && km <= 28.5){ count++; if (!n5 || new Date(m[2]) > new Date(n5)) n5 = m[2]; }
  }
  return {upd, src, n5, count};
}

async function testOne(t){
  const t0 = performance.now();
  try {
    let text, size, lm = null;
    if (t.tdx){
      let headers = {};
      const cid = localStorage.getItem("st.cid"), sec = localStorage.getItem("st.csec");
      if (cid && sec){
        const r = await fetch("https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token", {
          method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: new URLSearchParams({grant_type: "client_credentials", client_id: cid, client_secret: sec})});
        if (r.ok) headers.Authorization = "Bearer " + (await r.json()).access_token;
      }
      const r = await fetch("https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/VD/Freeway?$format=JSON&$filter=" +
        encodeURIComponent("contains(VDID,'-N5-')"), {headers, cache: "no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      let n5 = null;
      for (const v of j.VDLives || []) if (!n5 || new Date(v.DataCollectTime) > new Date(n5)) n5 = v.DataCollectTime;
      const ms = performance.now() - t0;
      return `<span class="ok">✓ 讀得到</span>（${Math.round(ms)} ms，${headers.Authorization ? "用金鑰" : "免金鑰"}）<br>` +
        `整批 SrcUpdateTime：${ageTxt(j.SrcUpdateTime)}<br>國5 偵測器最新：${ageTxt(n5)}`;
    }
    const r = await fetch(t.url + "?t=" + Date.now(), {cache: "no-store", mode: "cors"});
    lm = r.headers.get("Last-Modified");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = await r.arrayBuffer();
    size = buf.byteLength;
    if (t.gz && "DecompressionStream" in window){
      const ds = new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")));
      text = await ds.text();
    } else text = new TextDecoder().decode(buf);
    const ms = performance.now() - t0;
    const f = findTimes(text);
    return `<span class="ok">✓ 讀得到</span>（${(size / 1048576).toFixed(2)} MB，${Math.round(ms)} ms）<br>` +
      (lm ? `檔案時間：${ageTxt(lm)}<br>` : "") +
      (f.upd ? `UpdateTime：${ageTxt(f.upd)}<br>` : "") +
      (f.src ? `SrcUpdateTime：${ageTxt(f.src)}<br>` : "") +
      (f.count ? `雪隧內偵測器 ${f.count} 筆，最新：${ageTxt(f.n5)}` : "");
  } catch(e){
    const ms = Math.round(performance.now() - t0);
    const why = e instanceof TypeError ? "瀏覽器擋下（多半是不允許網頁跨站讀取，CORS）或連不上" : (e.message || e);
    return `<span class="bad">✗ 讀不到</span>（${ms} ms）：${esc(why)}`;
  }
}

async function run(){
  const out = $("out");
  out.innerHTML = TESTS.map((t, i) => `<div class="row"><b>${esc(t.name)}</b><div class="r" id="r${i}">測試中…</div></div>`).join("") +
    `<div class="row"><div class="r">測試時間 ${fmtT(new Date())}・${esc(navigator.userAgent.replace(/\(.*?\)/, ""))}</div></div>`;
  await Promise.all(TESTS.map(async (t, i) => { $("r" + i).innerHTML = await testOne(t); }));
}
run();
</script>
</body>
</html>
