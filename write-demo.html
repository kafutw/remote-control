<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看注音寫字 — 試做</title>
<meta name="theme-color" content="#FDF6EC">
<style>
  :root {
    --bg:#FDF6EC; --surface:#fff; --track:#F3E3CC; --ink:#40352B; --ink-soft:#8A7660;
    --ink-faint:#BCA893; --line:#F0E2CD; --key:#D9603C; --key-deep:#B24322; --key-soft:#FDEAE2;
    --mint:#35BE96; --mint-ink:#1E9C79; --mint-soft:#E1F7F0;
    --coral:#F2705C; --coral-ink:#D64B36; --coral-soft:#FFE9E5;
    --amber:#E9A317; --amber-soft:#FFF2DA;
    --shadow:0 1px 2px rgba(180,120,40,.06), 0 8px 22px rgba(180,120,40,.10);
    /* 田字格能長多大：寬度吃滿容器，再被「畫面剩多少高」和上限夾住。
       dvh 那行給支援的瀏覽器覆蓋，Safari 網址列縮放時才不會跳。 */
    --padmax:clamp(200px, calc(100vh - 515px), 560px);
    --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --abc:"BiauKai","DFKai-SB","標楷體","Kaiti TC","楷體-繁","KaiTi","PingFang TC",sans-serif;
  }
  :root { --padmax:clamp(200px, calc(100dvh - 515px), 560px); }
  * { -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); }
  body { padding:16px 16px 40px; max-width:600px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:6px 0 2px; }
  .sub { color:var(--ink-soft); font-size:.8125rem; margin:0 0 16px; line-height:1.6; }
  .card { background:var(--surface); border-radius:20px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }
  .q { text-align:center; }
  .q .bpmf { font-family:var(--abc); font-size:2.5rem; font-weight:700; letter-spacing:.1em; color:var(--key); }
  .q .word { font-family:var(--abc); font-size:2rem; font-weight:700; margin-top:6px; }
  .q .word u { text-decoration:none; color:var(--ink-faint); border-bottom:4px solid var(--key); padding:0 .18em; }
  .q .hint { color:var(--ink-soft); font-size:.8125rem; margin-top:8px; }
  .padwrap { display:flex; justify-content:center; margin:16px 0 10px; }
  .pad { position:relative; width:100%; max-width:var(--padmax); aspect-ratio:1 / 1;
         border-radius:18px; background:var(--surface); border:2px solid var(--line);
         touch-action:none; }
  .pad canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:16px; }
  .pad .ghost { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                font-family:var(--abc); line-height:1; color:rgba(64,53,43,.12);
                pointer-events:none; user-select:none; }
  .pad .ghost.off { display:none; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .tools .btn { padding:12px 6px; }
  .btn { font-family:inherit; font-size:.9375rem; font-weight:800; cursor:pointer;
         border-radius:999px; padding:12px 18px; border:2px solid var(--line);
         background:var(--surface); color:var(--ink); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--key); color:#fff; border-color:var(--key); }
  .btn.grow { flex:1; min-width:120px; }
  .btn[disabled] { opacity:.4; cursor:default; }
  /* 家長／老師通道：平常是一行不起眼的小字，「差一點」的時候才亮起來 */
  .adult-link { display:block; margin:12px auto 0; background:none; border:0; cursor:pointer;
                font-family:inherit; font-size:.75rem; font-weight:700; color:var(--ink-faint);
                text-decoration:underline; text-underline-offset:3px; padding:6px 10px; }
  .adult-link.hot { color:var(--amber); }
  .near-tag { display:inline-block; font-size:.75rem; font-weight:800; color:#8A6410;
              background:var(--amber-soft); border-radius:999px; padding:3px 10px; margin-top:6px; }
  .sheet { position:fixed; inset:0; background:rgba(64,53,43,.45); z-index:50;
           display:flex; align-items:flex-end; justify-content:center; padding:12px; }
  .sheet.off { display:none; }
  .sheet-in { background:var(--surface); border-radius:22px; padding:20px 18px 18px;
              width:100%; max-width:460px; max-height:88vh; overflow:auto; box-shadow:var(--shadow); }
  .sheet-in h2 { font-size:1.0625rem; margin:0 0 4px; text-align:center; }
  .gate-q { font-size:1.75rem; font-weight:800; letter-spacing:.04em; margin:14px 0 10px; text-align:center; }
  /* 自己畫的數字鍵盤：iPad 橫式叫出系統鍵盤會吃掉半個畫面 */
  .dots { display:flex; justify-content:center; align-items:center; height:40px;
          font-size:1.5rem; font-weight:800; letter-spacing:.12em; color:var(--ink); }
  .keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 12px; }
  .keypad button { font-family:inherit; font-size:1.375rem; font-weight:800; cursor:pointer;
                   padding:13px 0; border-radius:14px; border:2px solid var(--line);
                   background:var(--surface); color:var(--ink); }
  .keypad button:active { background:var(--key-soft); border-color:var(--key); }
  .keypad button.k-sub { font-size:1rem; color:var(--ink-soft); }
  .off { display:none; }
  .verdict { text-align:center; }
  .verdict:not(:empty) { background:var(--surface); border-radius:20px; padding:16px 18px;
                         box-shadow:var(--shadow); margin-bottom:14px; }
  .compare { display:flex; gap:14px; justify-content:center; align-items:flex-end; margin:10px 0 4px; }
  .compare figure { margin:0; text-align:center; }
  .compare figcaption { font-size:.75rem; color:var(--ink-soft); margin-top:6px; font-weight:800; }
  .compare .box { width:130px; height:130px; border:2px solid var(--line); border-radius:14px;
                  background:var(--surface); display:flex; align-items:center; justify-content:center;
                  font-family:var(--abc); font-size:104px; line-height:1; }
  .compare .box canvas { width:100%; height:100%; }
  .note { font-size:.8125rem; color:var(--ink-soft); line-height:1.7; margin-top:10px; }
  .ok { color:var(--mint-ink); font-weight:800; }
  .no { color:var(--coral-ink); font-weight:800; }
  .settings { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:14px;
              padding:12px 14px; border:2px dashed var(--line); border-radius:16px; }
  .settings-label { font-size:.75rem; font-weight:800; color:var(--ink-soft); }
  .settings-hint { font-size:.6875rem; color:var(--ink-faint); flex:1 1 100%; line-height:1.5; }
  .seg { display:flex; gap:4px; background:var(--track); border-radius:999px; padding:3px; }
  .seg button { font-family:inherit; font-size:.75rem; font-weight:800; cursor:pointer;
                border:0; background:none; color:var(--ink-soft); border-radius:999px; padding:6px 14px; }
  .seg button.sel { background:var(--surface); color:var(--key-deep); box-shadow:var(--shadow); }
  .stroke-n { text-align:center; font-size:.8125rem; color:var(--ink-soft); margin-top:8px; font-weight:800; }

  /* iPad 橫著拿：左邊題目、右邊田字格，格子放大，整頁不用上下捲 */
  @media (orientation:landscape) and (min-width:760px) {
    :root { --padmax:min(calc(100dvh - 285px), 46vw, 560px); }
    body { max-width:1100px; padding:16px 20px 12px;
           display:grid; grid-template-columns:1fr auto; column-gap:24px; align-items:start; }
    body > h1, body > .sub, body > .card.q, body > .verdict, body > .row,
    body > .note, body > .settings { grid-column:1; }
    body > .card:not(.q) { grid-column:2; grid-row:1 / span 20; width:calc(var(--padmax) + 40px); }
    .padwrap { margin:10px 0 8px; }
    .sub { margin-bottom:6px; }
    body > .card.q { margin-bottom:10px; }
    .tools { grid-template-columns:repeat(3, 1fr); }
    /* 判定結果改成「字在左、話在右」，不然橫式的高度吃不下 */
    .verdict:not(:empty) { display:grid; grid-template-columns:auto 1fr;
                           column-gap:18px; align-items:center; text-align:left; padding:10px 16px; }
    .verdict > * { grid-column:2; }
    .verdict > .compare { grid-column:1; grid-row:1 / span 99; align-self:center; margin:0; }
    .verdict .row { justify-content:flex-start; }
    .verdict .btn.grow { flex:0 1 auto; min-width:150px; }
    .verdict .adult-link { margin-left:0; margin-right:auto; }
    body > .note { font-size:.625rem; line-height:1.4; margin-top:6px; }
    .verdict .note { line-height:1.45; margin-top:5px; }
    /* 橫式的左欄放不下，設定框收成一行，說明字收進 title */
    .settings { margin-top:10px; padding:8px 12px; gap:8px; }
    .settings-hint { display:none; }
    .seg button { padding:5px 12px; }
    .compare .box { width:84px; height:84px; font-size:67px; }
    .sheet { align-items:center; }
  }
</style>
</head>
<body>

<h1>看注音寫字</h1>
<p class="sub">試做版。用手指在格子裡寫，寫完按「我寫好了」會自動幫你對。<br>
  這一頁不會存任何東西，只是給你試手感。</p>

<div class="card q">
  <div class="bpmf" id="bpmf"></div>
  <div class="word" id="word"></div>
  <div class="hint" id="qhint"></div>
</div>

<div class="card">
  <div class="padwrap">
    <div class="pad" id="pad">
      <canvas id="grid"></canvas>
      <div class="ghost off" id="ghost"></div>
      <canvas id="ink"></canvas>
    </div>
  </div>
  <div class="stroke-n" id="strokeN"></div>
  <div class="tools">
    <button class="btn" id="undoBtn">↩︎ 上一筆</button>
    <button class="btn" id="clearBtn">🧽 清掉重寫</button>
    <button class="btn" id="ghostBtn">✍️ 描紅</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary grow" id="doneBtn">我寫好了</button>
  </div>
</div>

<div class="verdict" id="verdict"></div>

<div class="row">
  <button class="btn grow" id="nextBtn">換一題 →</button>
</div>

<div class="sheet off" id="sheet">
  <div class="sheet-in">
    <h2>家長／老師確認</h2>
    <p class="note" id="gateLead" style="text-align:center;margin-top:2px">看一下他寫的。覺得可以算過的話，答一題就能放行。</p>
    <div class="compare" id="gateCompare"></div>
    <p class="note" id="gateNums" style="text-align:center;color:var(--ink-faint)"></p>
    <div id="gateAsk">
      <p class="gate-q" id="gateQ"></p>
      <div class="dots" id="gateDots"></div>
      <p class="note no off" id="gateBad" style="text-align:center;margin-top:0">不對，換一題再試</p>
      <div class="keypad" id="keypad"></div>
      <div class="row">
        <button class="btn grow" id="gateCancel">取消</button>
        <button class="btn primary grow" id="gateOk">確定</button>
      </div>
    </div>
    <div id="gateDo" class="off">
      <div class="row" style="margin-top:14px">
        <button class="btn primary grow" id="gatePass">算他過，下一題</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn grow" id="gateRetry">不算，讓他重寫</button>
      </div>
    </div>
  </div>
</div>

<div class="settings">
  <span class="settings-label">家長設定 · 判定寬鬆度</span>
  <div class="seg" id="levelSeg">
    <button data-level="easy">輕鬆</button>
    <button data-level="normal">標準</button>
    <button data-level="hard">嚴格</button>
  </div>
  <span class="settings-hint" id="levelHint"></span>
</div>

<p class="note">
  寫完按「我寫好了」，程式會拿楷體字型畫出來的字當標準答案，比對「該有的地方寫到沒有」和「有沒有多寫」，再加上總筆畫數要跟教育部辭典一致。<br>
  <b>這一頁不判筆順、也不示範筆順。</b>唯一能用的筆順資料是大陸標準（艹 算 3 畫，台灣算 4 畫），照著練會跟學校教的打架，所以先拿掉，等找到教育部的筆順資料再放回來。
</p>

    for (var i = 1; i < pts.length; i++) ictx.lineTo(pts[i][0], pts[i][1]);

  }
  var ul = pathLen(user), wl = pathLen(want);
  if (wl > 8 && (ul > wl * 2.2 || ul < wl * 0.45)) {
    return { ok: false, why: ul > wl ? '畫太長了' : '畫太短了' };
  }
  return { ok: true };
}

/* ── 筆順動畫 ── */
var anim = null;
function playOrder() {
  if (anim) { clearInterval(anim); anim = null; }
  var m = STROKES[cur.c];
  if (!m) { say('這個字還沒有筆順資料'); return; }
  var si = 0, pi = 0, shown = [];
  anim = setInterval(function () {
    if (si >= m.length) { clearInterval(anim); anim = null; return; }
    var pts = medianPts(cur.c, si);
    pi++;
    if (pi > pts.length) { shown.push(pts); si++; pi = 0; return; }
    paintInk(function (line) {
      shown.forEach(function (s) { line(s, '#BCA893', 11); });
      if (pi >= 2) line(pts.slice(0, pi), '#D9603C', 11);
    });
  }, 90);
}

/* ────────── 自動比對（不需要筆順資料） ──────────
   課本的字本來就用楷體字型畫得出來，所以拿字型當標準答案：
   把字填實成一張黑白圖，把小孩寫的線也畫成一張，兩張互相比。
     覆蓋率 = 這個字該有的地方，他寫到了幾成      → 漏筆會掉
     乾淨度 = 他寫的線，有幾成落在這個字上面      → 多寫、寫歪會掉
   再加上一條硬規定：筆畫數要跟教育部的字數一樣（這個不靠字型，是查表）。 */
var GRID = 128;                       // 比對用的解析度，128×128 就夠了也夠快

function maskFromDraw(paint) {
  var cv = document.createElement('canvas');
  cv.width = GRID; cv.height = GRID;
  var c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, GRID, GRID);
  c.fillStyle = '#000'; c.strokeStyle = '#000';
  paint(c, GRID / SIZE);
  var d = c.getImageData(0, 0, GRID, GRID).data, m = new Uint8Array(GRID * GRID);
  for (var i = 0; i < m.length; i++) m[i] = d[i * 4] < 128 ? 1 : 0;
  return m;
}
// 字型畫出來的那個字（標準答案）
function glyphMask(ch) {
  return maskFromDraw(function (c) {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '700 ' + Math.round(GRID * 0.86) + 'px ' + getComputedStyle(document.body).getPropertyValue('--abc');
    c.fillText(ch, GRID / 2, GRID / 2 + GRID * 0.02);
  });
}
// 小孩寫的線
function inkMask(strokes) {
  return maskFromDraw(function (c, k) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.lineWidth = Math.max(3, 11 * k);
    strokes.forEach(function (st) {
      c.beginPath();
      st.forEach(function (p, i) {
        if (i) c.lineTo(p[0] * k, p[1] * k); else c.moveTo(p[0] * k, p[1] * k);
      });
      if (st.length === 1) { c.lineTo(st[0][0] * k + 0.1, st[0][1] * k); }
      c.stroke();
    });
  });
}
// 兩趟的 chamfer 距離轉換：每個點離最近的黑點多遠（單位是格）
function distMap(m) {
  var INF = 1e6, d = new Float32Array(GRID * GRID), x, y, i;
  for (i = 0; i < d.length; i++) d[i] = m[i] ? 0 : INF;
  for (y = 0; y < GRID; y++) for (x = 0; x < GRID; x++) {
    i = y * GRID + x;
    if (y > 0) d[i] = Math.min(d[i], d[i - GRID] + 1);
    if (x > 0) d[i] = Math.min(d[i], d[i - 1] + 1);
    if (y > 0 && x > 0) d[i] = Math.min(d[i], d[i - GRID - 1] + 1.414);
    if (y > 0 && x < GRID - 1) d[i] = Math.min(d[i], d[i - GRID + 1] + 1.414);
  }
  for (y = GRID - 1; y >= 0; y--) for (x = GRID - 1; x >= 0; x--) {
    i = y * GRID + x;
    if (y < GRID - 1) d[i] = Math.min(d[i], d[i + GRID] + 1);
    if (x < GRID - 1) d[i] = Math.min(d[i], d[i + 1] + 1);
    if (y < GRID - 1 && x < GRID - 1) d[i] = Math.min(d[i], d[i + GRID + 1] + 1.414);
    if (y < GRID - 1 && x > 0) d[i] = Math.min(d[i], d[i + GRID - 1] + 1.414);
  }
  return d;
}
function compare(ch, strokes) {
  var G = glyphMask(ch), U = inkMask(strokes);
  var gn = 0, un = 0, i;
  for (i = 0; i < G.length; i++) { gn += G[i]; un += U[i]; }
  if (!gn || !un) return null;
  var TOL = GRID * 0.055;                        // 約 7 格，手寫抖一點不計較
  var dU = distMap(U), dG = distMap(G);
  var covered = 0, clean = 0;
  for (i = 0; i < G.length; i++) {
    if (G[i] && dU[i] <= TOL) covered++;          // 這個字該有的地方，他寫到了
    if (U[i] && dG[i] <= TOL) clean++;            // 他寫的線，落在這個字上面
  }
  return { cover: covered / gn, clean: clean / un };
}

/* 把小孩寫的線畫成一張縮圖（判定面板和家長面板都用這個） */
function inkThumb(strokes, px) {
  var cv = document.createElement('canvas');
  cv.width = px * dpr; cv.height = px * dpr;
  cv.style.width = '100%'; cv.style.height = '100%';
  var c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.strokeStyle = '#40352B'; c2.lineWidth = 11 * (px / SIZE);
  c2.lineCap = 'round'; c2.lineJoin = 'round';
  strokes.forEach(function (st) {
    c2.beginPath();
    st.forEach(function (pt, i) {
      var x = pt[0] * px / SIZE, y = pt[1] * px / SIZE;
      if (i) c2.lineTo(x, y); else c2.moveTo(x, y);
    });
    c2.stroke();
  });
  return cv;
}

function say(t, cls) {
  $('verdict').innerHTML = t ? '<span class="' + (cls || '') + '">' + t + '</span>' : '';
}

function syncStrokeN() {
  var n = strokeCount(cur.c);
  if (mode === 'stroke') {
    $('strokeN').textContent = !n ? '這個字還沒有筆順資料'
      : step >= n ? '寫完了，一共 ' + n + ' 筆'
      : '第 ' + (step + 1) + ' 筆 / 一共 ' + n + ' 筆';
  } else {
    $('strokeN').textContent = strokesDone.length ? '寫了 ' + strokesDone.length + ' 筆' : '';
  }
}

function loadQ() {
  cur = QS[qi % QS.length];
  strokesDone = []; drawing = null; step = 0; wrongStreak = 0;
  if (anim) { clearInterval(anim); anim = null; }
  $('bpmf').textContent = cur.b;
  $('word').innerHTML = cur.w.replace('＿', '<u>＿</u>');
  $('qhint').textContent = mode === 'stroke'
    ? '照筆順一筆一筆寫，寫錯那一筆會退回去'
    : '在格子裡寫這個字，寫好按下面那顆';
  $('ghost').textContent = cur.c; fitGhost();
  $('ghost').classList.add('off');
  say('');
  drawGrid(); paintInk(); syncStrokeN();
  $('doneBtn').hidden = mode === 'stroke';
}

/* ── 手指／滑鼠 ── */
function xy(e) {
  var r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * (SIZE / r.width), (e.clientY - r.top) * (SIZE / r.height)];
}
pad.addEventListener('pointerdown', function (e) {
  if (anim) { clearInterval(anim); anim = null; paintInk(); }
  pad.setPointerCapture(e.pointerId);
  drawing = [xy(e)];
  paintInk();
});
pad.addEventListener('pointermove', function (e) {
  if (!drawing) return;
  var p = xy(e), last = drawing[drawing.length - 1];
  if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 2) return;   // 太密的點不收
  drawing.push(p);
  paintInk();
});
function endStroke() {
  if (!drawing) return;
  var s = drawing; drawing = null;
  if (mode === 'stroke') {
    var n = strokeCount(cur.c);
    if (!n) { strokesDone.push(s); paintInk(); syncStrokeN(); return; }   // 沒有筆順資料就不判
    if (step >= n) {                        // 寫完了還多寫，不能默默收下
      paintInk();
      say('這個字只有 ' + n + ' 筆，已經寫完了 —— 多的那一筆不算', 'no');
      return;
    }
    var want = medianPts(cur.c, step);
    var r = checkStroke(s, want);
    if (!r.ok) {
      paintInk(function (line) { line(want, 'rgba(242,112,92,.45)', 11); });  // 正確的那一筆亮出來
      say('第 ' + (step + 1) + ' 筆' + r.why + '，再寫一次（灰色的是正確的那一筆）', 'no');
      setTimeout(function () { paintInk(); }, 1400);
      return;
    }
    strokesDone.push(want);        // 收進來的是標準的那一筆，寫完會是漂亮的字
    step++;
    paintInk(); syncStrokeN();
    if (step >= strokeCount(cur.c)) say('全部 ' + step + ' 筆都對了！🎉', 'ok');
    else say('第 ' + step + ' 筆對了 ✓', 'ok');
    return;
  }
  strokesDone.push(s);
  paintInk(); syncStrokeN(); say('');
}
pad.addEventListener('pointerup', endStroke);
pad.addEventListener('pointercancel', endStroke);
pad.addEventListener('pointerleave', function () { if (drawing) endStroke(); });

/* ── 按鈕 ── */
$('clearBtn').addEventListener('click', function () {
  strokesDone = []; drawing = null; step = 0;
  if (anim) { clearInterval(anim); anim = null; }
  paintInk(); syncStrokeN(); say('');
});
$('undoBtn').addEventListener('click', function () {
  strokesDone.pop();
  if (mode === 'stroke' && step > 0) step--;
  paintInk(); syncStrokeN(); say('');
});
$('ghostBtn').addEventListener('click', function () {
  $('ghost').classList.toggle('off');
});
$('doneBtn').addEventListener('click', function () {
  if (!strokesDone.length) { say('還沒寫喔', 'no'); return; }
  var cmp = compare(cur.c, strokesDone);
  var want = MOE_STROKES[cur.c] || 0;
  var got = strokesDone.length;
  var box = inkThumb(strokesDone, 130);
  var lv = L(), bad = [];
  var diff = want ? Math.abs(got - want) : 0;
  if (want && diff > lv.strokeSlack) {
    bad.push(got > want ? '多寫了 ' + (got - want) + ' 筆（這個字 ' + want + ' 畫，你寫了 ' + got + ' 筆）'
                        : '少了 ' + (want - got) + ' 筆（這個字 ' + want + ' 畫，你寫了 ' + got + ' 筆）');
  }
  if (cmp) {
    if (cmp.cover < lv.cover) bad.push('有些地方沒寫到（寫到 ' + Math.round(cmp.cover * 100) + '%）');
    if (cmp.clean < lv.clean) bad.push('有些筆畫寫到字的外面去了（' + Math.round((1 - cmp.clean) * 100) + '% 在外面）');
  }
  var pass = !bad.length;
  /* 「差一點」：只差 1 筆、而且兩個百分比都還在 70 以上。
     這種才把家長通道亮起來，小孩整個亂寫的話不會亮。 */
  var near = !pass && diff <= lv.strokeSlack + 1 &&
             !!cmp && cmp.cover >= lv.cover - 0.12 && cmp.clean >= lv.clean - 0.12;
  if (pass) wrongStreak = 0; else wrongStreak++;
  var stuck = wrongStreak >= 3;
  if (stuck) $('ghost').classList.remove('off');   // 連錯三次，描紅自動打開
  $('verdict').innerHTML =
    '<div class="compare">' +
      '<figure><div class="box" id="mine"></div><figcaption>你寫的</figcaption></figure>' +
      '<figure><div class="box">' + cur.c + '</div><figcaption>課本的字</figcaption></figure>' +
    '</div>' +
    '<p class="' + (pass ? 'ok' : 'no') + '" style="font-size:1.05rem;margin:10px 0 2px">' +
      (pass ? '寫對了！ ⭕' : '再看一下 ✗') + '</p>' +
    (bad.length ? '<p class="note" style="margin-top:2px">' + bad.join('<br>') + '</p>' : '') +
    (cmp ? '<p class="note" style="color:var(--ink-faint)">寫到了 ' + Math.round(cmp.cover * 100) +
           '%　・　沒寫歪出去 ' + Math.round(cmp.clean * 100) + '%' +
           (want ? '　・　筆畫 ' + got + '／' + want : '') + '</p>' : '') +
    (near ? '<div><span class="near-tag">差一點點</span></div>' : '') +
    '<div class="row" style="margin-top:10px">' +
      (pass ? '<button class="btn primary grow" id="nx">換一題 →</button>'
            : '<button class="btn primary grow" id="again">✏️ 再寫一次</button>') +
    '</div>' +
    /* 寫錯的時候不給「換一題」。要跳過只有一條路：大人看過、答對驗證題。 */
    (pass ? '' :
      '<button class="adult-link' + (near || stuck ? ' hot' : '') + '" id="adultBtn">' +
        (stuck ? '寫好幾次了？家長／老師可以看一下 →' : '家長／老師：這樣算過 →') +
      '</button>');
  $('mine').appendChild(box);
  box.style.width = '100%'; box.style.height = '100%';
  if (pass) {
    $('nx').addEventListener('click', function () { qi++; loadQ(); });
  } else {
    $('again').addEventListener('click', function () {
      strokesDone = []; paintInk(); syncStrokeN();
      say(stuck ? '描紅打開了，照著描一遍看看' : '再寫一次，可以先按「描紅」照著描一遍');
    });
    $('adultBtn').addEventListener('click', function () { openGate(cmp, got, want); });
  }
});
$('nextBtn').addEventListener('click', function () { qi++; loadQ(); });

/* 判定寬鬆度的開關。併進 chinese.html 的時候這一段要搬進設定頁，不要留在練習畫面上。 */
function syncLevel() {
  var lv = L();
  document.querySelectorAll('#levelSeg button').forEach(function (b) {
    b.classList.toggle('sel', b.dataset.level === level);
  });
  $('levelHint').textContent = '寫到 ' + Math.round(lv.cover * 100) + '% 以上、沒歪出去 ' +
    Math.round(lv.clean * 100) + '% 以上就算過' +
    (lv.strokeSlack ? '，筆畫數差 ' + lv.strokeSlack + ' 筆之內也算' : '，筆畫數要正確');
}
$('levelSeg').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button');
  if (!b) return;
  level = b.dataset.level;
  try { localStorage.setItem('writeDemoLevel', level); } catch (err) {}
  syncLevel();
  say('改成「' + L().name + '」了，再寫一次試試看');
});
syncLevel();

/* ────────── 家長／老師通道 ──────────
   寫錯的時候小孩只有「再寫一次」。要跳過只有這一條路：
   大人看過他寫的字，再答一題二位數乘法。刻意避開九九表（11–19 × 3–9），
   一年級算不出來，大人兩秒。答錯就換一題新的。 */
/* ────────── 家長／老師通道 ──────────
   只有一道關卡：一題大人一定會、一年級一定不會的數學。
   不用設定、不用記、不存任何東西，所以每一台平板、每一支手機行為都一樣。 */
var gateAns = 0;
var buf = '';             // 鍵盤打到現在的字串

/* 只出平方題，2–9。答案是 4、9、16、25、36、49、64、81，大人一眼就有。
   刻意不用純九九乘法——隔壁 multiplication.html 就在練那個，背熟就破了；
   平方是一年級還沒有的概念，不是算不出來，是不知道在問什麼。
   數字每次隨機，小孩在旁邊看大人按也學不起來。
   不用分子分母那種：答案就印在題目上，兩個數字亂猜有一半會中。
   也不用固定答案那種（例如三角形內角和永遠是 180）：看一次就記住了。 */
function adultQ() {
  var n = 2 + Math.floor(Math.random() * 8);       // 2–9
  return { q: n + ' 的平方是多少？', a: n * n };
}

/* 數字鍵盤。iPad 橫式叫出系統鍵盤會吃掉大半個畫面，所以自己畫一個。 */
(function buildKeypad() {
  ['1','2','3','4','5','6','7','8','9','⌫','0','清除'].forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = k;
    if (k === '⌫' || k === '清除') b.className = 'k-sub';
    b.addEventListener('click', function () { tapKey(k); });
    $('keypad').appendChild(b);
  });
})();

function tapKey(k) {
  $('gateBad').classList.add('off');
  if (k === '清除') buf = '';
  else if (k === '⌫') buf = buf.slice(0, -1);
  else if (buf.length < 6) buf += k;
  $('gateDots').textContent = buf || '　';
}

function newQuestion() {
  var q = adultQ();
  gateAns = q.a;
  buf = '';
  $('gateQ').textContent = q.q;
  $('gateDots').textContent = '　';
  $('gateAsk').classList.remove('off');
  $('gateDo').classList.add('off');
}

function submitGate() {
  if (parseInt(buf, 10) === gateAns) {             // 答對，給放行選項
    $('gateAsk').classList.add('off');
    $('gateDo').classList.remove('off');
    return;
  }
  newQuestion();                                   // 答錯就換一題新的
  $('gateBad').classList.remove('off');
}

function openGate(cmp, got, want) {
  $('gateCompare').innerHTML =
    '<figure><div class="box" id="gateMine"></div><figcaption>他寫的</figcaption></figure>' +
    '<figure><div class="box">' + cur.c + '</div><figcaption>課本的字</figcaption></figure>';
  $('gateMine').appendChild(inkThumb(strokesDone.slice(), 110));
  $('gateNums').textContent = cmp
    ? '寫到了 ' + Math.round(cmp.cover * 100) + '%　・　沒寫歪出去 ' +
      Math.round(cmp.clean * 100) + '%' + (want ? '　・　筆畫 ' + got + '／' + want : '')
    : '';
  $('gateBad').classList.add('off');
  newQuestion();
  $('sheet').classList.remove('off');
}
function closeGate() { $('sheet').classList.add('off'); }

$('gateOk').addEventListener('click', submitGate);
$('gateCancel').addEventListener('click', closeGate);
$('gateRetry').addEventListener('click', function () {
  closeGate();
  strokesDone = []; paintInk(); syncStrokeN();
  say('再寫一次，可以先按「描紅」照著描一遍');
});
$('gatePass').addEventListener('click', function () {
  /* 併進 chinese.html 的時候，這裡要送 logRecent(cur.c, true, 'adult')，
     熟練度照算過，但紀錄要留 by:'adult'——被放行的字其實正是最該回頭再練的。 */
  adultPassed.push(cur.c);
  closeGate();
  qi++; loadQ();
  say('大人說這樣算過 ⭕', 'ok');
});
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeGate(); });
loadQ();
</script>
