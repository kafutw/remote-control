<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="看注音寫字">
  <!--
    田字格 ＋ 一筆「撇」，磚紅底反白。
    這支 app 就是在田字格裡寫字、判字形和筆順，所以畫的是「正在寫的那一筆」。

    為什麼是撇不是橫：橫縮小之後跟減號分不出來。
    撇有起筆的頓和收筆的尖，32px 還看得出是毛筆的一筆。

    為什麼是深底反白：放在淺色桌面上比淺底版跳，32px 的對比也最強。

    ⚠️ 內容全部在中央 76%（x,y 約 [112, 400]）以內。
    manifest 若宣告 maskable，Android 會用自己的遮罩切（可能切成圓形），
    畫到邊緣就會被裁掉。底色必須滿版，否則遮罩後會露出透明角。
  -->
  <rect width="512" height="512" fill="#D9603C"/>
  <rect x="89.6" y="89.6" width="332.8" height="332.8" rx="38.4"
        fill="none" stroke="#FFFFFF" stroke-opacity=".85"
        stroke-width="18.4" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-opacity=".5" stroke-width="11.3"
     stroke-linecap="round" stroke-dasharray="25.6 25.6">
    <line x1="112.9" y1="256" x2="399.1" y2="256"/>
    <line x1="256" y1="112.9" x2="256" y2="399.1"/>
  </g>
  <g fill="#FFF6EE">
    <circle cx="325.1" cy="125.4" r="24.6"/>
    <path d="M298.8 121.3L298.9 134.8L298.6 147.6L294.8 159.4L292.6 171.3L289.9 182.9L286.9 194.4L283.4 205.7L279.5 216.8L275.1 227.9L270.2 238.8L264.9 249.7L259 260.6L252.6 271.5L245.7 282.4L238.2 293.3L230.2 304.2L221.6 315.3L212.4 326.4L202.7 337.7L192.5 349L181.6 360.6L170.2 372.3L158.3 384.3L145.9 396.8L160.5 387L174.4 377.1L187.6 367.3L200.2 357.4L212.4 347.6L224 337.8L235 327.9L245.6 317.9L255.7 307.9L265.3 297.8L274.4 287.5L283.1 277L291.3 266.3L299 255.4L306.3 244.2L313.1 232.8L319.5 221L325.4 208.9L330.8 196.5L335.8 183.8L340.3 170.7L342.3 156.8L347.1 143.2L351.4 129.6Z"/>
  </g>
</svg>
